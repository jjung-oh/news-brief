name: news-brief

on:
  schedule:
    - cron: "5 * * * *"
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "collect 또는 build"
        default: "build"

permissions:
  contents: write

concurrency: news-brief

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 실행 모드 결정
        id: m
        run: |
          if [ "${{ github.event.schedule }}" = "30 22 * * *" ] || [ "${{ github.event.inputs.mode }}" = "build" ]; then
            echo "mode=build" >> "$GITHUB_OUTPUT"
          else
            echo "mode=collect" >> "$GITHUB_OUTPUT"
          fi
      - run: python brief.py ${{ steps.m.outputs.mode }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: 결과 저장
        run: |
          git config user.name "news-brief-bot"
          git config user.email "bot@users.noreply.github.com"
          git add store.json news.json docs
          git diff --cached --quiet || (git commit -m "update $(date -u +%FT%TZ)" && git push)
