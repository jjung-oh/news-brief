name: news-brief

on:
  schedule:
    - cron: "5 * * * *"        # 매시간: 기사 수집만
    - cron: "50 21 * * *"      # 한국 시간 06:50: 요약 + 페이지 생성
    - cron: "40 22,23 * * *"   # 한국 시간 07:40, 08:40: 요약이 실패했을 때만 다시 시도
  workflow_dispatch:
    inputs:
      mode:
        description: "collect / build / build-if-needed"
        default: "build"

permissions:
  contents: write

concurrency: news-brief

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 실행 모드 결정
        id: m
        run: |
          S="${{ github.event.schedule }}"
          I="${{ github.event.inputs.mode }}"
          if [ "$S" = "50 21 * * *" ]; then
            MODE=build
          elif [ "$S" = "40 22,23 * * *" ]; then
            MODE=build-if-needed
          elif [ -n "$I" ]; then
            MODE="$I"
          else
            MODE=collect
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
      - run: python brief.py ${{ steps.m.outputs.mode }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
      - name: 결과 저장
        run: |
          git config user.name "news-brief-bot"
          git config user.email "bot@users.noreply.github.com"
          git add store.json news.json docs
          if ! git diff --cached --quiet; then
            git commit -m "update $(date -u +%FT%TZ)"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              sleep 5
            done
          fi
