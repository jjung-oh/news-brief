<html lang="ko">
<head>
<meta charset="utf-8">

<style>
:root{--bg:#fff6f0;--card:#fff;--ink:#4a3a3a;--sub:#8a7468;--bd:#f0dcc6;--accent:#ff6f91;--onacc:#fff;--tint:#e3f3ff;--tbd:#bfe0f7;
--skyM:linear-gradient(170deg,#ffe3b3,#ffc2d4 55%,#b9ddff);--onM:#4a3a3a;
--skyE:linear-gradient(170deg,#5b4aa8,#8f5db8 60%,#c26aa9);--onE:#fff;
--disp:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
--sans:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1830;--card:#2b2344;--ink:#fff1e6;--sub:#c4b6d9;--bd:#40355f;--accent:#ff8fab;--onacc:#2a1730;--tint:#1f3350;--tbd:#2f4d75;
--skyM:linear-gradient(170deg,#5a4263,#8a5566 55%,#3b5c8f);--onM:#fff;--skyE:linear-gradient(170deg,#171236,#2d2160 55%,#5a3070);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1e1830;--card:#2b2344;--ink:#fff1e6;--sub:#c4b6d9;--bd:#40355f;--accent:#ff8fab;--onacc:#2a1730;--tint:#1f3350;--tbd:#2f4d75;
--skyM:linear-gradient(170deg,#5a4263,#8a5566 55%,#3b5c8f);--onM:#fff;--skyE:linear-gradient(170deg,#171236,#2d2160 55%,#5a3070);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;word-break:keep-all;overflow-wrap:break-word}
body[data-tab="m"]{--sky:var(--skyM);--on:var(--onM)}
body[data-tab="e"]{--sky:var(--skyE);--on:var(--onE)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
body[data-tab="m"] .e-only,body[data-tab="e"] .m-only{display:none}

/* 하늘 + 뉴콩이 */
.sky{position:relative;overflow:hidden;background:var(--sky);color:var(--on);border-radius:0 0 34px 34px;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 20px;transition:background .4s}
.sky-in{position:relative;max-width:640px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-family:var(--disp);font-weight:400;font-size:29px;line-height:1.25;margin:0}
.date{margin:4px 0 0;font-size:14px;opacity:.85}
.hi{font-family:var(--disp);font-size:16px;margin-top:2px}
.orb{position:absolute;right:120px;top:2px;width:40px;height:40px;border-radius:50%}
body[data-tab="m"] .orb{background:radial-gradient(circle at 40% 40%,#fffbe0,#ffd566 65%);box-shadow:0 0 20px 6px rgba(255,214,102,.6)}
body[data-tab="e"] .orb{background:#fff7d6;box-shadow:inset -9px -3px 0 0 rgba(140,110,190,.55),0 0 18px 3px rgba(255,255,255,.3)}
.deco{position:absolute;font-size:20px;pointer-events:none}
.d1{right:36%;top:46px}.d2{right:10px;top:4px;font-size:15px}.d3{left:52%;top:8px;font-size:14px}
.mascot-wrap{position:relative;flex:none;width:100px}
.mascot{display:block;width:100px;height:100px;overflow:visible}
.mascot *{transform-box:fill-box}
.eyes-shut,.mouth-talk{display:none}
body[data-tab="m"] .eyes-shut{display:none}
body[data-tab="e"]:not(.talk) .eyes-open{display:none}
body[data-tab="e"]:not(.talk) .eyes-shut{display:inline}
.wave{transform-origin:50% 85%;animation:wave 1.8s ease-in-out infinite}
body[data-tab="e"] .wave{animation:none}
.zz{font-family:var(--disp);font-size:15px;fill:#fff;animation:zz 2.4s ease-in-out infinite}
.talk .mouth{display:none}
.talk .mouth-talk{display:inline;transform-origin:center;animation:yap .32s ease-in-out infinite alternate}
.talk .bob{animation:bob .5s ease-in-out infinite alternate}
.note{position:absolute;font-size:18px;opacity:0;color:var(--on)}
.n1{left:-4px;top:6px}.n2{right:-2px;top:-4px}
.talk .note{animation:note 1.5s ease-out infinite}
.talk .n2{animation-delay:.7s}
@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(22deg)}}
@keyframes yap{from{transform:scaleY(.35)}to{transform:scaleY(1.25)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes zz{0%,100%{opacity:.4;transform:translateY(2px)}50%{opacity:1;transform:translateY(-3px)}}
@keyframes note{0%{opacity:0;transform:translateY(8px)}30%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
.notice{display:inline-block;margin:10px 0 14px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.35);font-size:12.5px}
.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.3);max-width:340px}
.tab{flex:1;padding:9px 0;border:0;border-radius:999px;background:transparent;font-family:var(--disp);font-size:16px;color:var(--on)}
.tab[aria-selected="true"]{background:#fff;color:#4a3a3a;box-shadow:0 2px 0 rgba(0,0,0,.12)}

main{max-width:640px;margin:0 auto;padding:18px 16px 160px}
.tl{font-size:13px;color:var(--sub);margin:0 0 12px 4px}
.empty{color:var(--sub);font-size:15px;padding:36px 0;text-align:center}

/* 말랑한 기사 카드: 번호 = 전체 듣기 재생 순서 */
.row{--bd2:var(--bd);background:var(--card);border:2px solid var(--bd);border-radius:24px;margin-bottom:14px;box-shadow:0 4px 0 var(--bd);transition:border-color .2s,box-shadow .2s}
@supports (color:color-mix(in srgb,red,blue)){.row{--bd2:color-mix(in srgb,var(--c) 35%,var(--bg));border-color:var(--bd2);box-shadow:0 4px 0 var(--bd2)}}
.row.playing{border-color:var(--c);box-shadow:0 4px 0 var(--c)}
.head{display:grid;grid-template-columns:38px 1fr 44px;gap:10px;padding:14px}
.no{width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;font-family:var(--disp);font-size:19px;display:grid;place-items:center}
.playing .no{animation:hop .6s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-4px)}}
.tg{text-align:left;background:none;border:0;padding:0;min-width:0}
.cat{display:inline-flex;align-items:center;gap:6px;font-family:var(--disp);font-size:13px;color:var(--c);padding:1px 10px;border-radius:999px;border:1.5px solid var(--c)}
.tg h2{font-family:var(--disp);font-weight:400;font-size:18px;line-height:1.45;margin:6px 0 6px}
.tg p{margin:0;color:var(--sub);font-size:14.5px}
.more{display:inline-block;margin-top:8px;font-family:var(--disp);font-size:13px;color:var(--accent)}
.more::after{content:" ▾"}
.open .more::after{content:" ▴"}
.spk{width:44px;height:44px;border-radius:50%;border:2px solid var(--bd);background:var(--bg);font-size:18px;transition:background .2s}
.playing .spk{background:var(--c);border-color:var(--c)}
.eq{display:none;gap:2px;align-items:flex-end;height:11px}
.playing .eq{display:inline-flex}
.eq i{width:3px;background:var(--c);border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.25s}.eq i:nth-child(3){animation-delay:.5s}
@keyframes eq{0%,100%{height:3px}50%{height:11px}}

.detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease;margin:0 14px 0 62px;font-size:14px}
.open .detail{grid-template-rows:1fr}
.detail>div{overflow:hidden}
.open .detail>div{padding-bottom:16px}
.detail h3{font-family:var(--disp);font-weight:400;font-size:13px;color:var(--sub);margin:12px 0 4px}
.detail ul{margin:0;padding-left:18px}
.detail li{margin-bottom:3px}
.kw span{display:inline-block;font-size:12.5px;background:var(--bg);border-radius:999px;padding:0 10px;margin:0 4px 4px 0;color:var(--sub)}
.src{font-size:12.5px;color:var(--sub)}
.lk a{display:inline-block;font-size:13px;color:var(--accent);margin-right:14px}

/* 날씨 */
.wx{background:var(--tint);border-color:var(--tbd);box-shadow:0 4px 0 var(--tbd)}
.wx .no{background:var(--card);font-size:22px;color:inherit}

/* 플레이어 */
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:616px;margin:0 auto;background:var(--card);border:2px solid var(--bd);border-radius:26px;padding:10px 12px;box-shadow:0 4px 0 var(--bd),0 12px 24px rgba(60,30,40,.15);z-index:5}
.np{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px 8px}
.ctl{display:flex;gap:8px;align-items:center}
.ctl button,.ctl select{height:44px;border:2px solid var(--bd);background:var(--bg);color:var(--ink);border-radius:16px;font-family:var(--disp);font-size:16px;padding:0 14px}
.ctl .main{flex:1;background:var(--accent);border-color:var(--accent);color:var(--onacc)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

var DATA=[{"label": "전날 18:00–24:00 기사 기준", "items": [{"c": "정치", "h": "이재명 대통령, 국정원장 등 5개 부처 중폭 개각 단행", "s": "이재명 대통령이 외교안보 라인을 포함해 5개 부처 수장을 교체하는 중폭 개각을 단행했습니다. 신임 국가정보원장 후보자에는 강금실 전 법무부 장관이, 통일부 장관 후보자에는 홍익표 전 청와대 정무수석이 발탁됐습니다.", "pts": ["이재명 대통령은 강금실 국정원장, 임웅순 외교부 장관, 홍익표 통일부 장관 후보자 등을 지명했습니다.", "한미 관계 이상설 및 트럼프 대통령과의 정상회담 가능성 속에서 자주파 안보라인이 전격 교체된 것으로 풀이됩니다.", "수능 부정 사태 등 산적한 현안 속 교육부 장관 후속 인선 발표도 이어질 전망입니다."], "kw": ["중폭 개각", "강금실", "홍익표", "한미관계"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859667&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859604&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859606&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "경제", "h": "코스피 3.3% 급락…증안펀드 동원 시사", "s": "코스피가 장중 폭락세를 거쳐 3.3% 하락한 4,708로 마감했습니다. 정부는 10조 원 규모의 증권시장 안정펀드 가동을 준비하며 대책 마련에 나섰습니다.", "pts": ["외국인의 7거래일 연속 매도세로 삼성전자와 SK하이닉스가 하락하며 지수를 끌어내렸습니다.", "정부는 10조 원대 증안펀드 준비와 비상계획 시행 방침을 밝혔으나 시장 반전 카드로 한계가 있다는 지적도 나옵니다.", "미국 뉴욕증시는 젠슨 황 CEO의 엔비디아 복귀 소식에 급등 출발했습니다."], "kw": ["코스피", "증안펀드", "엔비디아", "젠슨 황"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859609&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859665&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859797&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "국제", "h": "우크라이나, 리비아 연안 러시아 초계함 드론 공격 침몰", "s": "우크라이나가 리비아 벵가지 해군기지에 정박 중이던 러시아 초계함 메르쿠리호를 해상 드론으로 공격해 침몰시켰습니다. 양측의 충돌이 격화하는 가운데 성탄절 전 종전 협상 재개 가능성도 제기됩니다.", "pts": ["젤렌스키 대통령은 해상 드론 7대를 투입해 러시아 초계함과 헬기, 화물선을 공격했다고 밝혔습니다.", "러시아는 키이우 인근 주거시설과 에너지 기반시설을 공습하며 보복 대응에 나섰습니다.", "전선이 지중해까지 확장된 가운데, 미국이 제안한 성탄절 전 3자 회담을 통한 종전 협상 타결 여부가 주목됩니다."], "kw": ["우크라이나", "해상 드론", "러시아 초계함", "종전협상"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859589&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859689&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859627&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "대법원, 한덕수 일부 무죄 취지 파기환송…조희대 탄핵 공방", "s": "대법원이 한덕수 전 총리의 내란 중요 임무 종사 혐의 중 일부를 무죄 취지로 파기환송했습니다. 정치권에서는 조희대 대법원장에 대한 탄핵 추진과 수사 결과에 대한 공방이 이어졌습니다.", "pts": ["대법원은 비상계엄의 위헌성은 인정하면서도, 계엄 선포 전 국무회의 건의 행위에 대해서는 국헌문란 목적 증거가 부족하다고 봤습니다.", "계엄 선포 이후 행위에 대해서는 국헌문란 목적이 인정될 수 있다고 명확한 기준을 제시했습니다.", "민주당은 조 대법원장의 계엄 협조 의혹을 이유로 탄핵을 추진하나, 특검은 불기소 및 각하 처분을 내렸던 바 있습니다."], "kw": ["한덕수", "대법원", "비상계엄", "조희대"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008858906&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859615&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "정치", "h": "한동훈 \"조작 징계 무효화\" vs 장동혁 \"본질 안 바뀌어\"", "s": "무소속 한동훈 의원이 국민의힘 윤리위의 제명 결정 과정에 조작과 공작이 있었다며 장동혁 대표의 책임을 요구했습니다. 장동혁 대표는 당원 게시판 사건의 본질은 변하지 않는다고 반박했습니다.", "pts": ["한동훈 의원은 징계 날짜와 내용에 대한 사전 논의 정황을 들어 징계 원천 무효와 복당 후 대여 투쟁을 주장했습니다.", "황경성 윤리위원은 장동혁 대표와 최 전 교수 간의 메시지를 공개하며 대표의 직간접 개입 의혹을 폭로했습니다.", "장동혁 대표는 이 같은 의혹에 대해 대응할 필요가 없다며 징계의 정당성을 유지했습니다."], "kw": ["한동훈", "장동혁", "국민의힘", "윤리위 징계"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859635&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "경제", "h": "최태원, 노소영에 재산분할금 9,440억 원 전액 지급 의사", "s": "최태원 SK그룹 회장이 노소영 관장과의 재산분할금 9천440억 원을 전액 지급하겠다며 대법원에 화해권고 결정을 요청했습니다. 대법원의 권고를 양측이 받아들일 경우 9년 만에 소송이 마무리됩니다.", "pts": ["최 회장은 분쟁의 원만하고 최종적인 마무리를 위해 대법원에 화해권고 결정을 신청했다고 밝혔습니다.", "파기환송심 재판부가 산정한 9,440억 원의 재산분할금에 대해 전액 지급 방침을 세웠습니다.", "양측이 이의를 제기하지 않을 경우 지난 2017년부터 이어진 9년 간의 법적 다툼이 최종 종료됩니다."], "kw": ["최태원", "노소영", "재산분할", "화해권고"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859616&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "음주운전 사고 배우 고경표 경찰 출석…\"무책임했다\" 사과", "s": "만취 상태로 운전하다 청소차를 들이받은 배우 고경표 씨가 피의자 신분으로 경찰에 출석했습니다. 고 씨는 조사 성실 이행과 함께 음주 사실을 인정하며 사과했습니다.", "pts": ["고경표 씨는 면허취소 수준인 혈중알코올농도 0.15% 상태로 운전하다 청소차와 충돌하는 사고를 냈습니다.", "경찰은 작업자 부상 여부에 따라 교통사고처리특례법상 치상 또는 위험운전치상죄 적용을 검토하고 있습니다.", "과거 교통안전 홍보대사 이력이 알려진 가운데, 고 씨는 출연 중이던 방송 프로그램에서 하차했습니다."], "kw": ["고경표", "음주운전", "경찰 조사", "청소차 충돌"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859690&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859617&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "날씨", "h": "올겨울 강한 엘니뇨로 덜 춥지만 '북극 한파' 충돌 변수", "s": "올겨울은 역대급 엘니뇨의 영향으로 평년보다 기온이 높고 눈비가 많을 것으로 전망됩니다. 그러나 북극해 얼음이 많이 녹아 기습 한파와 폭설이 찾아올 가능성도 큽니다.", "pts": ["동태평양 수온이 평년보다 2.6도 높아진 강한 엘니뇨 영향으로 따뜻한 남풍이 유입되며 겨울 기온이 상승할 수 있습니다.", "바렌츠해와 카라해의 해빙 감소로 인해 블로킹 고기압이 형성되면서 기습적인 북극 한파가 유입될 여지가 있습니다.", "따뜻한 바다 수온과 북극 한파가 만날 경우 1월 중 강한 한파와 대설이 발생할 수 있습니다."], "kw": ["겨울 날씨", "엘니뇨", "북극 한파", "폭설"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859623&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "권익위, 수능 부정행위 신고 포상금 최대 5억 원 확대", "s": "국민권익위원회가 수능 부정행위 신고 포상금을 최대 5억 원으로 확대한다고 발표했습니다. 부정행위 의혹 인물의 사망과 책 웃돈 거래 등 사회적 불안감이 가중되는 상황입니다.", "pts": ["권익위는 당초 안내한 1억 원에서 공익신고자 보호법을 적용해 포상금 상한을 최대 5억 원까지 상향했습니다.", "자발적 자수 후 공동 부정행위자를 신고할 경우 처벌 감경 및 포상금 지급 혜택이 적용됩니다.", "리트 만점자 이진우 씨의 사망 후 관련 수사와 과거 수능 부정행위에 대한 정부의 추적 조사가 진행 중입니다."], "kw": ["수능 부정행위", "권익위", "신고 포상금", "5억 원"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859662&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859666&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "경제", "h": "금융위, 롯데카드 '정보유출 위험 미공시' 과징금 10억 원", "s": "고객 정보 유출 사실을 겪은 롯데카드가 회사채 발행 과정에서 해당 위험을 제대로 공시하지 않아 과징금을 부과받았습니다. 금융위원회는 자본시장법 위반을 적용해 10억 2천만 원 조치를 결정했습니다.", "pts": ["롯데카드는 297만 명 규모의 정보 유출을 파악했음에도 회사채 발행 공시 서류에 위험을 충분히 명시하지 않았습니다.", "금융위는 1,700억 원 상당의 회사채를 발행할 당시 유출 위험 누락을 공시 의무 위반으로 판단했습니다.", "롯데카드 측은 당시 미확정 상태였음을 해명하면서도 향후 공시 검증 절차를 강화하겠다고 밝혔습니다."], "kw": ["롯데카드", "정보유출", "금융위원회", "과징금"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859603&plink=RSSLINK&cooper=RSSREADER"}]}], "ok": true, "built": "2026-11-24"}, {"label": "당일 00:00–07:00 기사 기준", "items": [{"c": "날씨", "h": "오늘 경기 광주 날씨 구름 조금, 최저 -4도 최고 5도", "s": "오늘 경기 광주은 구름 조금, 최저 -4도 최고 5도입니다. 출근 시간대인 오전 8시에는 -1도입니다. 강수 확률은 최대 0퍼센트로, 우산은 필요 없겠습니다.", "pts": ["기온: 최저 -4도, 최고 5도 (오전 8시 -1도, 오후 6시 -2도)", "강수: 확률 최대 0퍼센트, 예상 강수량 0.0밀리미터", "바람: 최대 풍속 약 7미터", "미세먼지 좋음, 초미세먼지 좋음 (Open-Meteo 모델 예측치, 낮 시간 최대 기준)"], "kw": ["경기 광주", "구름 조금", "날씨"], "src": "Open-Meteo 예측 모델(기상청 공식 예보와 다를 수 있음)", "date": "2026-11-24"}, {"c": "알림", "h": "AI 요약이 안 돼서 기사 앞부분을 보여드려요", "s": "Gemini 서버가 혼잡하거나 사용량이 부족해요. 아래는 AI 없이 기사 본문의 앞부분을 그대로 가져온 거예요. 나중에 자동으로 다시 시도해요.", "pts": ["Actions 로그의 [오류] 줄에서 자세한 원인을 볼 수 있어요"], "kw": ["알림"], "src": "시스템"}, {"c": "뉴스", "h": "\"선생님 지나가면 몰래 AI 돌려요\"…내신도 비상", "s": "<앵커> 수능과 대학별 논술고사에 이어, 학교 내신 시험에서도 AI 부정행위에 대한 걱정이 커지고 있습니다. 대학 수시전형에서 내신 성적 비중이 높은데도, 관리는 상대적으로 허술한 상황인데요.", "pts": ["곧 시작되는 기말시험에도 비상이 걸렸습니다.", "<기자> 지난해 12월 교육부가 각 시교육청과 내놓은 수행평가 시 인공지능 AI 활용 관리 방안입니다.", "AI 부정행위를 막으려고 마련한 지침으로 자료 탐색은 AI 활용을 허용하지만, 글쓰기를 할 때는 금지하도록 규정합니다."], "kw": ["SBS"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859950&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "뉴스", "h": "왜 시키지도 않은 전화를…선 넘는 'AI 비서'", "s": "<앵커> 식당 예약 같은 일상 속 일들을 대신 처리해주는 인공지능 비서 서비스가 인기를 끌고 있습니다. 그런데 인공지능 비서가 허락도 없이 병원에 예약 전화를 거는가 하면, 상담 통화에서는 말을 계속 돌려가면서 전화를 끊지 않는 경우도 있다고 합니다.", "pts": ["모닝 줌인, 홍영재 기자입니다.", "<기자> 조현영 씨는 한 달 전부터 데이트 장소 추천부터 식당 예약, 앱으로 대기 번호표를 받는 원격 줄서기까지 AI 비서 앱에 맡기고 있습니다.", "[조현영/AI 비서 앱 사용자 : (식당을) 바꾸겠다, 그러면 이게 여자친구랑 저랑 이렇게 직접 대화하는 게 아니라 (AI) 비서끼리 대화를 해요."], "kw": ["SBS"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859949&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "뉴스", "h": "그때도 지금도 '첫 여성' 파격…돌아온 강금실", "s": "<앵커> 강금실 국정원장 후보자는 23년 전 최초의 여성 법무부 장관에 올랐던 인물이죠. 이번에 정식 임명된다면 헌정사상 처음으로 정보기관 수장을 맡은 여성이라는 또 하나의 기록을 쓰게 됩니다.", "pts": ["다만, 정보 분야 경험이 없는 것은 약점으로 지목됩니다.", "<기자> 지난 2003년 3월, 전국 생중계된 '검사와의 대화'.", "당시 노무현 대통령과 함께 평검사들을 마주한 강금실 법무장관은 자신을 향한 검찰 내부의 시선을 이렇게 받아넘겼습니다."], "kw": ["SBS"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859948&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "뉴스", "h": "젠슨 황 복귀에 '환호'…\"GPU 예수 부활\"", "s": "<앵커> 엔비디아 최고경영자로 전격 복귀한 젠슨 황을 향해, 실리콘밸리와 월가에서는 일제히 환영의 뜻을 밝혔습니다. 일론 머스크 테슬라 CEO는 실수가 바로잡혔다고 축하했고, 이번 복귀를 예수의 부활에 빗댄 평가까지 나왔습니다.", "pts": ["<기자> 'GPU 예수가 부활했다'.", "실리콘밸리의 유명 엔젤 투자자 제이슨 칼라카니스는 젠슨 황이 사임 11일 만에 엔비디아 최고경영자로 복귀하자 자신의 X에 이렇게 적었습니다.", "실리콘밸리 주요 인사들은 젠슨 황의 복귀를 반기며 잇따라 환영과 축하를 쏟아냈습니다."], "kw": ["SBS"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859951&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "뉴스", "h": "서울지하철 멈추나…노사 오늘 최종 교섭", "s": "<앵커> 전면파업을 예고한 서울지하철 노조가 오늘(24일) 사측인 교통공사와 최종교섭에 나섭니다. 협상이 결렬되면 내일 첫 차부터 파업이 시작되면서, 열차 운행이 줄며 혼란이 이어질 것으로 보입니다.", "pts": ["<기자> 서울교통공사 노사는 오늘 오전 10시부터 서울 성동구 본사에서 교섭을 벌입니다.", "노조는 오늘 교섭 결렬 시 내일부터 전면파업에 돌입한다고 밝힌 상태입니다.", "핵심 쟁점은 인력 감축 계획 철회와 인력확충입니다."], "kw": ["SBS"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859939&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "뉴스", "h": "\"작년 시험지 상당수 폐기\"…'AI 커닝' 검증 난항", "s": "<앵커> AI 부정행위 의혹이 대학수학능력시험으로 번지면서, 풀이 흔적이 남아 증거로 활용될 수 있는 지난해 수능 시험지를 보관하라고 앞서 정부가 지시했죠. 그런데 보존 기한 1년이 이미 지나버려서, 시험지 상당수가 폐기된 것으로 드러났습니다.", "pts": ["<기자> 교육부가 전국 시·도교육청에 \"지난해 수능 시험지를 보관하라\"고 지시한 것은 지난 18일입니다.", "법학적성시험 리트 만점자 고 이진우 씨가 과거 수능에서도 AI를 활용해 부정행위를 저질렀을 가능성이 제기되자, 향후 조사를 위해 자료를 보관해 두라는 취지였습니다.", "하지만 이미 당시 상당수 학교에서 지난해 수능 시험지를 폐기한 것으로 드러났습니다."], "kw": ["SBS"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859938&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "뉴스", "h": "[단독] \"피 흘린다\" 신고에 출동했더니…화장실서 마약", "s": "<앵커> 학교 근처에 있는 서울 도심의 한 공원 화장실에서 대낮에 필로폰을 투약하던 20대 여성이 경찰에 붙잡혔습니다. 이 여성은 지난달에도 마약을 갖고 있다가 경찰 수사를 받았던 것으로 파악됐습니다.", "pts": ["정지연 기자가 취재했습니다.", "<기자> 서울 마포구의 한 공원입니다.", "지난 10일 오전 11시쯤, 이 공원 화장실에서 누군가 피를 흘리고 있다는 112 신고가 접수됐습니다."], "kw": ["SBS"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859937&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "뉴스", "h": "최태원 \"9,440억 원 내겠다\"…9년 소송 끝내나", "s": "<앵커> 최태원 SK그룹 회장이 대법원 재상고심으로 향한 노소영 아트센터 나비 관장과의 재산분할 소송에서, 앞서 지급 판결을 받은 9천440억 원을 모두 내겠다며 '화해권고' 결정을 내려달라고 재판부에 요청했습니다. 두 사람의 법적 다툼이 9년 만에 마무리될지 관심이 쏠립니다.", "pts": ["<기자> 최태원 SK 회장과 노소영 아트센터 나비 관장은 이혼이 확정된 이후에도 재산분할 문제를 두고 소송을 이어왔습니다.", "지난해 10월, 대법원은 두 사람의 이혼을 확정하면서도 재산분할에 대해 다시 재판하라고 선고했기 때문입니다.", "[최태원/SK 회장 (지난 6월 파기환송심 출석) : 조정이 잘 성립될 수 있어서 빨리 끝날 수 있으면 좋겠습니다.] [노소영/아트센터 나비 관장 (지난 6월 파기환송심 출석) : (이견이 아직 해소가 안 된 걸까요"], "kw": ["SBS"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859936&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "뉴스", "h": "'음주운전' 고경표 경찰 출석…울먹이며 \"정말 죄송\"", "s": "<앵커> 열흘 전 만취 상태로 음주운전을 하다가 차량 사고를 낸 배우 고경표 씨가 어제(23일) 경찰에 출석했습니다. 조사를 받고 나온 고 씨는 죄송하다며 고개를 숙였습니다.", "pts": ["<기자> 음주 사고 이후 첫 경찰 조사를 약 1시간 40분 동안 받고 나온 배우 고경표 씨.", "초췌한 모습의 고 씨는 '팬들에게 하고 싶은 말이 있냐'는 질문에 울먹이며 고개를 숙였습니다.", "[고경표/배우 : 보내주신 관심과 응원을 이런 식으로 돌려드리게 된 것에 대해서 정말 죄송합니다."], "kw": ["SBS"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859935&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "뉴스", "h": "'개표 은닉' 선관위 직원 1명 구속…7명 기각", "s": "<앵커> 지난 6·3 지방선거에서 경기도 교육감 개표 상황표를 조작한 혐의를 받는 선관위 직원이 구속됐습니다. 선관위 특검팀은 투표율을 허위 입력하고 사후에 투표록을 수정한 혐의로 다른 선관위 직원 7명에 대해서도 구속영장을 청구했지만, 모두 기각됐습니다.", "pts": ["<기자> 서울중앙지법 이종록 영장전담 부장판사는 오늘(24일) 새벽 1시 19분쯤, 경기도 광주시 선관위 직원 이 모 씨에 대한 구속영장을 발부했습니다.", "이 씨는 지난 6·3 지방선거 경기도 교육감 선거 과정에서 개표 상황표를 은닉하고 위조한 혐의를 받습니다.", "선관위 특검은 투표구 이름과 선거인 수, 후보자별 득표수 등을 기록하는 개표 상황표를 이 씨가 조작해 개표 결과가 실제와 달라지게 됐다고 주장하고 있습니다."], "kw": ["SBS"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859934&plink=RSSLINK&cooper=RSSREADER"}]}], "ok": false}];

    '<button class="tg" data-i="'+i+'" aria-expanded="false"><span class="cat">'+esc(n.c)+'<span class="eq"><i></i><i></i><i></i></span></span><h2>'+esc(n.h)+'</h2><p>'+esc(n.s)+'</p><span class="more">자세히 보기</span></button>'+
    (TTS?'<button class="spk" data-s="'+i+'" aria-label="이 기사 듣기">🔊</button>':'<span></span>')+'</div>'+
    '<div class="detail"><div><h3>핵심 포인트</h3><ul>'+(n.pts||[]).map(function(p){return'<li>'+esc(p)+'</li>'}).join("")+'</ul><h3>키워드</h3><div class="kw">'+(n.kw||[]).map(function(x){return'<span>#'+esc(x)+'</span>'}).join("")+'</div><h3>출처</h3><div class="src">'+esc(n.src)+'</div>'+lk+'</div></div></div>';
  }).join("");
}

/* ---- 듣기: 문장 단위로 끊어 읽기(안드로이드 크롬/삼성 인터넷 호환) ---- */
function text(n){return n.c+" 소식입니다. "+n.h+". "+n.s+" "+(n.pts||[]).join(". ")}
function chunks(s){return (s.match(/[^.!?。]+[.!?。]*\s*/g)||[s]).map(function(x){return x.trim()}).filter(Boolean)}
function mark(i){[].forEach.call(document.querySelectorAll(".row"),function(c,k){c.classList.toggle("playing",k===i)})}
function lock(){try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(function(l){wl=l}).catch(function(){})}catch(e){}}
function unlock(){try{if(wl){wl.release();wl=null}}catch(e){}}
function loadCard(k){
  if(k>=queue.length){stop();return false}
  var n=DATA[tab].items[queue[k]];
  qi=k;ci=0;CH=chunks(text(n));mark(queue[k]);talk(true);
  $("np").textContent=(queue.length>1?(k+1)+"/"+queue.length+" · ":"")+n.h;
  var el=$("c"+queue[k]);if(el&&el.scrollIntoView)el.scrollIntoView({block:"center",behavior:"smooth"});
  return true;
}
function say(){
  if(paused||qi<0)return;
  if(ci>=CH.length){if(loadCard(qi+1))say();return}
  var my=++tok;
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(CH[ci]);
  u.lang="ko-KR";u.rate=parseFloat($("rate").value);
  var v=speechSynthesis.getVoices().filter(function(x){return x.lang&&x.lang.replace("_","-").toLowerCase().indexOf("ko")==0})[0];
  if(v)u.voice=v;
  u.onend=function(){if(my===tok&&!paused){ci++;say()}};
  u.onerror=function(){if(my===tok&&!paused){ci++;say()}};
  speechSynthesis.speak(u);
}
function start(list){stop();if(!TTS||!list.length)return;queue=list;lock();if(loadCard(0))say()}
function stop(){tok++;paused=false;qi=-1;queue=[];CH=[];if(TTS)speechSynthesis.cancel();mark(-1);talk(false);unlock();$("pp").textContent="⏸";$("np").textContent=NP0}
$("list").addEventListener("click",function(e){
  var s=e.target.closest("[data-s]");
  if(s){start([+s.dataset.s]);return}
  var t=e.target.closest(".tg");
  if(t){var c=$("c"+t.dataset.i);var o=c.classList.toggle("open");t.setAttribute("aria-expanded",o)}
});
$("t0").onclick=function(){stop();tab=0;render()};
$("t1").onclick=function(){stop();tab=1;render()};
$("all").onclick=function(){start(DATA[tab].items.map(function(_,i){return i}))};
$("pp").onclick=function(){
  if(!TTS||qi<0)return;
  if(paused){paused=false;$("pp").textContent="⏸";talk(true);say()}
  else{paused=true;tok++;speechSynthesis.cancel();talk(false);$("pp").textContent="▶"}
};
$("stop").onclick=stop;
$("rate").onchange=function(){try{localStorage.setItem("rate",$("rate").value)}catch(e){}};
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&qi>=0&&!paused)lock()});
if(!TTS)document.querySelector(".bar").style.display="none";
$("np").textContent=NP0;
render();
</script>
</body>
</html>
