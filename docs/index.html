<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뉴콩이의 출근길 뉴스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6f0;--card:#fff;--ink:#4a3a3a;--sub:#8a7468;--bd:#f0dcc6;--accent:#ff6f91;--onacc:#fff;--tint:#e3f3ff;--tbd:#bfe0f7;
--skyM:linear-gradient(170deg,#ffe3b3,#ffc2d4 55%,#b9ddff);--onM:#4a3a3a;
--skyE:linear-gradient(170deg,#5b4aa8,#8f5db8 60%,#c26aa9);--onE:#fff;
--disp:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
--sans:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1830;--card:#2b2344;--ink:#fff1e6;--sub:#c4b6d9;--bd:#40355f;--accent:#ff8fab;--onacc:#2a1730;--tint:#1f3350;--tbd:#2f4d75;
--skyM:linear-gradient(170deg,#5a4263,#8a5566 55%,#3b5c8f);--onM:#fff;--skyE:linear-gradient(170deg,#171236,#2d2160 55%,#5a3070);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1e1830;--card:#2b2344;--ink:#fff1e6;--sub:#c4b6d9;--bd:#40355f;--accent:#ff8fab;--onacc:#2a1730;--tint:#1f3350;--tbd:#2f4d75;
--skyM:linear-gradient(170deg,#5a4263,#8a5566 55%,#3b5c8f);--onM:#fff;--skyE:linear-gradient(170deg,#171236,#2d2160 55%,#5a3070);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;word-break:keep-all;overflow-wrap:break-word}
body[data-tab="m"]{--sky:var(--skyM);--on:var(--onM)}
body[data-tab="e"]{--sky:var(--skyE);--on:var(--onE)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
body[data-tab="m"] .e-only,body[data-tab="e"] .m-only{display:none}

/* 하늘 + 뉴콩이 */
.sky{position:relative;overflow:hidden;background:var(--sky);color:var(--on);border-radius:0 0 34px 34px;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 20px;transition:background .4s}
.sky-in{position:relative;max-width:640px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-family:var(--disp);font-weight:400;font-size:29px;line-height:1.25;margin:0}
.date{margin:4px 0 0;font-size:14px;opacity:.85}
.hi{font-family:var(--disp);font-size:16px;margin-top:2px}
.orb{position:absolute;right:120px;top:2px;width:40px;height:40px;border-radius:50%}
body[data-tab="m"] .orb{background:radial-gradient(circle at 40% 40%,#fffbe0,#ffd566 65%);box-shadow:0 0 20px 6px rgba(255,214,102,.6)}
body[data-tab="e"] .orb{background:#fff7d6;box-shadow:inset -9px -3px 0 0 rgba(140,110,190,.55),0 0 18px 3px rgba(255,255,255,.3)}
.deco{position:absolute;font-size:20px;pointer-events:none}
.d1{right:36%;top:46px}.d2{right:10px;top:4px;font-size:15px}.d3{left:52%;top:8px;font-size:14px}
.mascot-wrap{position:relative;flex:none;width:100px}
.mascot{display:block;width:100px;height:100px;overflow:visible}
.mascot *{transform-box:fill-box}
.eyes-shut,.mouth-talk{display:none}
body[data-tab="m"] .eyes-shut{display:none}
body[data-tab="e"]:not(.talk) .eyes-open{display:none}
body[data-tab="e"]:not(.talk) .eyes-shut{display:inline}
.wave{transform-origin:50% 85%;animation:wave 1.8s ease-in-out infinite}
body[data-tab="e"] .wave{animation:none}
.zz{font-family:var(--disp);font-size:15px;fill:#fff;animation:zz 2.4s ease-in-out infinite}
.talk .mouth{display:none}
.talk .mouth-talk{display:inline;transform-origin:center;animation:yap .32s ease-in-out infinite alternate}
.talk .bob{animation:bob .5s ease-in-out infinite alternate}
.note{position:absolute;font-size:18px;opacity:0;color:var(--on)}
.n1{left:-4px;top:6px}.n2{right:-2px;top:-4px}
.talk .note{animation:note 1.5s ease-out infinite}
.talk .n2{animation-delay:.7s}
@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(22deg)}}
@keyframes yap{from{transform:scaleY(.35)}to{transform:scaleY(1.25)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes zz{0%,100%{opacity:.4;transform:translateY(2px)}50%{opacity:1;transform:translateY(-3px)}}
@keyframes note{0%{opacity:0;transform:translateY(8px)}30%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
.notice{display:inline-block;margin:10px 0 14px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.35);font-size:12.5px}
.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.3);max-width:340px}
.tab{flex:1;padding:9px 0;border:0;border-radius:999px;background:transparent;font-family:var(--disp);font-size:16px;color:var(--on)}
.tab[aria-selected="true"]{background:#fff;color:#4a3a3a;box-shadow:0 2px 0 rgba(0,0,0,.12)}

main{max-width:640px;margin:0 auto;padding:18px 16px 160px}
.tl{font-size:13px;color:var(--sub);margin:0 0 12px 4px}
.empty{color:var(--sub);font-size:15px;padding:36px 0;text-align:center}

/* 말랑한 기사 카드: 번호 = 전체 듣기 재생 순서 */
.row{--bd2:var(--bd);background:var(--card);border:2px solid var(--bd);border-radius:24px;margin-bottom:14px;box-shadow:0 4px 0 var(--bd);transition:border-color .2s,box-shadow .2s}
@supports (color:color-mix(in srgb,red,blue)){.row{--bd2:color-mix(in srgb,var(--c) 35%,var(--bg));border-color:var(--bd2);box-shadow:0 4px 0 var(--bd2)}}
.row.playing{border-color:var(--c);box-shadow:0 4px 0 var(--c)}
.head{display:grid;grid-template-columns:38px 1fr 44px;gap:10px;padding:14px}
.no{width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;font-family:var(--disp);font-size:19px;display:grid;place-items:center}
.playing .no{animation:hop .6s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-4px)}}
.tg{text-align:left;background:none;border:0;padding:0;min-width:0}
.cat{display:inline-flex;align-items:center;gap:6px;font-family:var(--disp);font-size:13px;color:var(--c);padding:1px 10px;border-radius:999px;border:1.5px solid var(--c)}
.tg h2{font-family:var(--disp);font-weight:400;font-size:18px;line-height:1.45;margin:6px 0 6px}
.tg p{margin:0;color:var(--sub);font-size:14.5px}
.more{display:inline-block;margin-top:8px;font-family:var(--disp);font-size:13px;color:var(--accent)}
.more::after{content:" ▾"}
.open .more::after{content:" ▴"}
.spk{width:44px;height:44px;border-radius:50%;border:2px solid var(--bd);background:var(--bg);font-size:18px;transition:background .2s}
.playing .spk{background:var(--c);border-color:var(--c)}
.eq{display:none;gap:2px;align-items:flex-end;height:11px}
.playing .eq{display:inline-flex}
.eq i{width:3px;background:var(--c);border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.25s}.eq i:nth-child(3){animation-delay:.5s}
@keyframes eq{0%,100%{height:3px}50%{height:11px}}

.detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease;margin:0 14px 0 62px;font-size:14px}
.open .detail{grid-template-rows:1fr}
.detail>div{overflow:hidden}
.open .detail>div{padding-bottom:16px}
.detail h3{font-family:var(--disp);font-weight:400;font-size:13px;color:var(--sub);margin:12px 0 4px}
.detail ul{margin:0;padding-left:18px}
.detail li{margin-bottom:3px}
.kw span{display:inline-block;font-size:12.5px;background:var(--bg);border-radius:999px;padding:0 10px;margin:0 4px 4px 0;color:var(--sub)}
.src{font-size:12.5px;color:var(--sub)}
.lk a{display:inline-block;font-size:13px;color:var(--accent);margin-right:14px}

/* 날씨 */
.wx{background:var(--tint);border-color:var(--tbd);box-shadow:0 4px 0 var(--tbd)}
.wx .no{background:var(--card);font-size:22px;color:inherit}

/* 플레이어 */
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:616px;margin:0 auto;background:var(--card);border:2px solid var(--bd);border-radius:26px;padding:10px 12px;box-shadow:0 4px 0 var(--bd),0 12px 24px rgba(60,30,40,.15);z-index:5}
.np{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px 8px}
.ctl{display:flex;gap:8px;align-items:center}
.ctl button,.ctl select{height:44px;border:2px solid var(--bd);background:var(--bg);color:var(--ink);border-radius:16px;font-family:var(--disp);font-size:16px;padding:0 14px}
.ctl .main{flex:1;background:var(--accent);border-color:var(--accent);color:var(--onacc)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

var DATA=[{"label": "전날 18:00–24:00 기사 기준", "items": [{"c": "정치", "h": "이 대통령, 필리핀서 한-메콩·아세안·필리핀 정상회담 개최", "s": "이재명 대통령이 필리핀 마닐라에서 열린 한-메콩 및 한-아세안 정상회의에 참석해 AI와 문화산업 등 협력 이니셔티브를 제안했습니다. 아울러 6년 만에 재개된 한-메콩 정상회의를 통해 7대 중점 분야 협력을 강화하기로 했습니다. 이어 열린 한-필리핀 정상회담에서는 조선과 AI, 원전 등 미래지향적 분야로 협력을 확대하기로 합의했습니다.", "pts": ["배경: 미얀마 사태 등으로 2021년 중단됐던 한-메콩 정상회의가 6년 만에 재개됐습니다.", "원인: 지정학적 갈등과 경제 불확실성에 대응하기 위해 한국과 아세안 간 긴밀한 연대 필요성이 강조됐습니다.", "전망: 한국은 AI 동맹 및 문화창조산업 이니셔티브를 추진하고 필리핀과는 조선, AI, 원전 등 신산업 협력을 구체화할 예정입니다."], "kw": ["이재명 대통령", "아세안", "한-메콩 정상회의", "한-필리핀 정상회담"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848627&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848628&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848663&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "경제", "h": "엔비디아 위기와 앤트로픽 상장 영향에 삼전·하이닉스 급락", "s": "외국인 투자자들의 대규모 매도세로 코스피가 3.6% 하락한 5,100 선으로 마감했습니다. AI '클로드' 개발사인 앤트로픽의 나스닥 상장을 앞두고 외국인이 현금 확보에 나선 데다 엔비디아의 위기감이 이어진 영향으로 풀이됩니다. 엔비디아의 자금 지원 축소 우려로 국내 증시의 출렁임은 당분간 지속될 전망입니다.", "pts": ["배경: 엔비디아 시가총액이 700조 원 이상 사라지고 젠슨 황 사태의 후폭풍이 이어지고 있습니다.", "원인: 앤트로픽의 나스닥 상장을 앞둔 외국인의 현금 확보 매도세와 엔비디아의 자금 지원 축소 보도가 악재로 작용했습니다.", "전망: 삼성전자와 SK하이닉스에 대한 이익 기대치가 흔들리며 국내 증시는 당분간 큰 폭의 변동성을 피하기 어려울 것으로 보입니다."], "kw": ["삼성전자", "SK하이닉스", "엔비디아", "앤트로픽"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848562&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848523&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "정치", "h": "민주당 지도부 회의 복귀했으나 계파 간 신경전과 설전 이어져", "s": "당 대표 감찰 지시에 반발해 지도부 회의에 불참했던 민주당 친정청래계 최고위원들이 회의에 복귀했습니다. 하지만 회의장에서는 반분신 의혹 진상규명 등을 둘러싸고 계파 간 가시 돋친 설전이 이어졌습니다. 김민석 대표는 엄정한 절차를 강조한 가운데 최민희 의원의 징계 수위에 따라 당내 갈등이 더 커질 수 있습니다.", "pts": ["배경: 김민석 당대표의 감찰 지시에 반발하며 최민희 의원 등 친청계 최고위원들이 최고위원회의에 불참했습니다.", "원인: 회의에 복귀한 최 의원이 반분신 비밀연합 진상규명을 요구하고 친명계 최고위원들이 이를 비판하며 갈등이 표출됐습니다.", "전망: 이르면 이번 주 나올 최민희 의원의 징계 결과와 정청래 전 대표의 대응에 따라 당내 전면전으로 확대될 가능성이 있습니다."], "kw": ["더불어민주당", "김민석", "최민희", "계파 갈등"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848534&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "스마트 안경 부정행위 12건 적발…전파탐지기 한계도 지적", "s": "올해 국가자격시험에서 스마트 안경을 이용한 부정행위가 12건 적발된 것으로 확인됐지만 당국의 대책은 미흡했다는 비판이 나옵니다. 전파탐지기 도입 논의가 이어지고 있으나 생활 전파와의 구분이 어려워 완전한 해결책이 되지는 못하고 있습니다. 정부는 올해 시행된 528개 자격시험 종목 전체를 조사하기로 했으나 적발에는 한계가 있다는 지적이 나옵니다.", "pts": ["배경: 스마트 안경을 활용한 국가자격시험 부정행위 적발 사례가 당초 알려진 6건의 두 배인 12건으로 확인됐습니다.", "원인: 한국산업인력공단이 수험생들의 사전 민원에도 불구하고 안일하게 대응하여 늑장 조사를 벌이고 있다는 비판을 받고 있습니다.", "전망: 전파탐지기 단독 사용은 생활 전파 오류 가능성이 있어 AI 분석 및 CCTV 등 기술 병행 조치가 권고됩니다."], "kw": ["스마트 안경", "부정행위", "전파탐지기", "한국산업인력공단"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848521&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848519&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "마운자로 반입 갑자기 허용…기준 변경·책임 회피 논란", "s": "그동안 공항 세관에서 엄격히 단속되던 비만치료제 마운자로의 개인 반입이 갑자기 허용됐습니다. 관세청은 올해만 5천 건 넘게 통관을 막았으나 식약처의 공문에 따라 석 달 치 반입이 허용되는 방향으로 방침이 바꼈습니다. 설명이나 사과 없이 갑작스럽게 변경된 정책과 기관 간 책임 미루기에 구매자들의 불만이 커지고 있습니다.", "pts": ["배경: 일본에서 처방받은 비만치료제 마운자로에 대해 올해 8월까지 5천 건 이상의 반입 단속 조치가 시행됐습니다.", "원인: 식약처가 과도한 규제라는 의견을 반영해 관세청에 공문을 보내 석 달 치 반입을 허용하도록 지침을 수정했습니다.", "전망: 별도 브리핑이나 사과 없이 방침이 바뀌며 그간의 행정력 낭비와 정부 정책에 대한 신뢰도 하락 비판이 이어지고 있습니다."], "kw": ["마운자로", "비만치료제", "관세청", "식약처"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008847765&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "정치", "h": "청해부대 작전 범위 확대…포세이돈 초계기 우선 파견", "s": "청해부대의 작전 범위를 호르무즈 해협 부근까지 확대하는 파견 연장안이 국회에 제출됐습니다. 연장안이 통과되면 신형 포세이돈 해상초계기가 먼저 파견되고 내년 2월에는 문무대왕함이 출항할 예정입니다. 국방부는 전쟁 관여 불가 원칙에 따라 이란 전쟁 종전 이후 국민과 선박 보호 임무에 집중하겠다고 밝혔습니다.", "pts": ["배경: 청해부대의 작전 범위를 호르무즈 해협 부근으로 확대하는 파견 연장안이 국회에 제출됐습니다.", "내용: 지부티 미군 기지를 거점으로 포세이돈 해상초계기가 우선 파견되고 내년 2월 문무대왕함 50진이 투입될 계획입니다.", "전망: 해군 EOD의 무인 소해 장비 숙달 훈련을 거쳐 이란 전쟁 종전 후 국민과 선박 보호 임무에 본격 투입될 예정입니다."], "kw": ["청해부대", "문무대왕함", "포세이돈", "호르무즈 해협"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848536&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "국제", "h": "요르단·이라크, 국가 안보 우려로 메신저 '텔레그램' 차단", "s": "IS의 테러 위협에 시달려온 요르단과 이라크가 국가 안보를 이유로 메신저 앱 텔레그램의 접속을 차단했습니다. 요르단은 IS의 극단주의 유포와 최근 발생한 테러 사건에 대응해 사회를 보호하고자 이같이 조치했습니다. 이라크 역시 불법 콘텐츠 차단 요구에 응하지 않은 텔레그램 측에 30일의 시정 기간을 부여하며 차단에 나섰습니다.", "pts": ["배경: 극단주의 테러 조직 IS가 성명 유포 및 선전물 전달을 위해 텔레그램을 핵심 소통 수단으로 활용해 왔습니다.", "원인: 최근 요르단 내 교회 습격 및 흉기 테러 발생과 이라크의 불법 콘텐츠 재검토 요청 미비 등 안보 위협이 커졌습니다.", "전망: 이라크 당국이 텔레그램 측에 30일의 시정 기간을 준 만큼 플랫폼의 방침 변화 여부에 따라 차단 지속 여부가 결정될 것으로 보입니다."], "kw": ["텔레그램", "요르단", "이라크", "IS 테러"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848678&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "정치", "h": "국회 나온 교육부 장관 \"나이 있어 AI 부정행위 못 잡아\"", "s": "국회 교육위원회에 출석한 최교진 교육부 장관이 AI를 활용한 부정행위를 직접 잡아낼 수 있냐는 질의에 못 할 것 같다고 대답해 논란이 일었습니다. 교육부 차관 역시 통신 차단 외에는 완전한 적발이 어렵다는 점을 인정했습니다. 의원들은 부정행위에 대한 처벌 강화를 주문했으나 교육부는 수능 연기는 검토하지 않는다고 밝혔습니다.", "pts": ["배경: 수능 시험을 앞두고 AI 기기를 활용한 신종 부정행위 대책을 점검하기 위해 국회 교육위원회가 열렸습니다.", "원인: 교육부 수장들이 현장 감시의 한계와 적발의 어려움을 토로하며 실효성 있는 대책을 제시하지 못해 질타를 받았습니다.", "전망: 수능 연기 없이 시험이 치러지는 가운데 명확한 적발 대책의 부재로 수험생과 학부모의 불안감은 지속될 전망입니다."], "kw": ["최교진 장관", "교육부", "AI 부정행위", "수능"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848517&plink=RSSLINK&cooper=RSSREADER"}]}]}, {"label": "당일 00:00–07:00 기사 기준", "items": [{"c": "날씨", "h": "오늘 경기 광주 날씨 이슬비, 최저 7도 최고 12도", "s": "오늘 경기 광주은 이슬비, 최저 7도 최고 12도입니다. 출근 시간대인 오전 8시에는 8도입니다. 강수 확률은 최대 97퍼센트로, 우산을 꼭 챙기세요.", "pts": ["기온: 최저 7도, 최고 12도 (오전 8시 8도, 오후 6시 11도)", "강수: 확률 최대 97퍼센트, 예상 강수량 3.2밀리미터", "바람: 최대 풍속 약 3미터", "미세먼지 보통, 초미세먼지 보통 (Open-Meteo 모델 예측치, 낮 시간 최대 기준)"], "kw": ["경기 광주", "이슬비", "날씨"], "src": "Open-Meteo 예측 모델(기상청 공식 예보와 다를 수 있음)", "date": "2026-11-17"}, {"c": "사회", "h": "세무사 수석 합격자 AI 부정행위 자백…528개 자격시험 전수조사", "s": "세무사 시험 수석 합격자가 초소형 카메라와 스마트폰, 모니터를 활용한 AI 부정행위를 자백하고 자수해 경찰 조사를 받고 있습니다. 올해 산업인력공단 자격시험에서 AI 안경 부정행위가 12건 적발된 것으로 드러나자 정부는 528개 국가자격시험 전체를 전수조사하기로 했습니다. 이번 사태로 시험 공정성과 기존 평가 방식에 대한 신뢰가 흔들리고 있습니다.", "pts": ["세무사 시험 수석 합격자는 시험 문제를 찍어 생성형 AI로 보낸 뒤 스마트폰 크기 모니터로 답을 받는 수법을 자백했습니다.", "한국산업인력공단은 올 국가자격시험에서 AI 안경 부정행위 12건을 적발하고도 3건은 수사 의뢰조차 하지 않아 부실 대응 비판을 받았습니다.", "정부는 공단이 시행한 528개 자격시험 종목 전체에 대해 뒤늦게 전수조사에 나섰지만 적발 한계 지적이 이어지고 있습니다.", "AI 시대에 맞춰 수능 등 기존 정량 평가 방식과 교육 제도를 혁신해야 한다는 목소리가 커지고 있습니다."], "kw": ["AI 부정행위", "세무사 시험", "국가자격시험 전수조사", "평가 제도 혁신"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848805&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848817&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848825&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "국제", "h": "사상 첫 미중러 3국 정상회담 개최…한반도·우크라 논의 우려", "s": "오는 19일 중국 선전에서 사상 처음으로 미국, 중국, 러시아 3국 정상회담이 개최됩니다. 트럼프 미국 대통령은 비핵화와 이란 문제, 우크라이나 전쟁 종전 등을 논의할 것이라고 밝혔습니다. 당사국인 한국과 우크라이나가 배제된 채 세력권 재편이 이뤄지는 제2의 얄타회담이 될 수 있다는 우려가 커지고 있습니다.", "pts": ["미국, 중국, 러시아 정상은 19일 선전 APEC 정상회의 계기에 만나 주요 안보 의제와 전략적 안정 방안을 논의합니다.", "트럼프 대통령이 우크라이나 전쟁 종전 협상 논의를 명시하면서 우크라이나 영토 분할 등 밀실 합의에 대한 동맹국들의 우려가 증폭됐습니다.", "트럼프 대통령은 중국에서 김정은 북한 국무위원장을 만날 수 있다고 언급하며 시진핑 주석의 역할에 공을 넘겼습니다.", "우리 정부는 한반도 문제와 관련해 국익이 훼손되어서는 안 된다는 입장을 미중 양국에 전달하고 상황을 주시하고 있습니다."], "kw": ["미중러 정상회담", "트럼프", "제2의 얄타회담", "한반도 정세"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848709&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848717&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848761&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "경제", "h": "삼전·닉스 주가 급락…엔비디아 위기감 및 젠슨 황 복귀 시도", "s": "외국인 투자자들의 대규모 매도세에 삼성전자와 SK하이닉스 주가가 크게 하락했습니다. AI 기업 앤트로픽의 상장을 앞둔 현금 확보 움직임과 엔비디아의 자금 지원 축소 보도가 주가를 짓눌렀습니다. 한편 퇴출당한 젠슨 황 전 CEO는 복귀를 시도 중이지만 이사회와 미 재무부는 냉담한 반응을 보이고 있습니다.", "pts": ["코스피가 3.6% 내린 가운데 외국인이 삼성전자와 SK하이닉스 주식을 8,400억 원 넘게 순매도했습니다.", "앤트로픽 나스닥 상장에 따른 외국인 투자자들의 현금 확보와 엔비디아의 업계 자금 지원 줄이기 방침이 주가 급락의 원인으로 분석됩니다.", "젠슨 황 전 CEO는 측근들과 상황실을 꾸려 복귀를 모색 중이나 엔비디아 이사회는 국가안보 조사에 집중하며 복귀를 고려하지 않고 있습니다.", "미 재무장관은 외부 쇄신 인사를 강조하며 메가스피드를 통한 첨단 칩의 중국 우회 반출 묵인 의혹을 조사하겠다고 통첩했습니다."], "kw": ["삼성전자", "SK하이닉스", "엔비디아", "젠슨 황"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848711&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848710&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848765&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "정치", "h": "이재명 대통령, 아세안서 AI·문화 협력 제안…오늘 한일 정상회담", "s": "아세안 정상회의 참석을 위해 필리핀을 방문한 이재명 대통령이 한-아세안 AI 및 문화창조산업 협력 구상을 제안했습니다. 이 대통령은 오늘 다카이치 일본 총리와 6개월 만에 한일 정상회담을 갖습니다. 이번 회담에서는 양국 경제 협력과 사회 문제 대응 방안이 주로 논의될 예정입니다.", "pts": ["이재명 대통령은 필리핀 마닐라에서 열린 한-아세안 정상회의에서 AI 기술 발전과 문화 산업 공동 협력 이니셔티브를 발표했습니다.", "오늘 개최되는 한일 정상회담에서는 경제 협력 확대와 저출산·고령화 등 공통 사회 문제에 대한 공조 방안이 논의됩니다.", "이번 회담은 미중러 정상회담을 앞두고 열려 동북아 안보 정세 관련 의견 교환도 이뤄질 가능성이 있습니다.", "이 대통령은 필리핀 일정을 마치고 APEC 정상회의가 열리는 중국 선전으로 이동해 다자외교를 이어갑니다."], "kw": ["이재명 대통령", "아세안 정상회의", "한일 정상회담", "다카이치 총리"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848809&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "경제", "h": "트럼프, 엔비디아 주식 최대 830억 보유…미, AI 반도체 규제 강화", "s": "도널드 트럼프 미국 대통령이 최대 830억 원 상당의 엔비디아 주식을 보유한 것으로 밝혀져 이해충돌 논란이 일고 있습니다. 수출 통제 완화로 이득을 얻었다는 비판이 비등한 가운데, 미국 정부는 AI 반도체에 대한 중국의 원격 접속을 차단하는 신규 통제 조치를 전격 발표했습니다. 동남아와 브라질 등지로 첨단 칩을 수출할 때도 사전 허가를 받도록 안보 규제를 대폭 강화했습니다.", "pts": ["트럼프 대통령의 재무자료 분석 결과, 올해 8월 말 기준 보유한 엔비디아 주식 가치가 최대 6,200만 달러(약 830억 원)에 달했습니다.", "트럼프 대통령이 엔비디아 H200 칩의 중국 수출을 허용하는 등 관련 정책 결정으로 막대한 이익을 얻었다는 지적이 나오고 있습니다.", "미 상무부는 중국 등 안보 우려국 기업이 미국산 슈퍼지능 반도체 및 서버에 원격 접속하는 것을 통제하기로 했습니다.", "싱가포르, 말레이시아 등 동남아 주요국과 브라질로 첨단 AI 반도체를 수출할 시 사전 허가를 받아야 하는 규제가 적용됩니다."], "kw": ["트럼프", "엔비디아 주식", "AI 반도체 규제", "중국 원격접속 차단"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848735&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848764&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "정치", "h": "교육장관 \"AI 부정행위 못 잡아내\" 무책임 답변…수능 연기는 선을 그어", "s": "국회 교육위원회에 출석한 최교진 교육부 장관이 AI 부정행위를 감독관이 적발할 수 있겠냐는 질문에 나이가 있어서 못 할 것 같다고 답해 무책임 논란이 일었습니다. 차관 역시 원천 통신 차단 외에는 100% 적발이 어렵다고 인정했습니다. 대책 부실 지적과 수능 연기 요구에 대해 교육부는 더 큰 혼란을 막기 위해 연기는 검토하지 않는다고 선을 그었습니다.", "pts": ["최교진 교육부 장관은 국회 교육위에서 AI 부정행위를 직접 잡아낼 자신이 없으며 완벽한 방지는 어렵다고 답변했습니다.", "여야 의원들은 현장 감독관의 적발 한계와 오인 시 손해배상 문제를 지적하며 응시 자격 제한 등 처벌 강화를 요구했습니다.", "교육부는 AI 부정행위 적발 대책의 미진함에도 불구하고 수능 시험 연기는 검토하지 않겠다고 명확히 밝혔습니다."], "kw": ["최교진 교육부 장관", "AI 부정행위", "국회 교육위", "수능 연기 불가"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848707&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848804&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "정치", "h": "대법원, 한덕수 구속만기 하루 전 19일 선고…12·3 계엄 첫 대법 판단", "s": "대법원이 내란 중요임무 종사 혐의를 받는 한덕수 전 국무총리에 대해 구속 만기 하루 전인 오는 19일 상고심 판결을 선고합니다. 이번 판결은 12·3 비상계엄이 내란에 해당하는지 판단하는 첫 대법원 선고입니다. 구속 만료로 인한 석방 우려는 사라졌으나 선고 기일 지정 과정을 두고 대법원이 재판 지연 논란을 자초했다는 지적도 나옵니다.", "pts": ["한덕수 전 총리의 구속 만기일인 20일을 하루 앞둔 19일 오후 4시 대법원 상고심 판결 선고가 진행됩니다.", "이번 선고는 12·3 비상계엄 선포 행위에 대해 대법원이 내리는 최초의 법적 판단이라는 점에서 초점이 맞춰집니다.", "대법원은 합의가 완료되어 기일을 정했다고 설명했으나 석방 논란 직후 선고 기일을 잡아 비판을 받았습니다.", "같은 날 김건희 씨의 도이치모터스 주가조작 등 3대 의혹 사건에 대한 대법원 판결도 선고될 예정입니다."], "kw": ["한덕수", "대법원 선고", "12·3 비상계엄", "내란 혐의"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848806&plink=RSSLINK&cooper=RSSREADER"}]}, {"c":   }).join("");
}

/* ---- 듣기: 문장 단위로 끊어 읽기(안드로이드 크롬/삼성 인터넷 호환) ---- */
function text(n){return n.c+" 소식입니다. "+n.h+". "+n.s+" "+(n.pts||[]).join(". ")}
function chunks(s){return (s.match(/[^.!?。]+[.!?。]*\s*/g)||[s]).map(function(x){return x.trim()}).filter(Boolean)}
function mark(i){[].forEach.call(document.querySelectorAll(".row"),function(c,k){c.classList.toggle("playing",k===i)})}
function lock(){try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(function(l){wl=l}).catch(function(){})}catch(e){}}
function unlock(){try{if(wl){wl.release();wl=null}}catch(e){}}
function loadCard(k){
  if(k>=queue.length){stop();return false}
  var n=DATA[tab].items[queue[k]];
  qi=k;ci=0;CH=chunks(text(n));mark(queue[k]);talk(true);
  $("np").textContent=(queue.length>1?(k+1)+"/"+queue.length+" · ":"")+n.h;
  var el=$("c"+queue[k]);if(el&&el.scrollIntoView)el.scrollIntoView({block:"center",behavior:"smooth"});
  return true;
}
function say(){
  if(paused||qi<0)return;
  if(ci>=CH.length){if(loadCard(qi+1))say();return}
  var my=++tok;
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(CH[ci]);
  u.lang="ko-KR";u.rate=parseFloat($("rate").value);
  var v=speechSynthesis.getVoices().filter(function(x){return x.lang&&x.lang.replace("_","-").toLowerCase().indexOf("ko")==0})[0];
  if(v)u.voice=v;
  u.onend=function(){if(my===tok&&!paused){ci++;say()}};
  u.onerror=function(){if(my===tok&&!paused){ci++;say()}};
  speechSynthesis.speak(u);
}
function start(list){stop();if(!TTS||!list.length)return;queue=list;lock();if(loadCard(0))say()}
function stop(){tok++;paused=false;qi=-1;queue=[];CH=[];if(TTS)speechSynthesis.cancel();mark(-1);talk(false);unlock();$("pp").textContent="⏸";$("np").textContent=NP0}
$("list").addEventListener("click",function(e){
  var s=e.target.closest("[data-s]");
  if(s){start([+s.dataset.s]);return}
  var t=e.target.closest(".tg");
  if(t){var c=$("c"+t.dataset.i);var o=c.classList.toggle("open");t.setAttribute("aria-expanded",o)}
});
$("t0").onclick=function(){stop();tab=0;render()};
$("t1").onclick=function(){stop();tab=1;render()};
$("all").onclick=function(){start(DATA[tab].items.map(function(_,i){return i}))};
$("pp").onclick=function(){
  if(!TTS||qi<0)return;
  if(paused){paused=false;$("pp").textContent="⏸";talk(true);say()}
  else{paused=true;tok++;speechSynthesis.cancel();talk(false);$("pp").textContent="▶"}
};
$("stop").onclick=stop;
$("rate").onchange=function(){try{localStorage.setItem("rate",$("rate").value)}catch(e){}};
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&qi>=0&&!paused)lock()});
if(!TTS)document.querySelector(".bar").style.display="none";
$("np").textContent=NP0;
render();
</script>
</body>
</html>
