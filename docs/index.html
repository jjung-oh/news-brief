<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뉴콩이의 출근길 뉴스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6f0;--card:#fff;--ink:#4a3a3a;--sub:#8a7468;--bd:#f0dcc6;--accent:#ff6f91;--onacc:#fff;--tint:#e3f3ff;--tbd:#bfe0f7;
--skyM:linear-gradient(170deg,#ffe3b3,#ffc2d4 55%,#b9ddff);--onM:#4a3a3a;
--skyE:linear-gradient(170deg,#5b4aa8,#8f5db8 60%,#c26aa9);--onE:#fff;
--disp:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
--sans:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1830;--card:#2b2344;--ink:#fff1e6;--sub:#c4b6d9;--bd:#40355f;--accent:#ff8fab;--onacc:#2a1730;--tint:#1f3350;--tbd:#2f4d75;
--skyM:linear-gradient(170deg,#5a4263,#8a5566 55%,#3b5c8f);--onM:#fff;--skyE:linear-gradient(170deg,#171236,#2d2160 55%,#5a3070);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1e1830;--card:#2b2344;--ink:#fff1e6;--sub:#c4b6d9;--bd:#40355f;--accent:#ff8fab;--onacc:#2a1730;--tint:#1f3350;--tbd:#2f4d75;
--skyM:linear-gradient(170deg,#5a4263,#8a5566 55%,#3b5c8f);--onM:#fff;--skyE:linear-gradient(170deg,#171236,#2d2160 55%,#5a3070);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;word-break:keep-all;overflow-wrap:break-word}
body[data-tab="m"]{--sky:var(--skyM);--on:var(--onM)}
body[data-tab="e"]{--sky:var(--skyE);--on:var(--onE)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
body[data-tab="m"] .e-only,body[data-tab="e"] .m-only{display:none}

/* 하늘 + 뉴콩이 */
.sky{position:relative;overflow:hidden;background:var(--sky);color:var(--on);border-radius:0 0 34px 34px;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 20px;transition:background .4s}
.sky-in{position:relative;max-width:640px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-family:var(--disp);font-weight:400;font-size:29px;line-height:1.25;margin:0}
.date{margin:4px 0 0;font-size:14px;opacity:.85}
.hi{font-family:var(--disp);font-size:16px;margin-top:2px}
.orb{position:absolute;right:120px;top:2px;width:40px;height:40px;border-radius:50%}
body[data-tab="m"] .orb{background:radial-gradient(circle at 40% 40%,#fffbe0,#ffd566 65%);box-shadow:0 0 20px 6px rgba(255,214,102,.6)}
body[data-tab="e"] .orb{background:#fff7d6;box-shadow:inset -9px -3px 0 0 rgba(140,110,190,.55),0 0 18px 3px rgba(255,255,255,.3)}
.deco{position:absolute;font-size:20px;pointer-events:none}
.d1{right:36%;top:46px}.d2{right:10px;top:4px;font-size:15px}.d3{left:52%;top:8px;font-size:14px}
.mascot-wrap{position:relative;flex:none;width:100px}
.mascot{display:block;width:100px;height:100px;overflow:visible}
.mascot *{transform-box:fill-box}
.eyes-shut,.mouth-talk{display:none}
body[data-tab="m"] .eyes-shut{display:none}
body[data-tab="e"]:not(.talk) .eyes-open{display:none}
body[data-tab="e"]:not(.talk) .eyes-shut{display:inline}
.wave{transform-origin:50% 85%;animation:wave 1.8s ease-in-out infinite}
body[data-tab="e"] .wave{animation:none}
.zz{font-family:var(--disp);font-size:15px;fill:#fff;animation:zz 2.4s ease-in-out infinite}
.talk .mouth{display:none}
.talk .mouth-talk{display:inline;transform-origin:center;animation:yap .32s ease-in-out infinite alternate}
.talk .bob{animation:bob .5s ease-in-out infinite alternate}
.note{position:absolute;font-size:18px;opacity:0;color:var(--on)}
.n1{left:-4px;top:6px}.n2{right:-2px;top:-4px}
.talk .note{animation:note 1.5s ease-out infinite}
.talk .n2{animation-delay:.7s}
@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(22deg)}}
@keyframes yap{from{transform:scaleY(.35)}to{transform:scaleY(1.25)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes zz{0%,100%{opacity:.4;transform:translateY(2px)}50%{opacity:1;transform:translateY(-3px)}}
@keyframes note{0%{opacity:0;transform:translateY(8px)}30%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
.notice{display:inline-block;margin:10px 0 14px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.35);font-size:12.5px}
.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.3);max-width:340px}
.tab{flex:1;padding:9px 0;border:0;border-radius:999px;background:transparent;font-family:var(--disp);font-size:16px;color:var(--on)}
.tab[aria-selected="true"]{background:#fff;color:#4a3a3a;box-shadow:0 2px 0 rgba(0,0,0,.12)}

main{max-width:640px;margin:0 auto;padding:18px 16px 160px}
.tl{font-size:13px;color:var(--sub);margin:0 0 12px 4px}
.empty{color:var(--sub);font-size:15px;padding:36px 0;text-align:center}

/* 말랑한 기사 카드: 번호 = 전체 듣기 재생 순서 */
.row{--bd2:var(--bd);background:var(--card);border:2px solid var(--bd);border-radius:24px;margin-bottom:14px;box-shadow:0 4px 0 var(--bd);transition:border-color .2s,box-shadow .2s}
@supports (color:color-mix(in srgb,red,blue)){.row{--bd2:color-mix(in srgb,var(--c) 35%,var(--bg));border-color:var(--bd2);box-shadow:0 4px 0 var(--bd2)}}
.row.playing{border-color:var(--c);box-shadow:0 4px 0 var(--c)}
.head{display:grid;grid-template-columns:38px 1fr 44px;gap:10px;padding:14px}
.no{width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;font-family:var(--disp);font-size:19px;display:grid;place-items:center}
.playing .no{animation:hop .6s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-4px)}}
.tg{text-align:left;background:none;border:0;padding:0;min-width:0}
.cat{display:inline-flex;align-items:center;gap:6px;font-family:var(--disp);font-size:13px;color:var(--c);padding:1px 10px;border-radius:999px;border:1.5px solid var(--c)}
.tg h2{font-family:var(--disp);font-weight:400;font-size:18px;line-height:1.45;margin:6px 0 6px}
.tg p{margin:0;color:var(--sub);font-size:14.5px}
.more{display:inline-block;margin-top:8px;font-family:var(--disp);font-size:13px;color:var(--accent)}
.more::after{content:" ▾"}
.open .more::after{content:" ▴"}
.spk{width:44px;height:44px;border-radius:50%;border:2px solid var(--bd);background:var(--bg);font-size:18px;transition:background .2s}
.playing .spk{background:var(--c);border-color:var(--c)}
.eq{display:none;gap:2px;align-items:flex-end;height:11px}
.playing .eq{display:inline-flex}
.eq i{width:3px;background:var(--c);border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.25s}.eq i:nth-child(3){animation-delay:.5s}
@keyframes eq{0%,100%{height:3px}50%{height:11px}}

.detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease;margin:0 14px 0 62px;font-size:14px}
.open .detail{grid-template-rows:1fr}
.detail>div{overflow:hidden}
.open .detail>div{padding-bottom:16px}
.detail h3{font-family:var(--disp);font-weight:400;font-size:13px;color:var(--sub);margin:12px 0 4px}
.detail ul{margin:0;padding-left:18px}
.detail li{margin-bottom:3px}
.kw span{display:inline-block;font-size:12.5px;background:var(--bg);border-radius:999px;padding:0 10px;margin:0 4px 4px 0;color:var(--sub)}
.src{font-size:12.5px;color:var(--sub)}
.lk a{display:inline-block;font-size:13px;color:var(--accent);margin-right:14px}

/* 날씨 */
.wx{background:var(--tint);border-color:var(--tbd);box-shadow:0 4px 0 var(--tbd)}
.wx .no{background:var(--card);font-size:22px;color:inherit}

/* 플레이어 */
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:616px;margin:0 auto;background:var(--card);border:2px solid var(--bd);border-radius:26px;padding:10px 12px;box-shadow:0 4px 0 var(--bd),0 12px 24px rgba(60,30,40,.15);z-index:5}
.np{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px 8px}
.ctl{display:flex;gap:8px;align-items:center}
.ctl button,.ctl select{height:44px;border:2px solid var(--bd);background:var(--bg);color:var(--ink);border-radius:16px;font-family:var(--disp);font-size:16px;padding:0 14px}
.ctl .main{flex:1;background:var(--accent);border-color:var(--accent);color:var(--onacc)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

var DATA=[{"label": "전날 18:00–24:00 기사 기준", "items": [{"c": "정치", "h": "이재명 대통령, 국정원장 강금실·통일 홍익표 등 중폭 개각", "s": "이재명 대통령이 외교안보 라인 등 5개 부처 수장을 교체하는 중폭 개각을 단행했습니다. 국가정보원장 후보자에는 65년 만의 첫 여성 정보기관 수장이 될 강금실 전 법무부 장관이 전격 발탁됐습니다. 외교부 장관에는 임웅순, 통일부 장관에는 홍익표, 행안부 장관에는 한준호, 문체부 장관에는 강유정 후보자가 지명됐습니다.", "pts": ["이재명 대통령이 국정원장과 4개 부처 장관을 교체하는 개각을 발표했습니다.", "강금실 국정원장 후보자는 판사 및 첫 여성 법무장관 출신으로 민주적 통제와 국제 공조 적임자로 평가받았습니다.", "수능 부정 사태 해결 등 현안이 많은 교육부 장관 후속 인선은 조만간 발표될 관측입니다."], "kw": ["개각", "강금실", "국가정보원장", "홍익표"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859667&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859604&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859605&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "경제", "h": "젠슨 황, 엔비디아 CEO 11일만에 복귀…주가 30% 급등", "s": "젠슨 황이 사임 11일 만에 엔비디아 최고경영자(CEO)로 전격 복귀했습니다. 엔비디아 이사회는 그의 복귀에 국가안보상 위험이 없음을 확인하고 만장일치로 의결했습니다. 복귀 소식이 전해지자 뉴욕증시에서 엔비디아 주가는 30% 이상 급등하며 상승 출발했습니다.", "pts": ["젠슨 황은 앨리스 황과의 불륜 관계를 인정한 뒤 지난 12일 사임했으나 11일 만에 복귀했습니다.", "트럼프 미국 대통령은 이사회의 재임명 결정을 올바르고 적절한 결정이라며 환영했습니다.", "뉴욕증시는 엔비디아 재임명 소식에 힘입어 다우, S&P500, 나스닥이 모두 상승 출발했습니다."], "kw": ["젠슨 황", "엔비디아", "CEO 복귀", "뉴욕증시"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859774&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859797&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "경제", "h": "코스피 3%대 급락 4700선 겨우 지켜…원달러 환율 1350원대", "s": "미국발 AI 거품론과 금리 불확실성으로 글로벌 위험회피 심리가 고조되며 코스피가 3.3% 급락한 4,708로 장을 마쳤습니다. 원달러 환율도 전 거래일 대비 9.7원 오른 1,345.9원을 기록하며 장중 1,350원대를 나타냈습니다. 정부는 10조 원 규모의 증권시장 안정펀드 등 비상계획을 준비하고 있다고 강조했습니다.", "pts": ["나스닥 급락과 외국인 매도세로 삼성전자와 SK하이닉스 등 반도체 주가가 크게 하락했습니다.", "환율은 글로벌 위험회피 심리와 증시 급락, 외국인 자금 이탈 여파로 2주 만에 장중 1,350원대를 기록했습니다.", "정부는 증안펀드 가동을 준비 중이나 시장 불안을 완벽히 반전시키기엔 한계가 있다는 지적이 나옵니다."], "kw": ["코스피", "원달러 환율", "증안펀드", "위험회피"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859645&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859665&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859609&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "국제", "h": "우크라, 리비아 연안서 러 초계함 드론 공격으로 침몰 확인", "s": "젤렌스키 우크라이나 대통령이 북아프리카 리비아 연안에서 해상 드론 7대를 투입해 러시아 초계함 메르쿠리호를 침몰시켰다고 확인했습니다. 9개월 만에 재개된 종전협상이 정체된 가운데 러시아도 키이우 인근을 맹폭해 15명이 사망하는 등 충돌이 급격히 격화하고 있습니다. 리비아 정부는 이번 피격 사건에 대해 유엔에 국제 조사를 요청했습니다.", "pts": ["우크라이나 해상 드론이 흑해를 넘어 발트해와 북아프리카 리비아 연안까지 작전 범위를 확대했습니다.", "러시아는 키이우 북쪽 디메르 등을 공습해 최소 15명의 민간인 사망자를 발생시켰습니다.", "미국 중재로 종전협상이 재개됐으나 영토 및 나토 관련 안보 보장 문제에서 이견을 좁히지 못하고 있습니다."], "kw": ["우크라이나", "러시아", "메르쿠리호", "종전협상"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859465&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859589&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859689&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "민주당 조희대 탄핵 추진에…법관대표 의장 \"도 넘어\" 비판", "s": "민주당이 12.3 비상계엄 내란 협조 의혹 등을 이유로 조희대 대법원장 탄핵을 추진하는 가운데 특검은 과거 불기소 및 각하 처분을 내렸던 것으로 확인됐습니다. 강동원 전국법관대표회의 의장은 판결이 마음에 들지 않는다는 이유의 탄핵은 삼권분립 파괴라며 집단행동 가능성을 언급했습니다. 한편 대법원은 한덕수 전 총리의 내란 혐의 중 계엄 선포 전 행위를 무죄 취지로 파기환송했습니다.", "pts": ["내란 특검은 조 대법원장의 계엄사 사법권 이양 논의 의혹에 대해 불기소 및 각하 결정을 내렸습니다.", "전국법관대표회의 강동원 의원은 대법원장 탄핵 추진에 대해 사법권 독립 침해라며 공개 비판했습니다.", "대법원은 한덕수 전 총리 판결에서 비상계엄의 위헌성을 인정하면서도 계엄 전 행위의 국헌문란 목적은 좁게 판단했습니다."], "kw": ["조희대", "탄핵소추", "전국법관대표회의", "한덕수"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859615&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859614&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008858906&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "정치", "h": "한동훈 \"조작 징계 원천무효\" vs 민주 당내 갈등 공개 폭발", "s": "무소속 한동훈 의원은 국민의힘 윤리위의 제명 결정이 조작 징계이자 기획 숙청이라며 장동혁 대표의 책임을 요구했습니다. 한편 취임 100일을 앞둔 민주당 김민석 대표는 지지율 10%p 상승 공약 달성에 실패한 가운데 당내 최고위원회의에서 친청계와 진상조사단 간의 거센 공개 충돌이 벌어졌습니다. 민주당 지지도 조사는 국민의힘에 뒤진 35.6%를 기록했습니다.", "pts": ["황경성 윤리위원의 폭로로 한동훈 의원 징계에 장동혁 대표가 개입했다는 '조작 징계' 의혹이 제기됐습니다.", "민주당은 신천지 당원 가입 조사 등을 둘러싸고 공개 회의에서 고성과 2차 가해 언쟁이 분출했습니다.", "리얼미터 조사에서 민주당 지지율은 8월 대비 12%p 이상 하락하며 35.6%를 기록했습니다."], "kw": ["한동훈", "장동혁", "김민석", "정당 지지도"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859635&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859624&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "최태원 \"노소영에 재산분할 9,440억 다 내겠다\" 대법 화해 요청", "s": "최태원 SK그룹 회장이 노소영 아트센터 나비 관장에게 파기환송심 재산분할금 9,440억 원을 전액 지급하겠다며 대법원에 화해 권고 결정을 요청했습니다. 상고를 취하하고 판결 금액을 수용하여 오랜 법적 분쟁을 원만히 마무리지으겠다는 취지입니다. 노 관장 측이 받아들이고 양측이 이의를 제기하지 않으면 9년 간의 이혼 소송이 최종 종료됩니다.", "pts": ["최 회장은 파기환송심이 산정한 9,440억 원의 재산분할액을 불복 상고했으나 전액 지급으로 입장을 선회했습니다.", "대법원에 화해 권고 결정을 요청했으며, 2주 내 양측이 이의를 제기하지 않으면 확정판결 효력을 가집니다.", "2017년부터 시작된 두 사람의 재산분할 법적 다툼이 9년 만에 마침표를 찍을지 관심이 쏠립니다."], "kw": ["최태원", "노소영", "재산분할", "화해권고"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859616&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "날씨", "h": "올 겨울 엘니뇨로 덜 춥지만 북극 한파·폭설 변수", "s": "올겨울은 역대 가장 강하게 발달한 엘니뇨의 영향으로 평년보다 기온이 높고 강수량이 많을 것으로 전망됩니다. 하지만 북극해 해빙이 역대 최저 수준으로 녹아내리면서 북극발 강력 한파가 기습 유입될 가능성도 큽니다. 따뜻한 바다 수온과 북극 한파가 충돌할 경우 강한 한파와 함께 폭설이 내릴 수 있습니다.", "pts": ["동태평양 수온이 평년보다 2.6도 높은 역대급 강한 엘니뇨로 남풍이 유입되어 기온을 올릴 수 있습니다.", "바렌츠해와 카라해의 얼음이 역대급으로 녹아 블로킹 고기압을 통한 북극 한파 유입 위험이 커졌습니다.", "기상청은 따뜻한 바다 수온과 한파가 만나 기습적인 대설이 발생할 위험에 대해 경고했습니다."], "kw": ["올겨울 날씨", "엘니뇨", "북극 한파", "폭설"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859623&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "생계급여 대상 확대…남녀 임금 격차 OECD 1위 지속", "s": "정부가 위기 가구 대상 생계급여 선정 기준을 중위소득 35%까지 단계적으로 확대하고, 긴급 위기 가구엔 신청 당일 30만 원을 지급합니다. 한편 지난해 한국의 남녀 임금 격차는 27.8%로 OECD 국가 중 가장 높은 1위를 유지했습니다. 소득 상하위 10% 간 임금 양극화도 3.62배로 심각한 수준을 보였습니다.", "pts": ["2030년까지 생계급여 기준이 중위소득 35%로 상향되며 중증장애인 포함 가구의 부양의무자 기준이 폐지됩니다.", "위기 가구 대상 당일 30만 원을 지원하는 신규 제도가 마련됩니다.", "한국 여성 임금은 남성의 72.2% 수준으로 2000년 이후 OECD 성별 임금 격차 1위를 이어갔습니다."], "kw": ["생계급여", "위기가구", "남녀 임금 격차", "OECD"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859629&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859630&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "권익위, 수능 부정행위 신고 포상금 최대 5억 원으로 확대", "s": "국민권익위원회가 수능 부정행위 신고 포상금을 기존 최대 1억 원에서 최대 5억 원으로 크게 확대했습니다. 공익신고자 보호법 시행령에 따라 부정행위자 수만큼 가산 지급하며 자수 후 공동부정행위자 신고 시 처벌 감경도 적용됩니다. 수능 리트 만점자 이모 씨 사망 사건 이후 경찰 수사와 부정행위 의혹 파장이 이어지고 있습니다.", "pts": ["권익위는 수능 공정성 훼손을 막기 위해 내년 1월 19일까지 부정행위 집중신고기간을 운영합니다.", "부정행위자 수에 따라 포상금이 가산되며 자수 및 타인 신고 시 본인 처벌 감경과 포상금이 유지됩니다.", "부정행위 의혹을 받던 수능 관련 인물의 사망 사건으로 과거 부정행위 추적과 처벌 범위에 관심이 집중됩니다."], "kw": ["수능 부정행위", "포상금 5억", "국민권익위원회", "집중신고"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859662&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859666&plink=RSSLINK&cooper=RSSREADER"}]}], "ok": true, "built": "2026-11-24"}, {"label": "당일 00:00–07:00 기사 기준", "items": [{"c": "날씨", "h": "오늘 경기 광주 날씨 구름 조금, 최저 -4도 최고 5도", "s": "오늘 경기 광주은 구름 조금, 최저 -4도 최고 5도입니다. 출근 시간대인 오전 8시에는 -1도입니다. 강수 확률은 최대 0퍼센트로, 우산은 필요 없겠습니다.", "pts": ["기온: 최저 -4도, 최고 5도 (오전 8시 -1도, 오후 6시 -2도)", "강수: 확률 최대 0퍼센트, 예상 강수량 0.0밀리미터", "바람: 최대 풍속 약 7미터", "미세먼지 좋음, 초미세먼지 좋음 (Open-Meteo 모델 예측치, 낮 시간 최대 기준)"], "kw": ["경기 광주", "구름 조금", "날씨"], "src": "Open-Meteo 예측 모델(기상청 공식 예보와 다를 수 있음)", "date": "2026-11-24"}, {"c": "정치", "h": "이재명 대통령, 외교안보 라인 등 5개 부처 '중폭' 개각", "s": "이재명 대통령이 국가정보원장과 외교부, 통일부 등 장관급 5명을 교체하는 개각을 단행했습니다. 국정원장에는 판사 출신 강금실 전 법무부 장관이, 통일부 장관에는 홍익표 전 청와대 정무수석이 지명됐습니다. 이번 인선은 최근 불협화음을 낸 한미 관계를 재정비하고 향후 정상외교를 대비하기 위한 조치로 풀이됩니다.", "pts": ["국정원장 강금실, 외교부 장관 임웅순, 통일부 장관 홍익표 등 장관급 5명이 교체됐습니다.", "지난 3월 통일장관의 발언 등으로 한미 간 정보 공유에 이상기류가 발생한 배경이 인사에 영향을 준 것으로 풀이됩니다.", "대통령의 향후 방미 일정 등을 앞두고 외교안보 라인을 전격 재정비해 한미 관계를 관리하려는 의도로 해석됩니다."], "kw": ["개각", "강금실", "홍익표", "한미관계"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859806&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859807&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859933&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "국제", "h": "엔비디아 젠슨 황, 불륜 사임 11일 만에 CEO 복귀", "s": "엔비디아 이사회가 사임 11일 만에 젠슨 황 전 CEO의 전격 복귀를 만장일치로 의결했습니다. 트럼프 미국 대통령의 촉구와 이사회 압박, 그리고 주가 폭락에 따른 부담이 복귀 결정의 배경으로 꼽힙니다. 젠슨 황의 복귀 발표 이후 엔비디아 주가는 개장 직후 30% 이상 급등했습니다.", "pts": ["중국 스파이 의혹 여성과의 불륜 인정으로 사임했던 젠슨 황이 11일 만에 복귀했습니다.", "트럼프 대통령의 거듭된 지원 사격과 40% 넘게 폭락했던 주가 부담이 이사회 결정에 결정적 영향을 미쳤습니다.", "미 정부는 불법행위 증거가 없다고 밝혔으나, 미 의회 청문회 비공개 증언 등 조사는 지속될 예정입니다."], "kw": ["엔비디아", "젠슨 황", "트럼프", "주가 폭락"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859808&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859836&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859857&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "경제", "h": "최태원 SK 회장, 9,440억 지급 수용…9년 재산분할 소송 마침표 내나", "s": "최태원 SK그룹 회장이 노소영 관장과의 재산분할 소송에서 산정된 9,440억 원을 전액 지급하겠다며 대법원에 화해권고 결정을 요청했습니다. 대법원이 이를 받아들이고 양측이 2주 내 이의를 제기하지 않으면 법적 다툼은 확정판결과 같은 효력을 갖게 됩니다. 이에 따라 지난 2017년부터 9년간 이어진 두 사람의 이혼 소송이 마무리될지 주목됩니다.", "pts": ["최태원 회장이 파기환송심 재판부가 산정한 9,440억 원의 재산분할금을 전액 지급하겠다고 밝혔습니다.", "분쟁의 원만하고 최종적인 마무리를 위해 대법원에 화해권고 결정 요청서를 제출했습니다.", "노소영 관장 측이 이의를 제기하지 않고 화해권고가 확정되면 9년 만에 소송이 최종 종결됩니다."], "kw": ["최태원", "노소영", "재산분할", "화해권고"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859813&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859936&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "수능 'AI 부정행위' 조사 난항…시험지 폐기·내신 시험 불안 확산", "s": "수능 'AI 커닝' 의혹을 검증하려던 교육부의 지침에도 불구하고, 보존 기간 1년이 지나 이미 지난해 수능 시험지를 파쇄한 학교가 많은 것으로 나타났습니다. 이에 따라 과거 시험을 통한 검증 작업이 난항을 겪고 있습니다. 한편 수능에 이어 다가오는 중·고교 기말고사와 내신 수행평가에서도 AI 부정행위에 대한 불안감이 크게 번지고 있습니다.", "pts": ["교육부가 지난해 수능 시험지 보존을 지시했으나 규정상 보존기한(1년)이 지나 다수 학교가 이미 파쇄했습니다.", "스마트안경과 카메라 등 첨단 기기를 활용한 수능 부정행위자 5명이 추가로 고발됐습니다.", "수시 비중이 높은 상황에서 학교별 대응 역량이 부족해 내신 시험의 AI 부정행위 우려가 고조되고 있습니다."], "kw": ["수능", "AI 부정행위", "시험지 폐기", "내신"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859810&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859811&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859950&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "'만취 음주운전' 배우 고경표 경찰 출석…울먹이며 사과", "s": "만취 상태로 운전하다 청소차를 들이받은 배우 고경표 씨가 경찰에 출석해 조사를 받았습니다. 사고 당시 고 씨의 혈중알코올농도는 0.15%로 면허 취소 수준이었으며, 작업자 1명이 다친 것으로 알려졌습니다. 과거 음주운전 예방 홍보대사로 활동했던 고 씨는 이번 사고로 출연 중이던 예능 프로그램에서 하차했습니다.", "pts": ["배우 고경표가 서울 마포구에서 혈중알코올농도 0.15%의 만취 상태로 운전 중 청소차를 들이받았습니다.", "경찰 조사를 마친 고 씨는 팬들에게 사과했으며, 경찰은 위험운전치사상 혐의 적용을 검토하고 있습니다.", "과거 교통사고 예방 홍보대사 이력이 알려져 비판이 거세졌고 예능 프로그램에서 하차했습니다."], "kw": ["고경표", "음주운전", "경찰 조사", "면허 취소"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859820&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859935&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "선관위 특검, '개표상황표 위조' 직원 1명 구속…7명 기각", "s": "6·3 지방선거 당시 개표상황표를 은닉하고 위조한 혐의를 받는 선관위 직원 1명이 구속됐습니다. 선관위 특검 출범 78일 만의 첫 신병 확보입니다. 그러나 실시간 투표율 허위 입력과 무번호 투표용지 관련 투표록 사후 수정 혐의를 받는 다른 직원 7명의 구속영장은 기각됐습니다.", "pts": ["지방선거 개표상황표를 조작해 결과를 바꾸려 한 시도선관위 직원 1명이 증거 인멸 염려로 구속됐습니다.", "투표율 임의 수정 및 투표록 위·변조 혐의를 받는 직원 7명의 영장은 소명 부족 등을 이유로 기각됐습니다.", "특검은 기각 사유를 검토한 뒤 상급자 등을 포함해 구속영장 재청구를 검토할 방침입니다."], "kw": ["선관위 특검", "지방선거", "개표 조작", "구속영장"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859847&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859934&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "부산 사하구 단독주택 화재…일가족 추정 3명 사망", "s": "부산 사하구 당리동의 한 2층짜리 단독주택에서 불이 나 1시간 14분 만에 진화됐습니다. 이 불로 집 안에 있던 80대 여성과 50대 남성 등 3명이 숨졌습니다. 소방당국은 숨진 이들이 가족관계인 것으로 추정하고 정확한 화재 원인을 조사 중입니다.", "pts": ["어제 저녁 부산 사하구 당리동 2층 단독주택에서 원인을 알 수 없는 불이 났습니다.", "소방 인력이 출동해 진화 작업을 벌였으나 집 안에서 3명이 숨진 채 발견됐습니다.", "숨진 이들은 일가족으로 추정되며 정확한 발화 원인 조사가 진행되고 있습니다."], "kw": ["부산 화재", "단독주택", "일가족 사망"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859840&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "국제", "h": "미 트럼프 행정부, 한국 등 디지털 규제에 '무역법 301조' 조사 검토", "s": "도널드 트럼프 미 행정부가 한국과 EU, 호주의 온라인 플랫폼 및 망 사용료 등 디지털 규제에 대해 무역법 301조 조사를 검토 중인 것으로 전해졌습니다. 무역법 301조는 불공정 무역 관행에 대해 보복 관세를 부과할 수 있는 강력한 조항입니다. 이번 조치가 현실화될 경우 대미 관세 불확실성이 다시 커질 것이라는 우려가 나오고 있습니다.", "pts": ["미 무역대표부가 자국 빅테크에 불리하다고 판단되는 한국과 EU 등의 디지털 규제 조사를 준비 중입니다.", "무역법 301조가 적용될 경우 대통령 재량으로 추가 관세 등 보복 조치가 취해질 수 있습니다.", "한국이 기존에 합의했던 관세 상한선(15%) 유지에 대한 불확실성이 커질 수 있다는 관측이 제기됩니다."], "kw": ["트럼프", "무역법 301조", "디지털 규제", "보복 관세"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859834&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "국제", "h": "제31차 유엔기후변화총회, 17년 만에 합의 무산…'네 탓' 공방", "s": "제31차 유엔기후변화협약 당사국총회가 17년 만에 공동 합의문을 내지 못하고 파행했습니다. 화석연료 감축 문구를 저지한 사우디 등 산유국과 이를 강경하게 요구한 EU, 그리고 중재에 실패한 의장국을 향해 비판이 쏟아지고 있습니다. 일각에서는 재원 지원 약속 없이 화석연료 퇴출만 강요한 선진국의 이중 잣대가 결렬을 불렀다는 지적도 나옵니다.", "pts": ["COP31 총회가 화석연료 의존도 감축과 기후 적응 재원 배분을 둘러싼 대립 끝에 결렬됐습니다.", "산유국의 반발과 EU의 강경한 태도, 호주·튀르키예 의장단의 중재력 부재가 실패 원인으로 꼽힙니다.", "개발도상국 지원 재원 목표가 초안에서 삭제되면서 부유한 국가들의 정치적 책임론도 거세지고 있습니다."], "kw": ["기후변화총회", "COP31", "합의 무산", "화석연료"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859837&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "서울지하철 파업 기로…노사 오늘 막판 최종 교섭", "s": "전면파업을 예고한 서울지하철 노조와 서울교통공사가 오늘 오전 최종 교섭을 진행합니다. 인력 감축 철회와 안전 인력 충원 등을 두고 양측의 입장이 팽팽히 맞서고 있습니다. 오늘 협상이 결렬되면 내일 첫 차부터 파업이 시작되어 출퇴근길 지하철 운행 차질이 우려됩니다.", "pts": ["서울교통공사 노사가 인력 감축과 임금 인상 등 핵심 쟁점을 놓고 최종 협상에 나섭니다.", "협상 결렬 시 노조는 내일(25일) 첫 차부터 전면파업에 돌입할 예정입니다.", "지하철이 필수공익사업이라 최저 운행률은 유지되지만 출퇴근 시간대 혼잡과 차질은 피하기 어려울 전망입니다."], "kw": ["서울지하철", "최종 교섭", "총파업 예고", "서울교통공사"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008859939&plink=RSSLINK&cooper=RSSREADER"}]}], "ok": true}];

  var base=tab==0?y:d,items=DATA[tab].items,k=0;
  document.body.dataset.tab=tab==0?"e":"m";
  $("hi").textContent=tab==0?"오늘도 수고했어요!":"좋은 아침이에요!";
  $("t0").setAttribute("aria-selected",tab==0);$("t1").setAttribute("aria-selected",tab==1);
  $("tl").textContent=(base.getMonth()+1)+"월 "+base.getDate()+"일 · "+DATA[tab].label;
  if(!items.length){$("list").innerHTML='<div class="empty">아직 모인 기사가 없어요 🥲<br>기사가 쌓이면 뉴콩이가 가져올게요!</div>';return}
  $("list").innerHTML=items.map(function(n,i){
    var wx=n.c==="날씨",num=wx?wicon(n):(++k);
    var lk=(n.links&&n.links.length)?'<h3>원문 보기</h3><div class="lk">'+n.links.map(function(l){return'<a href="'+esc(l.u)+'" target="_blank" rel="noopener noreferrer">'+esc(l.s)+' ↗</a>'}).join("")+'</div>':"";
    return '<div class="row'+(wx?' wx':'')+'" id="c'+i+'" style="--c:'+(CC[n.c]||"#5b6cff")+'"><div class="head"><div class="no">'+num+'</div>'+
    '<button class="tg" data-i="'+i+'" aria-expanded="false"><span class="cat">'+esc(n.c)+'<span class="eq"><i></i><i></i><i></i></span></span><h2>'+esc(n.h)+'</h2><p>'+esc(n.s)+'</p><span class="more">자세히 보기</span></button>'+
    (TTS?'<button class="spk" data-s="'+i+'" aria-label="이 기사 듣기">🔊</button>':'<span></span>')+'</div>'+
    '<div class="detail"><div><h3>핵심 포인트</h3><ul>'+(n.pts||[]).map(function(p){return'<li>'+esc(p)+'</li>'}).join("")+'</ul><h3>키워드</h3><div class="kw">'+(n.kw||[]).map(function(x){return'<span>#'+esc(x)+'</span>'}).join("")+'</div><h3>출처</h3><div class="src">'+esc(n.src)+'</div>'+lk+'</div></div></div>';
  }).join("");
}

/* ---- 듣기: 문장 단위로 끊어 읽기(안드로이드 크롬/삼성 인터넷 호환) ---- */
function text(n){return n.c+" 소식입니다. "+n.h+". "+n.s+" "+(n.pts||[]).join(". ")}
function chunks(s){return (s.match(/[^.!?。]+[.!?。]*\s*/g)||[s]).map(function(x){return x.trim()}).filter(Boolean)}
function mark(i){[].forEach.call(document.querySelectorAll(".row"),function(c,k){c.classList.toggle("playing",k===i)})}
function lock(){try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(function(l){wl=l}).catch(function(){})}catch(e){}}
function unlock(){try{if(wl){wl.release();wl=null}}catch(e){}}
function loadCard(k){
  if(k>=queue.length){stop();return false}
  var n=DATA[tab].items[queue[k]];
  qi=k;ci=0;CH=chunks(text(n));mark(queue[k]);talk(true);
  $("np").textContent=(queue.length>1?(k+1)+"/"+queue.length+" · ":"")+n.h;
  var el=$("c"+queue[k]);if(el&&el.scrollIntoView)el.scrollIntoView({block:"center",behavior:"smooth"});
  return true;
}
function say(){
  if(paused||qi<0)return;
  if(ci>=CH.length){if(loadCard(qi+1))say();return}
  var my=++tok;
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(CH[ci]);
  u.lang="ko-KR";u.rate=parseFloat($("rate").value);
  var v=speechSynthesis.getVoices().filter(function(x){return x.lang&&x.lang.replace("_","-").toLowerCase().indexOf("ko")==0})[0];
  if(v)u.voice=v;
  u.onend=function(){if(my===tok&&!paused){ci++;say()}};
  u.onerror=function(){if(my===tok&&!paused){ci++;say()}};
  speechSynthesis.speak(u);
}
function start(list){stop();if(!TTS||!list.length)return;queue=list;lock();if(loadCard(0))say()}
function stop(){tok++;paused=false;qi=-1;queue=[];CH=[];if(TTS)speechSynthesis.cancel();mark(-1);talk(false);unlock();$("pp").textContent="⏸";$("np").textContent=NP0}
$("list").addEventListener("click",function(e){
  var s=e.target.closest("[data-s]");
  if(s){start([+s.dataset.s]);return}
  var t=e.target.closest(".tg");
  if(t){var c=$("c"+t.dataset.i);var o=c.classList.toggle("open");t.setAttribute("aria-expanded",o)}
});
$("t0").onclick=function(){stop();tab=0;render()};
$("t1").onclick=function(){stop();tab=1;render()};
$("all").onclick=function(){start(DATA[tab].items.map(function(_,i){return i}))};
$("pp").onclick=function(){
  if(!TTS||qi<0)return;
  if(paused){paused=false;$("pp").textContent="⏸";talk(true);say()}
  else{paused=true;tok++;speechSynthesis.cancel();talk(false);$("pp").textContent="▶"}
};
$("stop").onclick=stop;
$("rate").onchange=function(){try{localStorage.setItem("rate",$("rate").value)}catch(e){}};
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&qi>=0&&!paused)lock()});
if(!TTS)document.querySelector(".bar").style.display="none";
$("np").textContent=NP0;
render();
</script>
</body>
</html>
