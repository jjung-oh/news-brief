<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뉴콩이의 출근길 뉴스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6f0;--card:#fff;--ink:#4a3a3a;--sub:#8a7468;--bd:#f0dcc6;--accent:#ff6f91;--onacc:#fff;--tint:#e3f3ff;--tbd:#bfe0f7;
--skyM:linear-gradient(170deg,#ffe3b3,#ffc2d4 55%,#b9ddff);--onM:#4a3a3a;
--skyE:linear-gradient(170deg,#5b4aa8,#8f5db8 60%,#c26aa9);--onE:#fff;
--disp:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
--sans:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1830;--card:#2b2344;--ink:#fff1e6;--sub:#c4b6d9;--bd:#40355f;--accent:#ff8fab;--onacc:#2a1730;--tint:#1f3350;--tbd:#2f4d75;
--skyM:linear-gradient(170deg,#5a4263,#8a5566 55%,#3b5c8f);--onM:#fff;--skyE:linear-gradient(170deg,#171236,#2d2160 55%,#5a3070);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1e1830;--card:#2b2344;--ink:#fff1e6;--sub:#c4b6d9;--bd:#40355f;--accent:#ff8fab;--onacc:#2a1730;--tint:#1f3350;--tbd:#2f4d75;
--skyM:linear-gradient(170deg,#5a4263,#8a5566 55%,#3b5c8f);--onM:#fff;--skyE:linear-gradient(170deg,#171236,#2d2160 55%,#5a3070);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;word-break:keep-all;overflow-wrap:break-word}
body[data-tab="m"]{--sky:var(--skyM);--on:var(--onM)}
body[data-tab="e"]{--sky:var(--skyE);--on:var(--onE)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
body[data-tab="m"] .e-only,body[data-tab="e"] .m-only{display:none}

/* 하늘 + 뉴콩이 */
.sky{position:relative;overflow:hidden;background:var(--sky);color:var(--on);border-radius:0 0 34px 34px;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 20px;transition:background .4s}
.sky-in{position:relative;max-width:640px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-family:var(--disp);font-weight:400;font-size:29px;line-height:1.25;margin:0}
.date{margin:4px 0 0;font-size:14px;opacity:.85}
.hi{font-family:var(--disp);font-size:16px;margin-top:2px}
.orb{position:absolute;right:120px;top:2px;width:40px;height:40px;border-radius:50%}
body[data-tab="m"] .orb{background:radial-gradient(circle at 40% 40%,#fffbe0,#ffd566 65%);box-shadow:0 0 20px 6px rgba(255,214,102,.6)}
body[data-tab="e"] .orb{background:#fff7d6;box-shadow:inset -9px -3px 0 0 rgba(140,110,190,.55),0 0 18px 3px rgba(255,255,255,.3)}
.deco{position:absolute;font-size:20px;pointer-events:none}
.d1{right:36%;top:46px}.d2{right:10px;top:4px;font-size:15px}.d3{left:52%;top:8px;font-size:14px}
.mascot-wrap{position:relative;flex:none;width:100px}
.mascot{display:block;width:100px;height:100px;overflow:visible}
.mascot *{transform-box:fill-box}
.eyes-shut,.mouth-talk{display:none}
body[data-tab="m"] .eyes-shut{display:none}
body[data-tab="e"]:not(.talk) .eyes-open{display:none}
body[data-tab="e"]:not(.talk) .eyes-shut{display:inline}
.wave{transform-origin:50% 85%;animation:wave 1.8s ease-in-out infinite}
body[data-tab="e"] .wave{animation:none}
.zz{font-family:var(--disp);font-size:15px;fill:#fff;animation:zz 2.4s ease-in-out infinite}
.talk .mouth{display:none}
.talk .mouth-talk{display:inline;transform-origin:center;animation:yap .32s ease-in-out infinite alternate}
.talk .bob{animation:bob .5s ease-in-out infinite alternate}
.note{position:absolute;font-size:18px;opacity:0;color:var(--on)}
.n1{left:-4px;top:6px}.n2{right:-2px;top:-4px}
.talk .note{animation:note 1.5s ease-out infinite}
.talk .n2{animation-delay:.7s}
@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(22deg)}}
@keyframes yap{from{transform:scaleY(.35)}to{transform:scaleY(1.25)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes zz{0%,100%{opacity:.4;transform:translateY(2px)}50%{opacity:1;transform:translateY(-3px)}}
@keyframes note{0%{opacity:0;transform:translateY(8px)}30%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
.notice{display:inline-block;margin:10px 0 14px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.35);font-size:12.5px}
.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.3);max-width:340px}
.tab{flex:1;padding:9px 0;border:0;border-radius:999px;background:transparent;font-family:var(--disp);font-size:16px;color:var(--on)}
.tab[aria-selected="true"]{background:#fff;color:#4a3a3a;box-shadow:0 2px 0 rgba(0,0,0,.12)}

main{max-width:640px;margin:0 auto;padding:18px 16px 160px}
.tl{font-size:13px;color:var(--sub);margin:0 0 12px 4px}
.empty{color:var(--sub);font-size:15px;padding:36px 0;text-align:center}

/* 말랑한 기사 카드: 번호 = 전체 듣기 재생 순서 */
.row{--bd2:var(--bd);background:var(--card);border:2px solid var(--bd);border-radius:24px;margin-bottom:14px;box-shadow:0 4px 0 var(--bd);transition:border-color .2s,box-shadow .2s}
@supports (color:color-mix(in srgb,red,blue)){.row{--bd2:color-mix(in srgb,var(--c) 35%,var(--bg));border-color:var(--bd2);box-shadow:0 4px 0 var(--bd2)}}
.row.playing{border-color:var(--c);box-shadow:0 4px 0 var(--c)}
.head{display:grid;grid-template-columns:38px 1fr 44px;gap:10px;padding:14px}
.no{width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;font-family:var(--disp);font-size:19px;display:grid;place-items:center}
.playing .no{animation:hop .6s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-4px)}}
.tg{text-align:left;background:none;border:0;padding:0;min-width:0}
.cat{display:inline-flex;align-items:center;gap:6px;font-family:var(--disp);font-size:13px;color:var(--c);padding:1px 10px;border-radius:999px;border:1.5px solid var(--c)}
.tg h2{font-family:var(--disp);font-weight:400;font-size:18px;line-height:1.45;margin:6px 0 6px}
.tg p{margin:0;color:var(--sub);font-size:14.5px}
.more{display:inline-block;margin-top:8px;font-family:var(--disp);font-size:13px;color:var(--accent)}
.more::after{content:" ▾"}
.open .more::after{content:" ▴"}
.spk{width:44px;height:44px;border-radius:50%;border:2px solid var(--bd);background:var(--bg);font-size:18px;transition:background .2s}
.playing .spk{background:var(--c);border-color:var(--c)}
.eq{display:none;gap:2px;align-items:flex-end;height:11px}
.playing .eq{display:inline-flex}
.eq i{width:3px;background:var(--c);border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.25s}.eq i:nth-child(3){animation-delay:.5s}
@keyframes eq{0%,100%{height:3px}50%{height:11px}}

.detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease;margin:0 14px 0 62px;font-size:14px}
.open .detail{grid-template-rows:1fr}
.detail>div{overflow:hidden}
.open .detail>div{padding-bottom:16px}
.detail h3{font-family:var(--disp);font-weight:400;font-size:13px;color:var(--sub);margin:12px 0 4px}
.detail ul{margin:0;padding-left:18px}
.detail li{margin-bottom:3px}
.kw span{display:inline-block;font-size:12.5px;background:var(--bg);border-radius:999px;padding:0 10px;margin:0 4px 4px 0;color:var(--sub)}
.src{font-size:12.5px;color:var(--sub)}
.lk a{display:inline-block;font-size:13px;color:var(--accent);margin-right:14px}

/* 날씨 */
.wx{background:var(--tint);border-color:var(--tbd);box-shadow:0 4px 0 var(--tbd)}
.wx .no{background:var(--card);font-size:22px;color:inherit}

/* 플레이어 */
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:616px;margin:0 auto;background:var(--card);border:2px solid var(--bd);border-radius:26px;padding:10px 12px;box-shadow:0 4px 0 var(--bd),0 12px 24px rgba(60,30,40,.15);z-index:5}
.np{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px 8px}
.ctl{display:flex;gap:8px;align-items:center}
.ctl button,.ctl select{height:44px;border:2px solid var(--bd);background:var(--bg);color:var(--ink);border-radius:16px;font-family:var(--disp);font-size:16px;padding:0 14px}
.ctl .main{flex:1;background:var(--accent);border-color:var(--accent);color:var(--onacc)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

var DATA=[{"label": "전날 18:00–24:00 기사 기준", "items": [{"c": "경제", "h": "정부 'F4' 긴급회의…증안펀드 가동 및 자사주 제한 완화", "s": "정부와 금융 당국 수장들이 증시 변동성 확대에 대응해 증권시장안정펀드를 즉시 가동할 수 있도록 준비에 착수했습니다. 상장기업의 자사주 매수 한도를 완화하고 3개월간 불법 공매도를 특별 집중 감시하기로 했습니다.", "pts": ["미국 증시 하락과 AI 관련 투자 심리 위축으로 코스피 5,000선이 붕괴하는 등 국내외 증시 변동성이 확대되었습니다.", "정부는 컨틴전시 플랜에 따라 10조 7천6백억 원 규모의 증안펀드 가동 준비와 함께 자사주 매수 한도 완화 대책을 내놓았습니다.", "대외 신인도 하락 우려로 공매도 제한은 제외되었으며, 3개월간 불법 공매도 특별 집중 감시가 실시됩니다."], "kw": ["증시안정펀드", "F4", "불법 공매도", "자사주"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008857913&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008857885&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "한전, 고객·임직원 152만여 건 개인정보 유출 사고 발생", "s": "한국전력의 '한전ON'과 전자조달시스템에서 152만여 건의 개인정보가 유출되는 대형 사고가 발생했습니다. 유출 정보에는 고객의 계좌번호, 카드번호뿐만 아니라 주민등록번호까지 포함되어 있어 2차 피해가 우려됩니다.", "pts": ["한전ON 65만여 명과 전자조달시스템 이용자 86만여 명의 정보가 외부 불법 침입으로 유출되었습니다.", "한전은 외부 IP 접속을 차단하고 개인정보보호위원회 신고 및 경찰 수사를 의뢰했습니다.", "지난달 3만 5천여 건 유출 사고에 이어 한 달 만에 추가 대형 유출 사고가 발생해 보안 체계에 비판이 쏠리고 있습니다."], "kw": ["한국전력", "개인정보 유출", "한전ON", "전자조달시스템"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008857929&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008857887&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "수능 AI 부정행위 대응 논란…최교진 교육장관 사퇴", "s": "수능 부정행위 방지 대책 혼선과 국회 실언 논란을 겪은 최교진 교육부 장관이 사의를 표명하고 면직 처리되었습니다. SBS 실험 결과 최신 AI 모델이 올해 수능 시험을 10분 만에 만점 처리하며 현행 수능 제도의 개편 필요성이 제기되고 있습니다.", "pts": ["AI를 활용한 부정행위 부실 대응과 미흡한 수능 직전 대책 발표로 수험생 혼란을 초래한 책임으로 교육장관이 사퇴했습니다.", "챗GPT 최신 모델이 수능 전 과목을 10분 만에 만점 받는 등 현행 객관식 수능 방식의 한계가 드러났습니다.", "전문가들은 객관식 위주의 수능 평가에서 벗어나 서술형·논술형 및 면접 평가 확대 등 입시 제도 개편을 주문했습니다."], "kw": ["최교진", "교육부 장관 사퇴", "수능", "AI 부정행위"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008857881&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008857884&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "경제", "h": "트럼프 데이터센터 세금 경고·금리 인상 우려에 증시 불안", "s": "트럼프 미 대통령이 해외 데이터센터 건설 기업에 세금을 부과하겠다고 나서면서 반도체 및 관련 업계가 긴장하고 있습니다. 여기에 미국 연준의 추가 금리 인상 전망과 외국인의 강한 매도세가 더해져 국내 증시의 출렁임이 심화되고 있습니다.", "pts": ["미국 기업의 해외 데이터센터 투자에 대한 트럼프의 중과세 방침으로 AI 투자 위축 우려가 커졌습니다.", "미 연준의 금리 인상 가능성과 외국인 투자자의 고강도 순매도로 코스피가 큰 폭의 하락세를 보였습니다.", "반도체 기업들의 실적은 안정적이나 외국인 수급이 개선되기 전까지는 증시 불확실성이 이어질 전망입니다."], "kw": ["데이터센터", "트럼프", "코스피", "금리 인상"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008857886&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "정치", "h": "이 대통령, 면직 즉각 재가…시험 문제지 기술적 차단 지시", "s": "이재명 대통령은 최교진 장관의 면직안을 즉각 재가하고 시험의 공정성을 강조했습니다. 시험 중 문제지 촬영과 외부 전송을 기술적으로 차단할 법적 근거 정비 등 추가 대책 마련을 지시했습니다.", "pts": ["수능 혼란에 따른 문책성 조치로 최 장관의 면직안이 제출 1시간 만에 재가되었습니다.", "대통령은 문제지 유출 방지를 위한 고유 식별 표식 도입과 각종 국가시험 관리 실태 범정부 점검을 주문했습니다.", "야당인 국민의힘은 무능한 결과라며 대통령의 직접적인 입장 표명을 촉구했습니다."], "kw": ["이재명 대통령", "면직 재가", "시험 공정성", "문제지 유출"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008857882&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "국제", "h": "COP31 기후총회, '화석연료 퇴출' 이견으로 합의 무산", "s": "튀르키예에서 열린 제31차 유엔기후변화협약 당사국총회(COP31)가 합의문 채택 없이 폐막했습니다. 화석연료의 단계적 퇴출 문구를 두고 산유국과 유럽연합 간의 이견을 좁히지 못했습니다.", "pts": ["사우디아라비아 등 산유국의 반대로 화석연료 퇴출 문구가 빠지자 EU 등이 최종안을 거부했습니다.", "기후총회에서 공식 합의문 채택이 무산된 것은 2009년 코펜하겐 총회 이후 17년 만의 일입니다.", "기존 파리협정 의무는 유지되지만 향후 국제사회의 기후변화 대응 동력이 약화될 우려가 있습니다."], "kw": ["COP31", "유엔기후총회", "화석연료", "합의 무산"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008857970&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "국제", "h": "김정은, 주북 러시아대사 신임장 직접 접수…30년 만의 변화", "s": "김정은 북한 국무위원장이 안드레이 포드욜리셰프 신임 주북 러시아 대사로부터 직접 신임장을 받았습니다. 북한 최고지도자가 외교사절의 신임장을 직접 제정받은 것은 30여 년 만에 처음입니다.", "pts": ["헌법 개정을 통해 외교사절 신임장 수임 권한이 최고인민회의 상임위원장에서 국무위원장으로 변경되었습니다.", "김정일 국방위원장 시절 확립되었던 의전을 김일성 주석 시절의 최고지도자 직접 접수 방식으로 되돌렸습니다.", "러시아 대사를 비롯한 외교사절들이 참석한 가운데 북·러 간 밀착 행보가 이어졌습니다."], "kw": ["김정은", "러시아 대사", "신임장", "의전 변화"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008857977&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "국제", "h": "엔비디아 AI 칩 중국 밀수망에 젠슨 황 연인 연루 의혹", "s": "미국의 통제를 피해 엔비디아의 AI 칩을 중국으로 우회 수입한 암시장 네트워크에 젠슨 황 전 CEO의 연인인 앨리스 황이 연루되었다는 보도가 나왔습니다. 동남아를 거쳐 수조 원대의 칩이 중국으로 흘러 들어간 것으로 파악됐습니다.", "pts": ["앨리스 황이 대표로 있던 싱가포르 업체의 말레이시아 자회사가 1년간 46억 달러 규모의 물품을 수입했습니다.", "밀수 과정에 미국 제재 대상인 캄보디아 범죄조직 관계자도 관여한 정황이 확인되었습니다.", "엔비디아 측은 해당 거래 업체를 거래 제한 명단에 올렸다고 밝혔으며 관련 단체들은 의혹을 부인했습니다."], "kw": ["엔비디아", "젠슨 황", "AI 칩 밀수", "앨리스 황"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008857980&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "경제", "h": "5세대 실손 전환 시 보험료 반값…병원 이용 적어야 유리", "s": "다음 주부터 1·2세대 실손보험 가입자가 5세대로 전환하면 3년간 보험료를 50% 할인받을 수 있습니다. 다만 5세대 상품은 비급여 자기부담 비율이 높아 병원을 자주 방문하는 경우 신중한 결정이 필요합니다.", "pts": ["정부는 초기 실손보험 가입자의 부담을 줄이고자 5세대 전환 시 3년간 보험료 반값 혜택을 제공합니다.", "5세대 상품은 보험료가 대폭 저렴해지는 대신 비급여 치료에 대한 본인 부담률이 크게 상승합니다.", "고령이거나 병원 이용 횟수가 많은 가입자는 기존 보험을 유지하는 것이 유리할 수 있습니다."], "kw": ["실손보험", "5세대 실손", "보험료 할인", "자기부담금"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008857893&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "평창 비닐하우스 공기총 연습 중 행인 맞아 사망…구속영장", "s": "강원 평창의 한 비닐하우스에서 공기총 사격 연습을 하던 60대 남성이 지나가던 주민을 쏴 숨지게 한 사건이 발생했습니다. 경찰은 총포 소지 허가가 없는 피의자에 대해 중과실치사 혐의로 구속영장을 신청했습니다.", "pts": ["피의자 A씨가 비닐하우스 안에서 열린 출입문 방향으로 사격 연습을 하다가 길 가던 주민을 맞혔습니다.", "피해자는 병원으로 이송되었으나 숨졌으며, 두 사람은 일면식이 없는 사이로 조사되었습니다.", "경찰은 허가 없이 공기총을 소지하게 된 경위와 정확한 사고 원인을 조사하고 있습니다."], "kw": ["공기총 사고", "평창", "중과실치사", "구속영장"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008857974&plink=RSSLINK&cooper=RSSREADER"}]}], "ok": true, "built": "2026-11-23"}, {"label": "당일 00:00–07:00 기사 기준", "items": [{"c": "날씨", "h": "오늘 경기 광주 날씨 비, 최저 -1도 최고 10도", "s": "오늘 경기 광주은 비, 최저 -1도 최고 10도입니다. 출근 시간대인 오전 8시에는 1도입니다. 강수 확률은 최대 100퍼센트로, 우산을 꼭 챙기세요.", "pts": ["기온: 최저 -1도, 최고 10도 (오전 8시 1도, 오후 6시 10도)", "강수: 확률 최대 100퍼센트, 예상 강수량 11.7밀리미터", "바람: 최대 풍속 약 6미터", "일교차가 11도로 큽니다. 겉옷을 챙기세요", "미세먼지 보통, 초미세먼지 보통 (Open-Meteo 모델 예측치, 낮 시간 최대 기준)"], "kw": ["경기 광주", "비", "날씨"], "src": "Open-Meteo 예측 모델(기상청 공식 예보와 다를 수 있음)", "date": "2026-11-23"}, {"c": "경제", "h": "'검은 월요일' 공포에 증시안정펀드 가동 준비", "s": "미국 증시 급락과 AI·반도체 악재로 우리 증시에 '검은 월요일' 공포가 커지자 정부가 10조 7천억 원 규모의 증시안정펀드 투입을 준비했습니다. 상장기업의 자사주 매수 수량 제한도 완화하기로 했으나, 공매도 제한 조치는 대외 신인도 등을 고려해 이번 대책에서 제외되었습니다.", "pts": ["정부는 지수 급락 시 공포 심리를 진정시키기 위해 10조 7천600억 원 규모의 증시안정펀드 가동을 준비 중입니다.", "트럼프 대통령의 해외 데이터센터 세금 부과 발언과 연준의 금리 인상 전망이 미국 및 국내 증시의 AI·반도체주에 악재로 작용했습니다.", "공매도 제한 조치는 선진국지수 편입 추진과 대외 신인도 하락 우려로 빠졌으며 불법 공매도 감시를 강화하기로 했습니다."], "kw": ["증시안정펀드", "코스피", "공매도", "AI 악재"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008858029&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008858040&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "수능 AI 부정행위 혼란 속 최교진 장관 사퇴", "s": "수능을 앞두고 발생한 AI 부정행위 논란과 부실 대응, 국회에서의 실언으로 비판을 받은 최교진 교육부 장관이 사퇴했습니다. 청와대는 면직안을 재가하고 후임 인선에 착수했으며 이재명 대통령은 시험 중 문제지 유출 및 AI 부정행위를 차단할 법적 근거 정비를 지시했습니다.", "pts": ["최교진 교육부 장관이 수능 전후 발생한 AI 부정행위 부실 대응과 국회 실언 논란에 책임을 통감하며 사퇴했습니다.", "이재명 대통령은 문제지 고유식별표식 도입 등 기술적 부정행위 차단 방안과 법적 근거 정비를 지시했습니다.", "야당은 무능과 무책임의 결과라며 대통령의 책임 있는 입장 표명을 촉구했고 여당은 신속한 수습을 강조했습니다."], "kw": ["수능", "AI 부정행위", "교육부 장관 사퇴", "시험 공정성"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008858030&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008858031&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "국제", "h": "트럼프 \"이란과 합의 안 되면 새해 추가 공격\"", "s": "도널드 트럼프 미국 대통령이 이란과의 협상이 성과 없이 시간만 끌고 있다며, 새해 이후 추가 군사 공격에 나설 수 있다고 경고했습니다. 이란 당국을 향해 '말만 하는 전문 탭댄서'라고 비판하며 해상 봉쇄를 뚫으려 할 경우 엄중히 대응하겠다고 압박했습니다.", "pts": ["트럼프 미 대통령은 이란이 협상을 미루며 미국을 향해 더 공격적인 태도를 취하고 있다고 비판했습니다.", "합의 불발 시 새해 이후 추가 군사 공격 가능성을 언급하며 이란의 핵무기 보유를 절대 용납하지 않겠다고 밝혔습니다.", "카타르 대표단이 테헤란을 방문해 이란 측과 대화를 나누는 등 중재 노력이 계속되고 있습니다."], "kw": ["트럼프", "이란", "군사 공격 경고", "중재 협상"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008858048&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008858033&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "국제", "h": "미 재무 \"엔비디아 칩 유출, 규정 준수 검증해야\"", "s": "스콧 베선트 미 재무장관은 엔비디아 칩의 중국 밀반입 의혹과 관련해 핵심은 회사의 규정 준수 체계라며 젠슨 황 전 CEO의 개인사와는 구분해야 한다고 밝혔습니다. 앨리스 황이 임원으로 있던 메가스피드와 캄보디아 범죄조직이 칩의 중국 유입 과정에 관여했다는 의혹이 제기되고 있습니다.", "pts": ["미 재무장관은 엔비디아의 수출 통제 지침 준수 여부와 내부 책임 소재를 명확히 가려야 한다고 강조했습니다.", "메가스피드사가 엔비디아 칩이 들어간 장비를 대량 구매해 동남아를 거쳐 중국 암시장으로 유출했다는 보도가 나왔습니다.", "엔비디아는 해당 업체와의 거래를 차단했다고 밝혔으나 미 정부는 제출받은 자료를 바탕으로 위반 여부를 조사할 방침입니다."], "kw": ["엔비디아", "수출 통제", "중국 밀반입", "스콧 베선트"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008857998&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008858032&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "한국전력, 고객·직원 개인정보 150만 건 유출", "s": "한국전력의 '한전ON'과 전자조달시스템이 해킹당해 고객과 직원, 기업 대표자 등 150만 건의 개인정보가 유출되었습니다. 유출 항목에 카드사와 카드번호까지 포함되어 있어 신용카드를 사칭한 2차 맞춤형 피싱 피해가 우려됩니다.", "pts": ["한전ON에서 고객 65만 명의 카드번호, 계좌번호 등 12개 항목의 개인정보가 유출되었습니다.", "전자조달시스템을 통해 기업 대표자 42만 명과 한전 직원 44만 명의 정보도 함께 털린 것으로 확인됐습니다.", "한전은 외부 접속을 차단하고 금융 당국과 모니터링을 강화하기로 했으나 보안 체계 부실에 대한 비판이 커지고 있습니다."], "kw": ["한국전력", "개인정보 유출", "해킹", "2차 피해"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008858035&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "태안 실종 해광호, 닷새 만에 침몰 상태로 발견", "s": "충남 태안 해역에서 승선원 7명과 함께 실종되었던 어선 해광호가 수색 닷새 만에 수심 53m 해저에서 침몰된 채 발견되었습니다. 해경과 해군은 수중무인드론으로 선체를 확인한 뒤 잠수구조대원을 투입해 실종된 선원 7명에 대한 수중 수색에 집중하고 있습니다.", "pts": ["지난 18일 실종 신고가 접수된 해광호가 태안 인근 수심 53m 해저에서 침몰 선체로 확인됐습니다.", "해군 함정의 수중무인드론으로 선체를 확인한 후 잠수구조대원 8명이 수중 수색에 투입됐습니다.", "기상 악화가 예보됨에 따라 해경은 대원들의 안전을 확보하면서 신속한 구조 수색 작업을 진행 중입니다."], "kw": ["해광호", "태안 어선 침몰", "실종자 수색", "해양경찰"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008858036&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "국제", "h": "WSJ \"북, 영변 시설에 원심분리기 추가 가능성\"", "s": "북한이 영변 핵 단지의 우라늄 농축 시설에 새로운 건물을 증축한 모습이 위성사진에 포착되었습니다. 현지 전문가들은 원심분리기가 추가로 설치될 경우 북한의 고농축 우라늄 연간 생산량이 35kg 이상 늘어날 수 있다고 분석했습니다.", "pts": ["월스트리트저널은 이달 촬영된 위성사진 분석을 통해 영변 농축 시설에 증축 건물이 연결된 것을 확인했습니다.", "해당 시설이 원심분리기 추가 설치용일 경우 고농축 우라늄 생산량이 연간 35kg 이상 증가할 가능성이 있습니다.", "다만 건물 위치에 따라 원심분리기 설치 외에 장비 보관 등 다른 용도로 쓰일 가능성도 함께 제기됐습니다."], "kw": ["북한 영변 핵시설", "우라늄 농축", "원심분리기", "위성사진 분석"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008858049&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "국제", "h": "리비아 정박 러시아 군함, 드론 공격받아 파손", "s": "리비아 벵가지 해군기지에 정박해 있던 러시아 해군 초계함 메르쿠리호가 드론 공격을 받아 크게 부서졌습니다. 리비아 동부 정부 측은 우크라이나군 기지에서 발사된 해상 드론의 공격이라고 주장했으며, 이번 사건을 주권 침해로 규정했습니다.", "pts": ["리비아 벵가지 기지의 러시아 초계함이 해상 드론 공격을 받아 선체가 크게 파손되고 불이 났습니다.", "리비아 측은 서부의 우크라이나군 기지에서 발사된 드론 중 일부가 명중했다고 주장했습니다.", "최근 발트해에서도 러시아 화물선이 공격받는 등 러시아 선박을 겨냥한 드론 드론 공습이 잇따르고 있습니다."], "kw": ["러시아 군함 피격", "리비아 벵가지", "우크라이나 드론", "메르쿠리호"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008858023&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "국제", "h": "유엔기후총회, '화석연료' 대립으로 17년 만에 합의 실패", "s": "튀르키예에서 열린 제31차 유엔 기후변화협약 당사국총회가 최종 합의문을 채택하지 못하고 막을 내렸습니다. 결의문 초안에서 화석연료 퇴출 표현이 빠지자 유럽연합 등이 반대하면서, 기후총회는 17년 만에 합의문 채택에 실패했습니다.", "pts": ["제31차 유엔기후변화협약 당사국총회가 명시적 반대 국가가 발생하여 최종 합의문 채택에 실패했습니다.", "화석연료 퇴출 관련 문구가 초안에서 제외된 것에 대해 유럽연합과 파나마 등이 강하게 반대했습니다.", "기후총회에서 당사국 간의 대립으로 합의문 채택이 무산된 것은 17년 만의 일입니다."], "kw": ["유엔기후총회", "합의 실패", "화석연료 퇴출", "COP31"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008858034&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "대학별 논술 혼란 지속…입시제도 개혁 목소리", "s": "수시 논술 시험장에서 적발 사례가 나오는 등 대학마다 다른 보안 기준에 수험생 혼란이 이어지고 있습니다. 최신 AI가 수능 문제를 순식간에 풀어 만점을 받는 상황이 확인되면서, 주관식·논술형 평가 확대 등 입시제도의 근본적 변화가 필요하다는 지적이 나옵니다.", "pts": ["성균관대 논술 고사장에서 전자기기 제출 지침을 어긴 수험생의 태블릿PC 알람이 울려 적발되는 등 현장 보안 혼란이 발생했습니다.", "오픈AI 챗GPT 최신 모델이 수능 전 과목을 10분 만에 풀고 만점을 기록하는 등 AI 기술 발전에 따른 시험 실효성 의문이 제기됐습니다.", "교육계 원로들은 암기식 객관식 수능에서 벗어나 논술형 평가 및 토론 중심 교육으로의 근본적 전환을 촉구했습니다."], "kw": ["대학 논술", "AI 부정행위", "수능 개혁", "논술형 평가"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008858037&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008858045&plink=RSSLINK&cooper=RSSREADER"}]}], "ok": true}];

$("date").textContent=d.getFullYear()+"년 "+(d.getMonth()+1)+"월 "+d.getDate()+"일 "+w[d.getDay()]+"요일";
try{var r=localStorage.getItem("rate");if(r)$("rate").value=r}catch(e){}
function wicon(n){var t=n.h||"";return /비|소나기|이슬비/.test(t)?"🌧️":/눈/.test(t)?"🌨️":/흐림/.test(t)?"☁️":/구름/.test(t)?"⛅":/맑/.test(t)?"☀️":"🌤️"}
function talk(on){document.body.classList.toggle("talk",!!on)}

function render(){
  var base=tab==0?y:d,items=DATA[tab].items,k=0;
  document.body.dataset.tab=tab==0?"e":"m";
  $("hi").textContent=tab==0?"오늘도 수고했어요!":"좋은 아침이에요!";
  $("t0").setAttribute("aria-selected",tab==0);$("t1").setAttribute("aria-selected",tab==1);
  $("tl").textContent=(base.getMonth()+1)+"월 "+base.getDate()+"일 · "+DATA[tab].label;
  if(!items.length){$("list").innerHTML='<div class="empty">아직 모인 기사가 없어요 🥲<br>기사가 쌓이면 뉴콩이가 가져올게요!</div>';return}
  $("list").innerHTML=items.map(function(n,i){
    var wx=n.c==="날씨",num=wx?wicon(n):(++k);
    var lk=(n.links&&n.links.length)?'<h3>원문 보기</h3><div class="lk">'+n.links.map(function(l){return'<a href="'+esc(l.u)+'" target="_blank" rel="noopener noreferrer">'+esc(l.s)+' ↗</a>'}).join("")+'</div>':"";
    return '<div class="row'+(wx?' wx':'')+'" id="c'+i+'" style="--c:'+(CC[n.c]||"#5b6cff")+'"><div class="head"><div class="no">'+num+'</div>'+
    '<button class="tg" data-i="'+i+'" aria-expanded="false"><span class="cat">'+esc(n.c)+'<span class="eq"><i></i><i></i><i></i></span></span><h2>'+esc(n.h)+'</h2><p>'+esc(n.s)+'</p><span class="more">자세히 보기</span></button>'+
    (TTS?'<button class="spk" data-s="'+i+'" aria-label="이 기사 듣기">🔊</button>':'<span></span>')+'</div>'+
    '<div class="detail"><div><h3>핵심 포인트</h3><ul>'+(n.pts||[]).map(function(p){return'<li>'+esc(p)+'</li>'}).join("")+'</ul><h3>키워드</h3><div class="kw">'+(n.kw||[]).map(function(x){return'<span>#'+esc(x)+'</span>'}).join("")+'</div><h3>출처</h3><div class="src">'+esc(n.src)+'</div>'+lk+'</div></div></div>';
  }).join("");
}

/* ---- 듣기: 문장 단위로 끊어 읽기(안드로이드 크롬/삼성 인터넷 호환) ---- */
function text(n){return n.c+" 소식입니다. "+n.h+". "+n.s+" "+(n.pts||[]).join(". ")}
function chunks(s){return (s.match(/[^.!?。]+[.!?。]*\s*/g)||[s]).map(function(x){return x.trim()}).filter(Boolean)}
function mark(i){[].forEach.call(document.querySelectorAll(".row"),function(c,k){c.classList.toggle("playing",k===i)})}
function lock(){try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(function(l){wl=l}).catch(function(){})}catch(e){}}
function unlock(){try{if(wl){wl.release();wl=null}}catch(e){}}
function loadCard(k){
  if(k>=queue.length){stop();return false}
  var n=DATA[tab].items[queue[k]];
  qi=k;ci=0;CH=chunks(text(n));mark(queue[k]);talk(true);
  $("np").textContent=(queue.length>1?(k+1)+"/"+queue.length+" · ":"")+n.h;
  var el=$("c"+queue[k]);if(el&&el.scrollIntoView)el.scrollIntoView({block:"center",behavior:"smooth"});
  return true;
}
function say(){
  if(paused||qi<0)return;
  if(ci>=CH.length){if(loadCard(qi+1))say();return}
  var my=++tok;
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(CH[ci]);
  u.lang="ko-KR";u.rate=parseFloat($("rate").value);
  var v=speechSynthesis.getVoices().filter(function(x){return x.lang&&x.lang.replace("_","-").toLowerCase().indexOf("ko")==0})[0];
  if(v)u.voice=v;
  u.onend=function(){if(my===tok&&!paused){ci++;say()}};
  u.onerror=function(){if(my===tok&&!paused){ci++;say()}};
  speechSynthesis.speak(u);
}
function start(list){stop();if(!TTS||!list.length)return;queue=list;lock();if(loadCard(0))say()}
function stop(){tok++;paused=false;qi=-1;queue=[];CH=[];if(TTS)speechSynthesis.cancel();mark(-1);talk(false);unlock();$("pp").textContent="⏸";$("np").textContent=NP0}
$("list").addEventListener("click",function(e){
  var s=e.target.closest("[data-s]");
  if(s){start([+s.dataset.s]);return}
  var t=e.target.closest(".tg");
  if(t){var c=$("c"+t.dataset.i);var o=c.classList.toggle("open");t.setAttribute("aria-expanded",o)}
});
$("t0").onclick=function(){stop();tab=0;render()};
$("t1").onclick=function(){stop();tab=1;render()};
$("all").onclick=function(){start(DATA[tab].items.map(function(_,i){return i}))};
$("pp").onclick=function(){
  if(!TTS||qi<0)return;
  if(paused){paused=false;$("pp").textContent="⏸";talk(true);say()}
  else{paused=true;tok++;speechSynthesis.cancel();talk(false);$("pp").textContent="▶"}
};
$("stop").onclick=stop;
$("rate").onchange=function(){try{localStorage.setItem("rate",$("rate").value)}catch(e){}};
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&qi>=0&&!paused)lock()});
if(!TTS)document.querySelector(".bar").style.display="none";
$("np").textContent=NP0;
render();
</script>
</body>
</html>
