<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뉴콩이의 출근길 뉴스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6f0;--card:#fff;--ink:#4a3a3a;--sub:#8a7468;--bd:#f0dcc6;--accent:#ff6f91;--onacc:#fff;--tint:#e3f3ff;--tbd:#bfe0f7;
--skyM:linear-gradient(170deg,#ffe3b3,#ffc2d4 55%,#b9ddff);--onM:#4a3a3a;
--skyE:linear-gradient(170deg,#5b4aa8,#8f5db8 60%,#c26aa9);--onE:#fff;
--disp:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
--sans:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1830;--card:#2b2344;--ink:#fff1e6;--sub:#c4b6d9;--bd:#40355f;--accent:#ff8fab;--onacc:#2a1730;--tint:#1f3350;--tbd:#2f4d75;
--skyM:linear-gradient(170deg,#5a4263,#8a5566 55%,#3b5c8f);--onM:#fff;--skyE:linear-gradient(170deg,#171236,#2d2160 55%,#5a3070);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1e1830;--card:#2b2344;--ink:#fff1e6;--sub:#c4b6d9;--bd:#40355f;--accent:#ff8fab;--onacc:#2a1730;--tint:#1f3350;--tbd:#2f4d75;
--skyM:linear-gradient(170deg,#5a4263,#8a5566 55%,#3b5c8f);--onM:#fff;--skyE:linear-gradient(170deg,#171236,#2d2160 55%,#5a3070);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;word-break:keep-all;overflow-wrap:break-word}
body[data-tab="m"]{--sky:var(--skyM);--on:var(--onM)}
body[data-tab="e"]{--sky:var(--skyE);--on:var(--onE)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
body[data-tab="m"] .e-only,body[data-tab="e"] .m-only{display:none}

/* 하늘 + 뉴콩이 */
.sky{position:relative;overflow:hidden;background:var(--sky);color:var(--on);border-radius:0 0 34px 34px;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 20px;transition:background .4s}
.sky-in{position:relative;max-width:640px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-family:var(--disp);font-weight:400;font-size:29px;line-height:1.25;margin:0}
.date{margin:4px 0 0;font-size:14px;opacity:.85}
.hi{font-family:var(--disp);font-size:16px;margin-top:2px}
.orb{position:absolute;right:120px;top:2px;width:40px;height:40px;border-radius:50%}
body[data-tab="m"] .orb{background:radial-gradient(circle at 40% 40%,#fffbe0,#ffd566 65%);box-shadow:0 0 20px 6px rgba(255,214,102,.6)}
body[data-tab="e"] .orb{background:#fff7d6;box-shadow:inset -9px -3px 0 0 rgba(140,110,190,.55),0 0 18px 3px rgba(255,255,255,.3)}
.deco{position:absolute;font-size:20px;pointer-events:none}
.d1{right:36%;top:46px}.d2{right:10px;top:4px;font-size:15px}.d3{left:52%;top:8px;font-size:14px}
.mascot-wrap{position:relative;flex:none;width:100px}
.mascot{display:block;width:100px;height:100px;overflow:visible}
.mascot *{transform-box:fill-box}
.eyes-shut,.mouth-talk{display:none}
body[data-tab="m"] .eyes-shut{display:none}
body[data-tab="e"]:not(.talk) .eyes-open{display:none}
body[data-tab="e"]:not(.talk) .eyes-shut{display:inline}
.wave{transform-origin:50% 85%;animation:wave 1.8s ease-in-out infinite}
body[data-tab="e"] .wave{animation:none}
.zz{font-family:var(--disp);font-size:15px;fill:#fff;animation:zz 2.4s ease-in-out infinite}
.talk .mouth{display:none}
.talk .mouth-talk{display:inline;transform-origin:center;animation:yap .32s ease-in-out infinite alternate}
.talk .bob{animation:bob .5s ease-in-out infinite alternate}
.note{position:absolute;font-size:18px;opacity:0;color:var(--on)}
.n1{left:-4px;top:6px}.n2{right:-2px;top:-4px}
.talk .note{animation:note 1.5s ease-out infinite}
.talk .n2{animation-delay:.7s}
@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(22deg)}}
@keyframes yap{from{transform:scaleY(.35)}to{transform:scaleY(1.25)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes zz{0%,100%{opacity:.4;transform:translateY(2px)}50%{opacity:1;transform:translateY(-3px)}}
@keyframes note{0%{opacity:0;transform:translateY(8px)}30%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
.notice{display:inline-block;margin:10px 0 14px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.35);font-size:12.5px}
.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.3);max-width:340px}
.tab{flex:1;padding:9px 0;border:0;border-radius:999px;background:transparent;font-family:var(--disp);font-size:16px;color:var(--on)}
.tab[aria-selected="true"]{background:#fff;color:#4a3a3a;box-shadow:0 2px 0 rgba(0,0,0,.12)}

main{max-width:640px;margin:0 auto;padding:18px 16px 160px}
.tl{font-size:13px;color:var(--sub);margin:0 0 12px 4px}
.empty{color:var(--sub);font-size:15px;padding:36px 0;text-align:center}

/* 말랑한 기사 카드: 번호 = 전체 듣기 재생 순서 */
.row{--bd2:var(--bd);background:var(--card);border:2px solid var(--bd);border-radius:24px;margin-bottom:14px;box-shadow:0 4px 0 var(--bd);transition:border-color .2s,box-shadow .2s}
@supports (color:color-mix(in srgb,red,blue)){.row{--bd2:color-mix(in srgb,var(--c) 35%,var(--bg));border-color:var(--bd2);box-shadow:0 4px 0 var(--bd2)}}
.row.playing{border-color:var(--c);box-shadow:0 4px 0 var(--c)}
.head{display:grid;grid-template-columns:38px 1fr 44px;gap:10px;padding:14px}
.no{width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;font-family:var(--disp);font-size:19px;display:grid;place-items:center}
.playing .no{animation:hop .6s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-4px)}}
.tg{text-align:left;background:none;border:0;padding:0;min-width:0}
.cat{display:inline-flex;align-items:center;gap:6px;font-family:var(--disp);font-size:13px;color:var(--c);padding:1px 10px;border-radius:999px;border:1.5px solid var(--c)}
.tg h2{font-family:var(--disp);font-weight:400;font-size:18px;line-height:1.45;margin:6px 0 6px}
.tg p{margin:0;color:var(--sub);font-size:14.5px}
.more{display:inline-block;margin-top:8px;font-family:var(--disp);font-size:13px;color:var(--accent)}
.more::after{content:" ▾"}
.open .more::after{content:" ▴"}
.spk{width:44px;height:44px;border-radius:50%;border:2px solid var(--bd);background:var(--bg);font-size:18px;transition:background .2s}
.playing .spk{background:var(--c);border-color:var(--c)}
.eq{display:none;gap:2px;align-items:flex-end;height:11px}
.playing .eq{display:inline-flex}
.eq i{width:3px;background:var(--c);border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.25s}.eq i:nth-child(3){animation-delay:.5s}
@keyframes eq{0%,100%{height:3px}50%{height:11px}}

.detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease;margin:0 14px 0 62px;font-size:14px}
.open .detail{grid-template-rows:1fr}
.detail>div{overflow:hidden}
.open .detail>div{padding-bottom:16px}
.detail h3{font-family:var(--disp);font-weight:400;font-size:13px;color:var(--sub);margin:12px 0 4px}
.detail ul{margin:0;padding-left:18px}
.detail li{margin-bottom:3px}
.kw span{display:inline-block;font-size:12.5px;background:var(--bg);border-radius:999px;padding:0 10px;margin:0 4px 4px 0;color:var(--sub)}
.src{font-size:12.5px;color:var(--sub)}
.lk a{display:inline-block;font-size:13px;color:var(--accent);margin-right:14px}

/* 날씨 */
.wx{background:var(--tint);border-color:var(--tbd);box-shadow:0 4px 0 var(--tbd)}
.wx .no{background:var(--card);font-size:22px;color:inherit}

/* 플레이어 */
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:616px;margin:0 auto;background:var(--card);border:2px solid var(--bd);border-radius:26px;padding:10px 12px;box-shadow:0 4px 0 var(--bd),0 12px 24px rgba(60,30,40,.15);z-index:5}
.np{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px 8px}
.ctl{display:flex;gap:8px;align-items:center}
.ctl button,.ctl select{height:44px;border:2px solid var(--bd);background:var(--bg);color:var(--ink);border-radius:16px;font-family:var(--disp);font-size:16px;padding:0 14px}
.ctl .main{flex:1;background:var(--accent);border-color:var(--accent);color:var(--onacc)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

var DATA=[{"label": "전날 18:00–24:00 기사 기준", "items": [{"c": "사회", "h": "수능 종료에도 AI 부정행위 철저 추적", "s": "정부는 수능 종료 이후에도 글로벌 AI 기업들과 협력해 시험 시간대 AI 활용 기록과 통신 기록 등을 분석할 방침입니다. 이재명 대통령은 부정행위 의심 사례를 철저히 조사하고 향후 국가자격시험 관련 자료 제출 의무를 법제화하라고 주문했습니다. 한편 최근 부정행위 의혹을 받던 법학적성시험 만점자가 사망하면서 진실 규명에 어려움이 예상됩니다.", "pts": ["정부는 글로벌 AI 기업 이용 기록과 와이파이·블루투스 신호를 분석해 부정행위 수사를 진행할 계획입니다.", "이재명 대통령은 수석보좌관회의에서 시험 공정성을 강조하며 빅테크 기업의 자료 제출 의무 법제화를 지시했습니다.", "해외 기업의 자료 제공 협조 여부와 제3자 계정 이용 가능성 등으로 부정행위자 특정이 쉽지 않을 것이라는 지적도 나옵니다."], "kw": ["수능 부정행위", "AI 이용 기록", "이재명 대통령", "리트 만점자"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008856348&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008856406&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008856371&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "ICJ, 미얀마 로힝야족 집단학살 인정", "s": "국제사법재판소(ICJ)가 2017년 미얀마가 로힝야족을 상대로 자행한 행위를 집단학살로 인정하고 국가 책임을 판단했습니다. 유엔 최고 사법기관이 특정 국가의 집단학살 책임을 판결한 것은 80년 역사상 처음입니다. 이에 대해 로힝야족은 크게 환호한 반면, 미얀마 정부는 불공정하다며 강력히 반발했습니다.", "pts": ["ICJ 80년 역사상 최초로 특정 국가가 집단학살을 직접 저질렀다는 판결이 내렸습니다.", "판결문은 당시 군 최고사령관이었던 민 아웅 흘라잉 미얀마 대통령을 주요 책임자로 지목해 국제적 압박이 커지고 있습니다.", "미얀마 정부는 만장일치 결정이 아니라는 점을 들며 부당하다고 반발한 반면 말레이시아 등은 난민 이주 대책을 추진 중입니다."], "kw": ["국제사법재판소", "미얀마", "로힝야족", "집단학살"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008856134&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008856415&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008856482&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "컬리 큐레이터 1만여 명 개인정보 유출", "s": "리테일 테크 기업 컬리에서 큐레이터 1만 699명의 개인정보가 유출되는 사고가 발생했습니다. 김슬아 대표는 외부 공격자의 인증정보 탈취로 인한 사고임을 밝히며 관계기관에 신고 조치했다고 전했습니다. 컬리는 피해 범위에 따라 보상안을 안내하고 피해 발생 시 전액 보상할 방침입니다.", "pts": ["외부 공격자의 시스템 무단 접근으로 큐레이터 1만 699명과 일반 고객 2명의 회원 정보가 유출됐습니다.", "유출 항목은 이름과 전화번호부터 일부 주민등록번호, 계좌번호 등 핵심 개인정보까지 포함됐습니다.", "컬리 측은 사과문 발표와 함께 최소 5만 원에서 최대 15만 원의 보상안을 마련하고 전담 센터를 운영하고 있습니다."], "kw": ["컬리", "개인정보 유출", "큐레이터", "김슬아"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008856326&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "경제", "h": "코스피 5% 급락 및 앤트로픽 상장", "s": "미국의 대중국 반도체 규제 강화 우려 속에 국내 증시가 5% 넘게 급락하며 매도 사이드카가 발동됐습니다. 인공지능 기업 앤트로픽이 사상 최대 규모로 나스닥에 상장 성공했으나 국내 투자 심리는 냉각되었습니다. 국내 주식 시장 하락과 더불어 AI 산업을 둘러싼 거품 우려도 지속되고 있습니다.", "pts": ["미국의 대중 반도체 규제 강화 우려로 삼성전자와 SK하이닉스 등 주요 대장주가 급락했습니다.", "AI 클로드를 개발한 앤트로픽은 143조 원 규모의 대형 나스닥 상장을 기록했으나 AI 관련주 거품 우려는 상존합니다.", "올 하반기 국내 가계의 주식 손실액이 약 563조 원으로 추산되는 등 투자자들의 불안이 고조되고 있습니다."], "kw": ["코스피 급락", "반도체 규제", "앤트로픽", "매도 사이드카"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008856378&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008856377&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "정치", "h": "민주당, 조희대 대법원장 탄핵 추진", "s": "더불어민주당이 조희대 대법원장에 대한 탄핵을 당론으로 채택하고 속전속결 절차에 돌입했습니다. 국민의힘은 판결 결과에 대한 복수라며 강력히 비판하고 나섰습니다. 민주당은 대법관 재제청 논란 등을 이유로 들었으나 당내 불만 수습과 정치적 고려가 반영되었다는 해석도 나옵니다.", "pts": ["민주당은 이재명 대통령 사건 파기환송 및 대법관 재제청 논란 등 5가지 사유로 대법원장 탄핵을 추진합니다.", "국민의힘은 재판 결과에 불복한 광기 어린 탄핵 추진이라며 반발했습니다.", "탄핵 추진 배경에는 당내 분위기를 다잡고 헌재 판결 시점 등을 감안한 정치적 셈법이 작용한 것으로 분석됩니다."], "kw": ["조희대", "대법원장 탄핵", "더불어민주당", "국민의힘"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008856405&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008856386&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "날씨", "h": "주말 서울 아침 -5도 강추위 지속", "s": "전국 곳곳에 강한 바람과 함께 추위가 찾아오면서 주말 내내 영하권 날씨가 이어지겠습니다. 서울의 내일 아침 기온은 영하 5도까지 떨어지겠으며, 낮 기온도 크게 오르지 못하겠습니다. 제주도와 호남 서부 등 일부 지역에는 눈이나 비가 예보되어 있어 건강관리에 주의가 필요합니다.", "pts": ["북쪽에서 남하한 찬 공기의 영향으로 전국 대부분 내륙의 아침 기온이 영하권으로 급강하합니다.", "서울은 내일 아침 영하 5도, 낮 기온 2도에 머무르는 등 강풍을 동반한 강추위가 지속됩니다.", "제주와 호남 서해안 지역에는 주말 동안 비나 1cm 미만의 추가 적설이 예보되어 있습니다."], "kw": ["주말 날씨", "영하권 강추위", "기온 급강하", "적설"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008856380&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "국제", "h": "러, 키이우 교량에 역대 최대 공습", "s": "블라디미르 푸틴 러시아 대통령이 미·중·러 정상회담 직후 우크라이나 수도 키이우의 주요 교량을 공격했습니다. 이번 공격은 크림대교 타격에 대한 보복 조치로, 개전 이후 최대 규모의 교통로 공격으로 평가됩니다. 한편 러시아는 우크라이나의 나토 가입은 절대 수용할 수 없다는 입장을 재확인했습니다.", "pts": ["러시아군이 미사일과 드론으로 키이우 드니프로강 교량 3곳을 타격해 민간인 인명 피해가 발생했습니다.", "우크라이나의 크림대교 공격에 대한 보복 조치로 400대 이상의 드론과 110발 이상의 미사일이 동원됐습니다.", "러시아 외무차관은 우크라이나의 나토 및 EU 가입안을 절대 수용할 수 없다는 기존 입장을 고수했습니다."], "kw": ["러시아 공습", "키이우 교량", "푸틴", "크림대교 보복"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008856361&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008856507&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "경제", "h": "사상 첫 수출 1조 달러 달성 견인", "s": "우리나라가 반도체뿐만 아니라 K-뷰티와 K-푸드의 선전으로 사상 첫 '수출 1조 달러'를 달성했습니다. 화장품과 라면 수출이 가파른 성장세를 보이며 지난해 실적을 조기 달성하는 성과를 냈습니다. 김정관 산업통상부 장관은 국민에게 감사를 표하며 수출 성과가 내수와 소상공인에게 퍼지도록 노력하겠다고 밝혔습니다.", "pts": ["화장품(125억 달러)과 라면(15.8억 달러) 수출이 크게 늘며 수출 1조 달러 달성에 크게 기여했습니다.", "반도체 외에도 무기, 바이오 등의 선전으로 전체 수출은 전년 대비 20% 늘어났습니다.", "전통 주력 산업 부진과 내수 침체 해소를 위해 정부는 미래 대응 기금 마련 등 정책적 노력을 이어갈 계획입니다."], "kw": ["수출 1조 달러", "K-뷰티", "K-푸드", "산업통상부"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008856384&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008856385&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "홈플러스 8월 급여 완납…체불 지속", "s": "홈플러스가 지연되었던 8월분 임금의 남은 25%를 지급 완료했습니다. 그러나 경영난으로 인해 9월부터 11월까지의 급여와 추석 상여금은 여전히 체불된 상태입니다. 마트노조는 국회 및 정부와 협의하여 홈플러스 정상화 대책 마련을 강력히 요구할 예정입니다.", "pts": ["홈플러스는 4차례에 나누어 분할 지급한 끝에 8월분 급여 지급을 마쳤습니다.", "하지만 경영 악화로 9~11월 급여와 추석 상여금이 3개월가량 연체되어 노동자들의 어려움이 가중되고 있습니다.", "노조는 정치권과 면담을 통해 정부 차원의 정상화 대책 마련을 촉구할 계획입니다."], "kw": ["홈플러스", "임금 체불", "8월 급여", "마트노조"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008856355&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "지하철 2호선 성수지선 운행 재개", "s": "신호 위반 열차로 인한 선로 전환기 파손으로 차질을 빚었던 지하철 2호선 성수지선 운행이 정상화됐습니다. 오늘 새벽 5시 반부터 양방향 운행이 멈추면서 출근길 시민들이 큰 불편을 겪었습니다. 약 3시간 만인 오전 8시 40분쯤 복구가 완료되어 열차 운행이 재개됐습니다.", "pts": ["정지 신호를 위반한 열차로 인해 선로 전환기가 파손되면서 새벽 운행이 중단됐습니다.", "성수지선 양방향 중단 및 1호선 일부 지연으로 출근길 시민들의 교통 불편이 발생했습니다.", "긴급 복구 작업 끝에 중단 3시간 만인 8시 40분부터 운행이 완전 재개됐습니다."], "kw": ["지하철 2호선", "성수지선", "운행 중단", "출근길 불편"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008856391&plink=RSSLINK&cooper=RSSREADER"}]}], "ok": true, "built": "2026-11-21"}, {"label": "당일 00:00–07:00 기사 기준", "items": [{"c": "날씨", "h": "오늘 경기 광주 날씨 맑음, 최저 -6도 최고 1도", "s": "오늘 경기 광주은 맑음, 최저 -6도 최고 1도입니다. 출근 시간대인 오전 8시에는 -5도입니다. 강수 확률은 최대 0퍼센트로, 우산은 필요 없겠습니다.", "pts": ["기온: 최저 -6도, 최고 1도 (오전 8시 -5도, 오후 6시 -2도)", "강수: 확률 최대 0퍼센트, 예상 강수량 0.0밀리미터", "바람: 최대 풍속 약 5미터", "미세먼지 좋음, 초미세먼지 보통 (Open-Meteo 모델 예측치, 낮 시간 최대 기준)"], "kw": ["경기 광주", "맑음", "날씨"], "src": "Open-Meteo 예측 모델(기상청 공식 예보와 다를 수 있음)", "date": "2026-11-21"}, {"c": "국제", "h": "트럼프 \"우크라 종전 1월 타결 원해\"…미중러 회담 언급", "s": "도널드 트럼프 미국 대통령이 내년 1월 초까지 우크라이나 종전 협상 타결을 바란다고 외신이 보도했습니다. 한편 트럼프 대통령은 최근 열린 미중러 정상회담에서 한반도 위험 대처와 핵 위험 감축 등을 논의했다고 밝혔습니다.", "pts": ["트럼프 행정부가 내년 1월 3일 이전 종전 협상 타결을 유럽과 우크라이나 측에 강하게 밀어붙이고 있습니다.", "유럽과 우크라이나 일각에서는 조속한 타결 추진으로 인해 우크라이나에 불리한 합의가 이뤄질 수 있다는 우려가 나옵니다.", "미중러 정상회담에서 3국 정상은 한반도 문제와 이란, 우크라이나 현안을 함께 논의했습니다.", "중국이 3자 핵 위험 감축 논의에 참여하기로 했으나 당장 구체적인 합의가 이뤄지기는 어려울 것으로 평가됩니다."], "kw": ["트럼프", "우크라이나 종전", "미중러 정상회담", "한반도"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008856558&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008856582&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "경제", "h": "미 재무 \"H200 중국 수출 허용 유지\"…AI주 폭락", "s": "스콧 베선트 미 재무장관은 엔비디아 H200의 중국 수출 허용 방침에 변화가 없으며 AI 원격 접속 통제를 강화하겠다고 밝혔습니다. 한편 미국 증시에서는 기준금리 인상 우려와 세금 규제 발언이 더해지며 반도체와 AI 관련주가 폭락했습니다.", "pts": ["미 정부는 해외 데이터센터를 통한 중국 기업의 AI 반도체 원격 접속을 승인제로 통제하기로 했습니다.", "미 재무부는 H200 반도체의 중국 판매 기준 등급 방침을 유지하며 추가 수출 정책 변화는 없을 것이라 말했습니다.", "연준 이사의 매파적 발언으로 금리 인상 확률이 98.2%까지 치솟으며 AI 업계에 재정적 부담을 가했습니다.", "트럼프 대통령이 해외 데이터센터 건설 시 고액 세금을 부과하겠다고 언급하여 시장의 불확실성을 높였습니다."], "kw": ["엔비디아", "AI 반도체", "증시 폭락", "금리 인상"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008856561&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008856581&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "오늘부터 대학별 고사 시작…교육장관 거취 논란", "s": "오늘부터 수능 후 대학별 논술과 면접시험이 본격적으로 시작되며 AI 부정행위 우려가 이어지고 있습니다. 한편 수능 부정행위 방지 대책 부실 논란을 빚은 최교진 교육부 장관은 사퇴 요구 시 물러나겠다는 입장을 밝혔습니다.", "pts": ["수능 부정행위 적발 이후 긴급 대응반이 운영되지만 수만 명의 수험생이 몰려 대학 자체 감독에 어려움이 예상됩니다.", "시험 직전 변경된 필기도구 등 검사 규정으로 인해 수험생과 학부모들의 혼란이 커졌습니다.", "최교진 장관은 AI 부정행위 완벽 차단 불가를 언급하는 등 무책임한 태도로 보수 야권과 여당 및 교육계의 비판을 받았습니다.", "교총 등 교육계는 장관의 자진 사퇴가 아닌 대통령의 직접 경질과 책임을 촉구하고 있습니다."], "kw": ["논술 면접", "수능 부정행위", "교육부 장관", "거취 논란"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008856526&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008856540&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "국제", "h": "트럼프 \"해외 데이터센터 건설 시 엄벌 세금\" 카드", "s": "도널드 트럼프 미국 대통령이 미국 기술 기업이 해외에 AI 데이터센터를 지을 경우 엄청난 세금을 물릴 것이라고 경고했습니다. 데이터센터 추진으로 인한 전기요금 인상 반대 여론에도 중국과의 AI 주도권 경쟁에서 뒤처지지 않겠다는 의지를 보였습니다.", "pts": ["미국 내 데이터센터 건설로 인한 전력 수요와 전기요금 상승이 중간선거 패배 원인 중 하나로 지적됐습니다.", "상원에서는 데이터센터가 자체 전력 비용을 직접 부담하게 하는 법안이 통과되었습니다.", "트럼프 대통령은 데이터센터를 해외에 지으면 중국이 이득을 본다며 국내 건설 추진을 강행하겠다는 취지를 밝혔습니다.", "기업들이 자체 전력을 생산해 전력 비용을 직접 부담하면 전기요금이 내려갈 것이라 주장했습니다."], "kw": ["트럼프", "데이터센터", "해외 건설 세금", "전력 수요"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008856563&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "경제", "h": "비트코인 6만 달러 붕괴…2022년 이후 최장 약세", "s": "가상화폐 비트코인 가격이 4개월 만에 6만 달러선 아래로 떨어지며 7주 연속 하락세를 기록했습니다. 연준의 금리 인상 우려와 현물 ETF 자금 유출, 위험자산 기피 현상이 복합적으로 영향을 미쳤습니다.", "pts": ["비트코인 현물 ETF에서 하루 동안 5억 8천만 달러 이상이 유출되며 기관 자금 이탈이 가속화되었습니다.", "연준의 금리 인상 우려와 앤트로픽 상장 직후 타 자산 매도 현상이 가상화폐 시장에 부정적 여파를 줬습니다.", "비트코인과 나스닥100 지수의 상관계수가 0.69까지 상승하며 안전자산이 아닌 위험자산임이 다시 확인되었습니다.", "바이낸스 해킹 사건 및 클래리티법 처리 무산 등의 이슈가 시장 불확실성을 더했습니다."], "kw": ["비트코인", "6만 달러 붕괴", "ETF 자금 유출", "위험자산"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008856564&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "국제", "h": "베선트 \"미중, AI 군사 결정에 인간 개입 합의\"", "s": "미국과 중국 정상이 슈퍼지능 AI를 활용한 주요 군사적 결정에 항상 인간이 개입해야 한다는 점에 합의했습니다. 스콧 베선트 미 재무장관은 이번 합의가 트럼프 대통령의 순방 중 주요 성과라고 밝혔습니다.", "pts": ["미중 양국은 주요 군사 작전 시 AI 기술이 자율적으로 판단 및 작동하지 못하도록 통제하기로 뜻을 모았습니다.", "이번 군사 분야 합의는 양국이 펼치고 있는 AI 기술 패권 경쟁과는 별개의 이슈로 다뤄졌습니다.", "미국은 중국의 위험한 AI 모델 대응을 위해 자국 AI 연구소들의 기술적 우위를 계속 유지할 방침입니다.", "베선트 장관은 연준의 50bp 금리 인상 주장에 대해 과거가 아닌 미래를 내다봐야 한다며 비판했습니다."], "kw": ["미중 정상회담", "AI 군사 통제", "인간 개입", "스콧 베선트"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008856559&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "'리트 만점자' 피의자 사망에도 경찰 수사 난항", "s": "법학적성시험 만점자로 AI 부정행위 의혹을 받다 숨진 이진우 씨에 대해 경찰이 수사를 이어가겠다고 밝혔습니다. 하지만 피의자 사망으로 영장 발부가 어려워 실체적 진실 규명에는 한계가 있을 것이란 전망입니다.", "pts": ["사건의 사회적 파장을 고려해 경찰은 피의자 사망에도 부정행위 및 공범 여부 규명 수사를 지속하기로 했습니다.", "피의자 사망으로 인해 휴대폰, 노트북 등 핵심 증거 확보를 위한 압수수색 영장 발부가 불가능해졌습니다.", "국과수 1차 부검 결과 타살 정황은 없는 것으로 조사됐습니다.", "고발인 측은 사적 범죄 이상의 의미가 있는 사건이라며 경찰의 철저한 진상 규명을 계속 요구하고 있습니다."], "kw": ["리트 만점자", "부정행위 수사", "공소권 없음", "압수수색 난항"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008856527&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "법원 \"쿠팡 대관 담당자 의원실 방문 내역 공개해야\"", "s": "지난해 개인정보 유출 사태 당시 쿠팡의 국회 로비 의혹과 관련해 법원이 국회의원실 방문 }

/* ---- 듣기: 문장 단위로 끊어 읽기(안드로이드 크롬/삼성 인터넷 호환) ---- */
function text(n){return n.c+" 소식입니다. "+n.h+". "+n.s+" "+(n.pts||[]).join(". ")}
function chunks(s){return (s.match(/[^.!?。]+[.!?。]*\s*/g)||[s]).map(function(x){return x.trim()}).filter(Boolean)}
function mark(i){[].forEach.call(document.querySelectorAll(".row"),function(c,k){c.classList.toggle("playing",k===i)})}
function lock(){try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(function(l){wl=l}).catch(function(){})}catch(e){}}
function unlock(){try{if(wl){wl.release();wl=null}}catch(e){}}
function loadCard(k){
  if(k>=queue.length){stop();return false}
  var n=DATA[tab].items[queue[k]];
  qi=k;ci=0;CH=chunks(text(n));mark(queue[k]);talk(true);
  $("np").textContent=(queue.length>1?(k+1)+"/"+queue.length+" · ":"")+n.h;
  var el=$("c"+queue[k]);if(el&&el.scrollIntoView)el.scrollIntoView({block:"center",behavior:"smooth"});
  return true;
}
function say(){
  if(paused||qi<0)return;
  if(ci>=CH.length){if(loadCard(qi+1))say();return}
  var my=++tok;
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(CH[ci]);
  u.lang="ko-KR";u.rate=parseFloat($("rate").value);
  var v=speechSynthesis.getVoices().filter(function(x){return x.lang&&x.lang.replace("_","-").toLowerCase().indexOf("ko")==0})[0];
  if(v)u.voice=v;
  u.onend=function(){if(my===tok&&!paused){ci++;say()}};
  u.onerror=function(){if(my===tok&&!paused){ci++;say()}};
  speechSynthesis.speak(u);
}
function start(list){stop();if(!TTS||!list.length)return;queue=list;lock();if(loadCard(0))say()}
function stop(){tok++;paused=false;qi=-1;queue=[];CH=[];if(TTS)speechSynthesis.cancel();mark(-1);talk(false);unlock();$("pp").textContent="⏸";$("np").textContent=NP0}
$("list").addEventListener("click",function(e){
  var s=e.target.closest("[data-s]");
  if(s){start([+s.dataset.s]);return}
  var t=e.target.closest(".tg");
  if(t){var c=$("c"+t.dataset.i);var o=c.classList.toggle("open");t.setAttribute("aria-expanded",o)}
});
$("t0").onclick=function(){stop();tab=0;render()};
$("t1").onclick=function(){stop();tab=1;render()};
$("all").onclick=function(){start(DATA[tab].items.map(function(_,i){return i}))};
$("pp").onclick=function(){
  if(!TTS||qi<0)return;
  if(paused){paused=false;$("pp").textContent="⏸";talk(true);say()}
  else{paused=true;tok++;speechSynthesis.cancel();talk(false);$("pp").textContent="▶"}
};
$("stop").onclick=stop;
$("rate").onchange=function(){try{localStorage.setItem("rate",$("rate").value)}catch(e){}};
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&qi>=0&&!paused)lock()});
if(!TTS)document.querySelector(".bar").style.display="none";
$("np").textContent=NP0;
render();
</script>
</body>
</html>
