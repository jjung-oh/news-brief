<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뉴콩이의 출근길 뉴스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6f0;--card:#fff;--ink:#4a3a3a;--sub:#8a7468;--bd:#f0dcc6;--accent:#ff6f91;--onacc:#fff;--tint:#e3f3ff;--tbd:#bfe0f7;
--skyM:linear-gradient(170deg,#ffe3b3,#ffc2d4 55%,#b9ddff);--onM:#4a3a3a;
--skyE:linear-gradient(170deg,#5b4aa8,#8f5db8 60%,#c26aa9);--onE:#fff;
--disp:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
--sans:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1830;--card:#2b2344;--ink:#fff1e6;--sub:#c4b6d9;--bd:#40355f;--accent:#ff8fab;--onacc:#2a1730;--tint:#1f3350;--tbd:#2f4d75;
--skyM:linear-gradient(170deg,#5a4263,#8a5566 55%,#3b5c8f);--onM:#fff;--skyE:linear-gradient(170deg,#171236,#2d2160 55%,#5a3070);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1e1830;--card:#2b2344;--ink:#fff1e6;--sub:#c4b6d9;--bd:#40355f;--accent:#ff8fab;--onacc:#2a1730;--tint:#1f3350;--tbd:#2f4d75;
--skyM:linear-gradient(170deg,#5a4263,#8a5566 55%,#3b5c8f);--onM:#fff;--skyE:linear-gradient(170deg,#171236,#2d2160 55%,#5a3070);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;word-break:keep-all;overflow-wrap:break-word}
body[data-tab="m"]{--sky:var(--skyM);--on:var(--onM)}
body[data-tab="e"]{--sky:var(--skyE);--on:var(--onE)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
body[data-tab="m"] .e-only,body[data-tab="e"] .m-only{display:none}

/* 하늘 + 뉴콩이 */
.sky{position:relative;overflow:hidden;background:var(--sky);color:var(--on);border-radius:0 0 34px 34px;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 20px;transition:background .4s}
.sky-in{position:relative;max-width:640px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-family:var(--disp);font-weight:400;font-size:29px;line-height:1.25;margin:0}
.date{margin:4px 0 0;font-size:14px;opacity:.85}
.hi{font-family:var(--disp);font-size:16px;margin-top:2px}
.orb{position:absolute;right:120px;top:2px;width:40px;height:40px;border-radius:50%}
body[data-tab="m"] .orb{background:radial-gradient(circle at 40% 40%,#fffbe0,#ffd566 65%);box-shadow:0 0 20px 6px rgba(255,214,102,.6)}
body[data-tab="e"] .orb{background:#fff7d6;box-shadow:inset -9px -3px 0 0 rgba(140,110,190,.55),0 0 18px 3px rgba(255,255,255,.3)}
.deco{position:absolute;font-size:20px;pointer-events:none}
.d1{right:36%;top:46px}.d2{right:10px;top:4px;font-size:15px}.d3{left:52%;top:8px;font-size:14px}
.mascot-wrap{position:relative;flex:none;width:100px}
.mascot{display:block;width:100px;height:100px;overflow:visible}
.mascot *{transform-box:fill-box}
.eyes-shut,.mouth-talk{display:none}
body[data-tab="m"] .eyes-shut{display:none}
body[data-tab="e"]:not(.talk) .eyes-open{display:none}
body[data-tab="e"]:not(.talk) .eyes-shut{display:inline}
.wave{transform-origin:50% 85%;animation:wave 1.8s ease-in-out infinite}
body[data-tab="e"] .wave{animation:none}
.zz{font-family:var(--disp);font-size:15px;fill:#fff;animation:zz 2.4s ease-in-out infinite}
.talk .mouth{display:none}
.talk .mouth-talk{display:inline;transform-origin:center;animation:yap .32s ease-in-out infinite alternate}
.talk .bob{animation:bob .5s ease-in-out infinite alternate}
.note{position:absolute;font-size:18px;opacity:0;color:var(--on)}
.n1{left:-4px;top:6px}.n2{right:-2px;top:-4px}
.talk .note{animation:note 1.5s ease-out infinite}
.talk .n2{animation-delay:.7s}
@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(22deg)}}
@keyframes yap{from{transform:scaleY(.35)}to{transform:scaleY(1.25)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes zz{0%,100%{opacity:.4;transform:translateY(2px)}50%{opacity:1;transform:translateY(-3px)}}
@keyframes note{0%{opacity:0;transform:translateY(8px)}30%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
.notice{display:inline-block;margin:10px 0 14px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.35);font-size:12.5px}
.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.3);max-width:340px}
.tab{flex:1;padding:9px 0;border:0;border-radius:999px;background:transparent;font-family:var(--disp);font-size:16px;color:var(--on)}
.tab[aria-selected="true"]{background:#fff;color:#4a3a3a;box-shadow:0 2px 0 rgba(0,0,0,.12)}

main{max-width:640px;margin:0 auto;padding:18px 16px 160px}
.tl{font-size:13px;color:var(--sub);margin:0 0 12px 4px}
.empty{color:var(--sub);font-size:15px;padding:36px 0;text-align:center}

/* 말랑한 기사 카드: 번호 = 전체 듣기 재생 순서 */
.row{--bd2:var(--bd);background:var(--card);border:2px solid var(--bd);border-radius:24px;margin-bottom:14px;box-shadow:0 4px 0 var(--bd);transition:border-color .2s,box-shadow .2s}
@supports (color:color-mix(in srgb,red,blue)){.row{--bd2:color-mix(in srgb,var(--c) 35%,var(--bg));border-color:var(--bd2);box-shadow:0 4px 0 var(--bd2)}}
.row.playing{border-color:var(--c);box-shadow:0 4px 0 var(--c)}
.head{display:grid;grid-template-columns:38px 1fr 44px;gap:10px;padding:14px}
.no{width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;font-family:var(--disp);font-size:19px;display:grid;place-items:center}
.playing .no{animation:hop .6s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-4px)}}
.tg{text-align:left;background:none;border:0;padding:0;min-width:0}
.cat{display:inline-flex;align-items:center;gap:6px;font-family:var(--disp);font-size:13px;color:var(--c);padding:1px 10px;border-radius:999px;border:1.5px solid var(--c)}
.tg h2{font-family:var(--disp);font-weight:400;font-size:18px;line-height:1.45;margin:6px 0 6px}
.tg p{margin:0;color:var(--sub);font-size:14.5px}
.more{display:inline-block;margin-top:8px;font-family:var(--disp);font-size:13px;color:var(--accent)}
.more::after{content:" ▾"}
.open .more::after{content:" ▴"}
.spk{width:44px;height:44px;border-radius:50%;border:2px solid var(--bd);background:var(--bg);font-size:18px;transition:background .2s}
.playing .spk{background:var(--c);border-color:var(--c)}
.eq{display:none;gap:2px;align-items:flex-end;height:11px}
.playing .eq{display:inline-flex}
.eq i{width:3px;background:var(--c);border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.25s}.eq i:nth-child(3){animation-delay:.5s}
@keyframes eq{0%,100%{height:3px}50%{height:11px}}

.detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease;margin:0 14px 0 62px;font-size:14px}
.open .detail{grid-template-rows:1fr}
.detail>div{overflow:hidden}
.open .detail>div{padding-bottom:16px}
.detail h3{font-family:var(--disp);font-weight:400;font-size:13px;color:var(--sub);margin:12px 0 4px}
.detail ul{margin:0;padding-left:18px}
.detail li{margin-bottom:3px}
.kw span{display:inline-block;font-size:12.5px;background:var(--bg);border-radius:999px;padding:0 10px;margin:0 4px 4px 0;color:var(--sub)}
.src{font-size:12.5px;color:var(--sub)}
.lk a{display:inline-block;font-size:13px;color:var(--accent);margin-right:14px}

/* 날씨 */
.wx{background:var(--tint);border-color:var(--tbd);box-shadow:0 4px 0 var(--tbd)}
.wx .no{background:var(--card);font-size:22px;color:inherit}

/* 플레이어 */
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:616px;margin:0 auto;background:var(--card);border:2px solid var(--bd);border-radius:26px;padding:10px 12px;box-shadow:0 4px 0 var(--bd),0 12px 24px rgba(60,30,40,.15);z-index:5}
.np{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px 8px}
.ctl{display:flex;gap:8px;align-items:center}
.ctl button,.ctl select{height:44px;border:2px solid var(--bd);background:var(--bg);color:var(--ink);border-radius:16px;font-family:var(--disp);font-size:16px;padding:0 14px}
.ctl .main{flex:1;background:var(--accent);border-color:var(--accent);color:var(--onacc)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

var DATA=[{"label": "전날 18:00–24:00 기사 기준", "items": [{"c": "사회", "h": "철도노조 준법투쟁 이틀째…전철 445대 지연", "s": "전국철도노동조합의 안전운행 투쟁 이틀째를 맞아 수도권 광역전철 445대가 20분 이상 지연됐습니다. 호남선 무궁화호 2대의 운행이 중지되는 등 시민과 주말 이용객, 수험생들의 불편이 예상됩니다. 이번 투쟁은 다음 달 4일까지 이어질 예정입니다.", "pts": ["전국철도노동조합의 안전운행 투쟁 2일 차에 수도권 광역전철 445대가 20분 이상 지연되었습니다.", "차량 출고 지연으로 호남선 무궁화호 2대의 운행이 중지됐으며 승차권은 전액 반환 조치되었습니다.", "주말 이용객과 이동이 필요한 대입 수험생의 불편이 예상되며 투쟁은 12월 4일까지 예정되어 있습니다."], "kw": ["철도노조", "준법투쟁", "열차지연", "한국철도공사"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008867268&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "경제", "h": "김범수 'SM 시세조종 혐의' 무죄 확정", "s": "에스엠엔터테인먼트 시세조종 혐의로 재판에 넘겨진 김범수 카카오 창업자가 무죄를 확정받았습니다. 서울남부공소청이 상고 시한까지 상고하지 않기로 결정하면서 2심 무죄 판결이 그대로 유지됐습니다. 2심 재판부는 통상적인 장내 매수를 인위적 조작으로 보기 어렵다고 판단했습니다.", "pts": ["서울남부공소청이 상고를 포기하면서 김범수 센터장의 자본시장법 위반 혐의 무죄가 확정되었습니다.", "김 센터장은 2023년 SM엔터 인수 과정에서 하이브의 공개매수를 방해하려 시세를 조종한 혐의를 받았습니다.", "재판부는 장내 매수를 통한 우호지분 확보는 일반적 경영권 방어이며 인위적 시세조종 목적이 증명되지 않았다고 보았습니다."], "kw": ["김범수", "SM엔터테인먼트", "시세조종", "무죄확정"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008867243&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008867314&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "정치", "h": "최민희 '당원권 2년 정지' 중징계…재심 신청", "s": "더불어민주당 윤리심판원이 발언 논란을 빚은 최민희 최고위원에게 당원 자격정지 2년의 중징계를 내렸습니다. 징계가 확정되면 최고위원직이 박탈되고 2028년 총선 출마도 불가능해집니다. 최 최고위원은 수용할 수 없다며 재심을 신청하겠다고 밝혔습니다.", "pts": ["민주당 윤리심판원은 기자 지칭 발언 등 품위 훼손을 이유로 최민희 최고위원에게 당원권 2년 정지를 의결했습니다.", "징계 확정 시 최고위원직이 자동 해제되며 내후년 총선 및 전당대회 출마 자격이 상실됩니다.", "최 최고위원은 7일 이내 재심을 신청할 예정이며 친청계와 친명계 간 계파 갈등이 심화될 전망입니다."], "kw": ["최민희", "더불어민주당", "윤리심판원", "당원권정지"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008867257&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008867300&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008867301&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "노사 '정년 65세 연장' 대화 합의 불발", "s": "법정 정년을 65세로 늘리는 방안을 두고 노사가 10달 만에 만났으나 입장차를 좁히지 못했습니다. 노동계는 임금 삭감 없는 일괄 연장을, 경영계는 퇴직 후 재고용 방식을 주장하고 있습니다. 청년층의 취업문이 더 좁아질 수 있다는 우려도 지속되고 있습니다.", "pts": ["민주당 정년연장특위 회의에서 노사는 정년 65세 연장에 동의했으나 조건과 방식을 두고 대립했습니다.", "경영계는 청년 고용 위축과 호봉제 부담을 이유로 재고용을, 노동계는 임금 유지와 신속 연장을 요구했습니다.", "특위는 12월 2일 활동을 종료하며 합의 불발 시 정부 중재안을 바탕으로 연내 입법이 추진될 예정입니다."], "kw": ["정년연장", "노사합의", "청년고용", "경영계"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008867270&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008867271&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "학교 비정규직 파업…급식·돌봄 파행", "s": "학교 급식과 돌봄을 담당하는 비정규직 노동자들이 임금 인상을 요구하며 하루 총파업을 진행했습니다. 이에 따라 전국 학교의 32%에서 급식이 차질을 빚어 학생들이 빵이나 도시락으로 끼니를 해결했습니다. 노조는 요구안이 수용되지 않을 경우 추가 파업을 예고했습니다.", "pts": ["전국 2만 3천여 명의 학교 비정규직 노동자가 파업에 참여해 급식과 초등 돌봄교실이 일부 중단됐습니다.", "노조는 근속수당과 기본급의 실질적 인상을 요구했으나 교육 당국의 제시안과 큰 격차를 보였습니다.", "매년 반복되는 교섭 난항으로 불편이 이어지는 가운데 노조는 진전이 없을 시 추가 파업을 예고했습니다."], "kw": ["학교비정규직", "총파업", "급식중단", "돌봄교실"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008867277&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "정치", "h": "'민원 사주 의혹' 류희림 전 위원장 송치", "s": "가족과 지인을 동원해 특정 보도에 대한 심의 민원을 넣도록 한 혐의를 받는 류희림 전 방송통신심의위원장이 경찰 조사를 받았습니다. 경찰은 위계에 의한 업무방해 혐의를 적용해 사건을 공소청으로 송치했습니다. 류 전 위원장은 2023년 뉴스타파 인용 보도 심의 과정에 관여한 혐의입니다.", "pts": ["서울경찰청은 류희림 전 방심위원장을 위계에 의한 업무방해 혐의로 불구속 송치했습니다.", "류 전 위원장은 2023년 9월 가족과 지인에게 특정 방송 보도 심의 민원을 사주한 혐의를 받습니다.", "사주한 민원을 바탕으로 직접 심의에 참여해 타 심의위원의 업무를 방해했다고 판단했습니다."], "kw": ["류희림", "방송통신심의위원회", "민원사주", "불구속송치"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008867315&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "정치", "h": "홍익표, 배우자 주식 백지신탁 불복 소송", "s": "홍익표 통일부 장관 후보자가 국회의원 시절 배우자의 주식 백지신탁 결정에 불복해 소송을 낸 사실이 확인됐습니다. 법원은 피감기관인 조달청과의 관련성을 이유로 집행정지 신청을 기각했습니다. 해당 업체는 실제로 조달청을 통해 공공기관 공사를 수주한 이력이 있습니다.", "pts": ["2020년 백지신탁 심사위는 홍 후보자 배우자의 28억 원대 비상장주식에 대해 직무관련성 결정을 내렸습니다.", "홍 후보자는 연좌제 금지 위배를 주장하며 소송을 냈으나 법원은 직무관련성을 인정해 기각했습니다.", "배우자의 실내건축업체가 피감기관인 조달청 나라장터를 통해 관급 공사를 수주한 사실도 확인됐습니다."], "kw": ["홍익표", "백지신탁", "이해충돌", "조달청"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008867272&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008867273&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008867322&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "경제", "h": "중국 증시, 정부 부양 메시지에 급등", "s": "중국 정부가 이례적으로 장중에 강력한 주가 부양 메시지를 내놓으면서 중국 증시가 급등했습니다. 국무원은 자사주 매입 확대와 정부 주도 자금의 시장 안정 역할을 강조했습니다. 이에 상하이종합지수는 3.73% 상승했고 과창판 50 지수는 15% 이상 폭등했습니다.", "pts": ["중국 국무원 상무회의가 장중 자본시장 안정과 중장기 자금 유입 지지 방침을 발표했습니다.", "상하이종합지수가 3.73% 오르며 3,600선을 회복했고 주요 지수들이 2년 만에 최고 상승률을 기록했습니다.", "전문가들은 당국의 강한 의지를 평가하면서도 지속적 상승을 위해서는 실질적 지원책이 필요하다고 지적했습니다."], "kw": ["중국증시", "상하이종합지수", "부양책", "국무원"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008867313&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "국제", "h": "타이완 성장률 전망 13.28%…48년 만에 최고", "s": "글로벌 AI 열풍에 힘입어 타이완의 올해 경제성장률 전망치가 13.28%로 대폭 상향 조정됐습니다. 이는 1978년 이후 48년 만에 가장 높은 수준입니다. TSMC 등 반도체 기업들이 성장을 이끌고 있으며 내년 성장률 전망도 함께 상향됐습니다.", "pts": ["타이완 주계총처는 올해 GDP 성장률 전망치를 기존 11.05%에서 13.28%로 상향했습니다.", "세계 최대 파운드리 업체인 TSMC를 포함한 반도체 산업이 경제 성장을 견인하고 있습니다.", "시장 불확실성에도 불구하고 2027년 성장률 전망치 역시 6.51%로 높여 잡았습니다."], "kw": ["타이완", "경제성장률", "TSMC", "AI붐"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008867333&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "일 성인물 배우 동원 강남 '원정 성매매' 적발", "s": "일본 성인물 배우들을 입국시켜 강남 일대 호텔에서 성매매를 알선한 일당이 경찰에 적발됐습니다. 총책은 베트남에서 텔레그램을 통해 예약을 관리하며 최소 16억 원의 범죄수익을 챙겼습니다. 당국은 국내 체류 중인 여성들을 검거하고 베트남 총책에 대해 인터폴 적색수배를 내렸습니다.", "pts": ["일본 성인 배우 등 22명을 관광비자로 입국시켜 강남 호텔에서 성매매를 알선한 일당이 적발됐습니다.", "총책 A씨는 베트남에서 원격으로 업소를 운영하며 최소 16억 원 상당의 불법 수익을 취득했습니다.", "법무부는 관련자들을 검거 및 송치 조치하고 베트남에 체류 중인 총책에 대해 인터폴 적색수배를 요청했습니다."], "kw": ["원정성매매", "성인물배우", "인터폴적색수배", "법무부"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008867280&plink=RSSLINK&cooper=RSSREADER"}]}], "ok": true, "built": "2026-11-28"}, {"label": "당일 00:00–07:00 기사 기준", "items": [{"c": "날씨", "h": "오늘 경기 광주 날씨 구름 조금, 최저 0도 최고 7도", "s": "오늘 경기 광주은 구름 조금, 최저 0도 최고 7도입니다. 출근 시간대인 오전 8시에는 3도입니다. 강수 확률은 최대 0퍼센트로, 우산은 필요 없겠습니다.", "pts": ["기온: 최저 0도, 최고 7도 (오전 8시 3도, 오후 6시 4도)", "강수: 확률 최대 0퍼센트, 예상 강수량 0.0밀리미터", "바람: 최대 풍속 약 7미터", "미세먼지 보통, 초미세먼지 나쁨 (Open-Meteo 모델 예측치, 낮 시간 최대 기준)"], "kw": ["경기 광주", "구름 조금", "날씨"], "src": "Open-Meteo 예측 모델(기상청 공식 예보와 다를 수 있음)", "date": "2026-11-28"}, {"c": "국제", "h": "트럼프 이란전 종전 장담에 이란 무력 대응 예고", "s": "트럼프 미국 대통령이 이란과의 전쟁을 원할 때 언제든 끝낼 수 있다며 이란이 합의하지 않으면 지하 핵시설인 곡괭이산을 타격하겠다고 경고했습니다. 이에 이란 혁명수비대는 미국의 해상봉쇄를 돌파하겠다며 공중과 해상에서의 무력 대응을 예고해 중동 전운이 다시 짙어지고 있습니다.", "pts": ["트럼프 미국 대통령이 이란과의 합의가 불발될 경우 지하 핵시설 추정지인 곡괭이산 타격 등 내년 초 공습 재개를 경고했습니다.", "미군은 이란 항만 해상봉쇄를 집행하며 오만만에서 경고에 불응하고 봉쇄선을 뚫으려던 상선을 정밀유도탄으로 타격해 멈춰 세웠습니다.", "이란 혁명수비대는 해상봉쇄 돌파를 확고한 다짐으로 규정하고 공중과 해상에서 맞불 작전을 예고했습니다."], "kw": ["트럼프", "이란", "해상봉쇄", "곡괭이산"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008867452&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008867458&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008867472&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "국제", "h": "중국 데이터센터서 엔비디아 최첨단 AI 칩 발견", "s": "젠슨 황 엔비디아 CEO의 불륜 상대였던 앨리스 황과 연계된 중국 데이터센터에서 미국의 수출통제 대상인 최첨단 AI 칩 블랙웰이 발견됐습니다. 해당 반도체를 탑재한 서버를 담보로 현지 은행 대출까지 받은 사실이 확인되면서 복귀한 젠슨 황 CEO에게 큰 부담이 될 전망입니다.", "pts": ["상하이 데이터센터 프로젝트 참여 업체들이 엔비디아의 최첨단 AI 칩 블랙웰을 탑재한 서버 시스템을 보유·설치한 것으로 파악됐습니다.", "해당 업체들은 젠슨 황 CEO의 불륜 상대인 앨리스 황이 설립하거나 지배하는 기업들과 연계된 것으로 나타났습니다.", "엔비디아는 서버 장비의 크기 때문에 밀반입이 어렵다고 주장해왔으나 중국 반입이 사실로 확인되면서 부담이 가중되고 있습니다."], "kw": ["엔비디아", "젠슨 황", "블랙웰", "앨리스 황"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008867451&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008867473&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "국제", "h": "미군 오만만서 이란 해상봉쇄 돌파 시도 상선 무력화", "s": "미 중부사령부가 이란 반다르아바스항을 출항해 오만만에서 해상봉쇄선을 돌파하려던 팔라우 선적 상선을 무력화했습니다. 미군 항공기는 정밀유도탄을 발사해 선박 추진 기능을 무력화했으며 민간인 승무원 피해는 없다고 밝혔습니다.", "pts": ["미 중부사령부가 이란 항만 해상봉쇄선 돌파를 시도한 팔라우 선적 벌크선 퍼시픽 아처호를 오만만에서 타격했습니다.", "정밀유도탄으로 선미를 타격해 선박 추진 기능을 무력화했으며 민간인 승무원은 다치지 않은 것으로 확인됐습니다.", "미군은 현재까지 지시에 응한 상선 158척의 항로를 변경시키고 불응한 6척을 무력화하며 엄격한 봉쇄를 이어가고 있습니다."], "kw": ["미 중부사령부", "해상봉쇄", "오만만", "무력화"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008867459&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "국제", "h": "신변 위협에 군 기지로 거처 옮기는 미 행정부 각료들", "s": "도널드 트럼프 미국 행정부의 주요 각료들이 신변 위협과 시위 등으로 인해 자택을 떠나 군 기지로 거처를 옮기고 있습니다. 피트 헤그세스 국방장관, 마코 루비오 국무장관, 스콧 베선트 재무장관 등이 군 관사에 거주하면서 지도자들이 시민과 단절된다는 지적이 나오고 있습니다.", "pts": ["스콧 베선트 재무장관과 토드 블랜치 법무장관, 스티브 밀러 비서실장 등 주요 인사들이 이란의 살해 위협과 스토킹 등의 이유로 군 기지로 이주했습니다.", "국방부와 국무부 장관 등 고위 인사들이 포트 맥네어 등 군 기지 내 관사에 모여 살며 고립된 생활을 이어가고 있습니다.", "외신은 이러한 경향이 지도자가 평범한 시민 속에서 살아가는 민주주의 전통을 사라지게 만들고 있다고 지적했습니다."], "kw": ["트럼프 행정부", "군 기지 이주", "신변 위협", "관사"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008867456&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "국제", "h": "트럼프 나토 사무총장과 회담 후 성명 임의 수정 발표", "s": "트럼프 미국 대통령이 마르크 뤼터 나토 사무총장과 회담을 가진 뒤 합의된 내용보다 배 이상 긴 수정 성명을 임의로 발표했습니다. 성명에는 우크라이나의 확전 자제 책임과 미국 미사일 방어 시스템 생산 관련 내용이 추가되어 정상 간 합의 훼손 우려가 제기됩니다.", "pts": ["트럼프 대통령이 뤼터 나토 사무총장과의 회담 후 기존 4문장짜리 공동성명을 임의로 수정하여 트루스소셜에 게재했습니다.", "수정된 성명에는 러시아뿐만 아니라 우크라이나도 확전을 피해야 한다는 문구와 패트리엇, 사드 등 미군 전력 생산 활성화 내용이 추가됐습니다.", "외신은 정상 간 공식 정치적 합의를 마음대로 바꾼 트럼프의 행동이 외교적 전략의 한계를 보여준다고 지적했습니다."], "kw": ["트럼프", "나토", "뤼터", "공동성명"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008867457&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "국제", "h": "극초음속 미사일 치르콘 탑재 러 신형 핵잠수함 취역", "s": "블라디미르 푸틴 러시아 대통령이 세베로드빈스크 항구에서 열린 신형 핵추진 잠수함 페름호의 취역식에 직접 참석했습니다. 페름호는 사거리 1천㎞, 최고 속도 음속 9배에 달하는 극초음속 미사일 치르콘을 상시 탑재한 첫 번째 잠수함입니다.", "pts": ["러시아 세브마시 조선소에서 극초음속 미사일 치르콘을 탑재한 야센-M급 핵추진 잠수함 페름호의 취역식이 열렸습니다.", "푸틴 대통령이 직접 참석해 해군 현대화 추진을 강조했으며, 치르콘 미사일이 잠수함에 상시 탑재된 것은 이번이 처음입니다.", "치르콘은 음속의 9배 속도로 사거리 1천㎞에 달해 미국 미사일 방어망을 무력화할 수 있을 것으로 러시아는 기대하고 있습니다."], "kw": ["푸틴", "러시아", "핵잠수함", "치르콘"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008867461&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "경제", "h": "65세 정년 연장 논의 10달 만에 재개됐으나 합의 실패", "s": "법정 정년을 65세로 연장하는 방안을 논의하기 위해 민주당 정년연장특위와 노사가 10달 만에 만났으나 입장차만 확인하고 합의에 실패했습니다. 노동계는 임금 삭감 없는 일괄 정년 연장을, 경영계는 퇴직 후 재고용과 단계적 연장을 주장하고 있습니다.", "pts": ["민주당 정년연장특위 주도로 10달 만에 노사 회의가 열렸으나 서로를 비판하며 1시간 40분 만에 소득 없이 종료됐습니다.", "노동계는 임금 보전과 일괄 연장을 요구하는 반면, 경영계는 청년 고용 부담과 기업 비용을 이유로 재고용 및 단계적 연장을 고수하고 있습니다.", "특위 활동이 다음 달 2일 종료됨에 따라 합의가 무산될 경우 당정은 정부 중재안을 바탕으로 연내 입법을 추진할 방침입니다."], "kw": ["정년 연장", "65세", "노사 합의 실패", "민주당"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008867471&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "정치", "h": "민주당 최민희 의원 당원권 2년 정지 중징계 의결", "s": "민주당 윤리심판원이 이재명 대통령 탄핵 반대 발언 논란 등을 일으킨 최민희 최고위원에게 당원 자격 2년 정지의 중징계를 내렸습니다. 징계가 확정되면 최고위원직 박탈과 함께 다음 총선 출마가 불가능해지나 최 의원은 수용 불가 및 재심 신청 방침을 밝혔습니다.", "pts": ["민주당 윤리심판원이 당 품위 훼손 등을 이유로 최민희 최고위원에게 제명 다음으로 무거운 당원 자격 2년 정지를 의결했습니다.", "징계 확정 시 최고위원직이 자동 박탈되고 2028년 총선 및 전당대회 출마 자격이 상실됩니다.", "최 의원이 재심을 신청하면 60일 내 최종 심사 전까지 징계 효력이 보류되며 친청계 의원들은 강력히 반발하고 있습니다."], "kw": ["최민희", "더불어민주당", "당원권 정지", "윤리심판원"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008867470&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "정치", "h": "법사 /* ---- 듣기: 문장 단위로 끊어 읽기(안드로이드 크롬/삼성 인터넷 호환) ---- */
function text(n){return n.c+" 소식입니다. "+n.h+". "+n.s+" "+(n.pts||[]).join(". ")}
function chunks(s){return (s.match(/[^.!?。]+[.!?。]*\s*/g)||[s]).map(function(x){return x.trim()}).filter(Boolean)}
function mark(i){[].forEach.call(document.querySelectorAll(".row"),function(c,k){c.classList.toggle("playing",k===i)})}
function lock(){try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(function(l){wl=l}).catch(function(){})}catch(e){}}
function unlock(){try{if(wl){wl.release();wl=null}}catch(e){}}
function loadCard(k){
  if(k>=queue.length){stop();return false}
  var n=DATA[tab].items[queue[k]];
  qi=k;ci=0;CH=chunks(text(n));mark(queue[k]);talk(true);
  $("np").textContent=(queue.length>1?(k+1)+"/"+queue.length+" · ":"")+n.h;
  var el=$("c"+queue[k]);if(el&&el.scrollIntoView)el.scrollIntoView({block:"center",behavior:"smooth"});
  return true;
}
function say(){
  if(paused||qi<0)return;
  if(ci>=CH.length){if(loadCard(qi+1))say();return}
  var my=++tok;
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(CH[ci]);
  u.lang="ko-KR";u.rate=parseFloat($("rate").value);
  var v=speechSynthesis.getVoices().filter(function(x){return x.lang&&x.lang.replace("_","-").toLowerCase().indexOf("ko")==0})[0];
  if(v)u.voice=v;
  u.onend=function(){if(my===tok&&!paused){ci++;say()}};
  u.onerror=function(){if(my===tok&&!paused){ci++;say()}};
  speechSynthesis.speak(u);
}
function start(list){stop();if(!TTS||!list.length)return;queue=list;lock();if(loadCard(0))say()}
function stop(){tok++;paused=false;qi=-1;queue=[];CH=[];if(TTS)speechSynthesis.cancel();mark(-1);talk(false);unlock();$("pp").textContent="⏸";$("np").textContent=NP0}
$("list").addEventListener("click",function(e){
  var s=e.target.closest("[data-s]");
  if(s){start([+s.dataset.s]);return}
  var t=e.target.closest(".tg");
  if(t){var c=$("c"+t.dataset.i);var o=c.classList.toggle("open");t.setAttribute("aria-expanded",o)}
});
$("t0").onclick=function(){stop();tab=0;render()};
$("t1").onclick=function(){stop();tab=1;render()};
$("all").onclick=function(){start(DATA[tab].items.map(function(_,i){return i}))};
$("pp").onclick=function(){
  if(!TTS||qi<0)return;
  if(paused){paused=false;$("pp").textContent="⏸";talk(true);say()}
  else{paused=true;tok++;speechSynthesis.cancel();talk(false);$("pp").textContent="▶"}
};
$("stop").onclick=stop;
$("rate").onchange=function(){try{localStorage.setItem("rate",$("rate").value)}catch(e){}};
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&qi>=0&&!paused)lock()});
if(!TTS)document.querySelector(".bar").style.display="none";
$("np").textContent=NP0;
render();
</script>
</body>
</html>
