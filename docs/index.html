<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뉴콩이의 출근길 뉴스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6f0;--card:#fff;--ink:#4a3a3a;--sub:#8a7468;--bd:#f0dcc6;--accent:#ff6f91;--onacc:#fff;--tint:#e3f3ff;--tbd:#bfe0f7;
--skyM:linear-gradient(170deg,#ffe3b3,#ffc2d4 55%,#b9ddff);--onM:#4a3a3a;
--skyE:linear-gradient(170deg,#5b4aa8,#8f5db8 60%,#c26aa9);--onE:#fff;
--disp:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
--sans:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1830;--card:#2b2344;--ink:#fff1e6;--sub:#c4b6d9;--bd:#40355f;--accent:#ff8fab;--onacc:#2a1730;--tint:#1f3350;--tbd:#2f4d75;
--skyM:linear-gradient(170deg,#5a4263,#8a5566 55%,#3b5c8f);--onM:#fff;--skyE:linear-gradient(170deg,#171236,#2d2160 55%,#5a3070);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1e1830;--card:#2b2344;--ink:#fff1e6;--sub:#c4b6d9;--bd:#40355f;--accent:#ff8fab;--onacc:#2a1730;--tint:#1f3350;--tbd:#2f4d75;
--skyM:linear-gradient(170deg,#5a4263,#8a5566 55%,#3b5c8f);--onM:#fff;--skyE:linear-gradient(170deg,#171236,#2d2160 55%,#5a3070);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;word-break:keep-all;overflow-wrap:break-word}
body[data-tab="m"]{--sky:var(--skyM);--on:var(--onM)}
body[data-tab="e"]{--sky:var(--skyE);--on:var(--onE)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
body[data-tab="m"] .e-only,body[data-tab="e"] .m-only{display:none}

/* 하늘 + 뉴콩이 */
.sky{position:relative;overflow:hidden;background:var(--sky);color:var(--on);border-radius:0 0 34px 34px;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 20px;transition:background .4s}
.sky-in{position:relative;max-width:640px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-family:var(--disp);font-weight:400;font-size:29px;line-height:1.25;margin:0}
.date{margin:4px 0 0;font-size:14px;opacity:.85}
.hi{font-family:var(--disp);font-size:16px;margin-top:2px}
.orb{position:absolute;right:120px;top:2px;width:40px;height:40px;border-radius:50%}
body[data-tab="m"] .orb{background:radial-gradient(circle at 40% 40%,#fffbe0,#ffd566 65%);box-shadow:0 0 20px 6px rgba(255,214,102,.6)}
body[data-tab="e"] .orb{background:#fff7d6;box-shadow:inset -9px -3px 0 0 rgba(140,110,190,.55),0 0 18px 3px rgba(255,255,255,.3)}
.deco{position:absolute;font-size:20px;pointer-events:none}
.d1{right:36%;top:46px}.d2{right:10px;top:4px;font-size:15px}.d3{left:52%;top:8px;font-size:14px}
.mascot-wrap{position:relative;flex:none;width:100px}
.mascot{display:block;width:100px;height:100px;overflow:visible}
.mascot *{transform-box:fill-box}
.eyes-shut,.mouth-talk{display:none}
body[data-tab="m"] .eyes-shut{display:none}
body[data-tab="e"]:not(.talk) .eyes-open{display:none}
body[data-tab="e"]:not(.talk) .eyes-shut{display:inline}
.wave{transform-origin:50% 85%;animation:wave 1.8s ease-in-out infinite}
body[data-tab="e"] .wave{animation:none}
.zz{font-family:var(--disp);font-size:15px;fill:#fff;animation:zz 2.4s ease-in-out infinite}
.talk .mouth{display:none}
.talk .mouth-talk{display:inline;transform-origin:center;animation:yap .32s ease-in-out infinite alternate}
.talk .bob{animation:bob .5s ease-in-out infinite alternate}
.note{position:absolute;font-size:18px;opacity:0;color:var(--on)}
.n1{left:-4px;top:6px}.n2{right:-2px;top:-4px}
.talk .note{animation:note 1.5s ease-out infinite}
.talk .n2{animation-delay:.7s}
@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(22deg)}}
@keyframes yap{from{transform:scaleY(.35)}to{transform:scaleY(1.25)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes zz{0%,100%{opacity:.4;transform:translateY(2px)}50%{opacity:1;transform:translateY(-3px)}}
@keyframes note{0%{opacity:0;transform:translateY(8px)}30%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
.notice{display:inline-block;margin:10px 0 14px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.35);font-size:12.5px}
.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.3);max-width:340px}
.tab{flex:1;padding:9px 0;border:0;border-radius:999px;background:transparent;font-family:var(--disp);font-size:16px;color:var(--on)}
.tab[aria-selected="true"]{background:#fff;color:#4a3a3a;box-shadow:0 2px 0 rgba(0,0,0,.12)}

main{max-width:640px;margin:0 auto;padding:18px 16px 160px}
.tl{font-size:13px;color:var(--sub);margin:0 0 12px 4px}
.empty{color:var(--sub);font-size:15px;padding:36px 0;text-align:center}

/* 말랑한 기사 카드: 번호 = 전체 듣기 재생 순서 */
.row{--bd2:var(--bd);background:var(--card);border:2px solid var(--bd);border-radius:24px;margin-bottom:14px;box-shadow:0 4px 0 var(--bd);transition:border-color .2s,box-shadow .2s}
@supports (color:color-mix(in srgb,red,blue)){.row{--bd2:color-mix(in srgb,var(--c) 35%,var(--bg));border-color:var(--bd2);box-shadow:0 4px 0 var(--bd2)}}
.row.playing{border-color:var(--c);box-shadow:0 4px 0 var(--c)}
.head{display:grid;grid-template-columns:38px 1fr 44px;gap:10px;padding:14px}
.no{width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;font-family:var(--disp);font-size:19px;display:grid;place-items:center}
.playing .no{animation:hop .6s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-4px)}}
.tg{text-align:left;background:none;border:0;padding:0;min-width:0}
.cat{display:inline-flex;align-items:center;gap:6px;font-family:var(--disp);font-size:13px;color:var(--c);padding:1px 10px;border-radius:999px;border:1.5px solid var(--c)}
.tg h2{font-family:var(--disp);font-weight:400;font-size:18px;line-height:1.45;margin:6px 0 6px}
.tg p{margin:0;color:var(--sub);font-size:14.5px}
.more{display:inline-block;margin-top:8px;font-family:var(--disp);font-size:13px;color:var(--accent)}
.more::after{content:" ▾"}
.open .more::after{content:" ▴"}
.spk{width:44px;height:44px;border-radius:50%;border:2px solid var(--bd);background:var(--bg);font-size:18px;transition:background .2s}
.playing .spk{background:var(--c);border-color:var(--c)}
.eq{display:none;gap:2px;align-items:flex-end;height:11px}
.playing .eq{display:inline-flex}
.eq i{width:3px;background:var(--c);border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.25s}.eq i:nth-child(3){animation-delay:.5s}
@keyframes eq{0%,100%{height:3px}50%{height:11px}}

.detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease;margin:0 14px 0 62px;font-size:14px}
.open .detail{grid-template-rows:1fr}
.detail>div{overflow:hidden}
.open .detail>div{padding-bottom:16px}
.detail h3{font-family:var(--disp);font-weight:400;font-size:13px;color:var(--sub);margin:12px 0 4px}
.detail ul{margin:0;padding-left:18px}
.detail li{margin-bottom:3px}
.kw span{display:inline-block;font-size:12.5px;background:var(--bg);border-radius:999px;padding:0 10px;margin:0 4px 4px 0;color:var(--sub)}
.src{font-size:12.5px;color:var(--sub)}
.lk a{display:inline-block;font-size:13px;color:var(--accent);margin-right:14px}

/* 날씨 */
.wx{background:var(--tint);border-color:var(--tbd);box-shadow:0 4px 0 var(--tbd)}
.wx .no{background:var(--card);font-size:22px;color:inherit}

/* 플레이어 */
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:616px;margin:0 auto;background:var(--card);border:2px solid var(--bd);border-radius:26px;padding:10px 12px;box-shadow:0 4px 0 var(--bd),0 12px 24px rgba(60,30,40,.15);z-index:5}
.np{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px 8px}
.ctl{display:flex;gap:8px;align-items:center}
.ctl button,.ctl select{height:44px;border:2px solid var(--bd);background:var(--bg);color:var(--ink);border-radius:16px;font-family:var(--disp);font-size:16px;padding:0 14px}
.ctl .main{flex:1;background:var(--accent);border-color:var(--accent);color:var(--onacc)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

var DATA=[{"label": "전날 18:00–24:00 기사 기준", "items": [{"c": "정치", "h": "이재명 대통령, 필리핀서 한-메콩·아세안 회의 및 필리핀 정상회담 개최", "s": "이재명 대통령이 필리핀 마닐라에서 열린 한-메콩 정상회의, 한-아세안 정상회의, 한-필리핀 정상회담에 연이어 참석했습니다. 이 대통령은 메콩 국가들과의 협력 확대, 한-아세안 AI 및 문화창조산업 이니셔티브 제안, 필리핀과의 전략적 동반자 관계 심화 방안을 발표했습니다. 6년 만에 재개된 한-메콩 정상회의와 한-아세안 FTA 개선 협상을 바탕으로 다양한 분야에서 실질적 협력을 넓혀갈 방침입니다.", "pts": ["6년 만에 재개된 한-메콩 정상회의에서 AI·디지털 및 핵심 광물 공급망 등 협력 지평을 넓히기로 했습니다.", "한-아세안 정상회의에서는 AI 동맹 및 문화창조산업 이니셔티브를 새로 제안하고 FTA 개선 협상 개시를 알렸습니다.", "필리핀과의 정상회담을 통해 조선·AI·원전 분야 협력 확대와 과학기술 협력 양해각서(MOU) 등을 체결했습니다."], "kw": ["이재명 대통령", "아세안", "한-메콩 정상회의", "필리핀 정상회담"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848627&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848628&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848663&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "경제", "h": "앤트로픽 상장과 엔비디아 투자 축소 여파에 삼전·닉스 주가 급락", "s": "외국인 투자자들의 대규모 매도세로 삼성전자와 SK하이닉스 주가가 크게 떨어지며 코스피가 하락 마감했습니다. 앤트로픽의 나스닥 상장을 앞두고 외국인이 현금 확보에 나선 점과 엔비디아의 투자 축소 우려가 시장에 부정적인 영향을 미쳤습니다. 반도체 두 기업의 이익 비중이 큰 만큼 관련 불확실성이 해소되기 전까지 증시 변동성은 계속될 전망입니다.", "pts": ["앤트로픽 나스닥 상장에 대비한 외국인의 8,400억 원 규모 순매도로 삼성전자와 SK하이닉스가 급락했습니다.", "엔비디아가 임시 CEO 체제에서 AI 업계 전반에 제공하던 자금 지원을 줄일 것이라는 보도가 악재로 작용했습니다.", "국내 증시 상위 반도체 기업에 대한 이익 기대치가 흔들리면서 당분간 큰 폭의 출렁임이 이어질 수 있습니다."], "kw": ["삼성전자", "SK하이닉스", "엔비디아", "앤트로픽"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848562&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848523&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "자격시험 AI 안경 부정행위 12건 적발…전파탐지기 한계 지적", "s": "국가자격시험에서 스마트 안경 등을 활용한 부정행위가 올해 12건 적발된 것으로 뒤늦게 확인됐습니다. 대안으로 거론되는 전파탐지기는 생활 속 모든 전파에 반응해 특정 수험생을 가려내기 어렵다는 지적이 나옵니다. 정부는 시험 종목 전수조사에 나섰지만, AI 분석 등 추가적인 기술 병행 조치가 요구되고 있습니다.", "pts": ["올해 국가자격시험에서 스마트 안경 등을 이용한 부정행위 적발 건수가 당초 발표된 6건의 두 배인 12건으로 확인됐습니다.", "시중 전파탐지기는 일상 전자기기 전파에도 경보음이 울려 특정 부정행위자만을 적발하기는 어렵습니다.", "정부는 국가자격시험 528개 종목 조사를 진행 중이나, AI 기술을 활용한 이상 행동 분석 등 복합적인 대책이 필요합니다."], "kw": ["스마트 안경", "부정행위", "전파탐지기", "한국산업인력공단"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848521&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848519&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "정치", "h": "민주당 지도부 회의 복귀했으나 당내 계파 갈등 여전", "s": "당대표 감찰 지시에 반발해 지도부 회의에 불참했던 친정청래계 최고위원들이 회의에 복귀했습니다. 그러나 회의장에서는 사과와 함께 상대 계파를 향한 가시 돋친 발언들이 쏟아지며 살얼음판 분위기가 이어졌습니다. 최민희 의원의 징계 수위 결정에 따라 당내 갈등이 더 격화될 가능성이 있습니다.", "pts": ["지도부 회의에 불참했던 최민희 의원 등 친정계 최고위원들이 복귀했으나 계파 간 신경전은 지속됐습니다.", "최 의원은 사과와 함께 반분신 연합 의혹에 대한 진상규명을 요구했고, 친명계는 해당 행위에 대해 쓴소리를 냈습니다.", "김민석 대표가 당헌당규에 따른 엄정한 절차를 강조한 가운데 이르면 이번 주 나올 징계 결과가 분수령이 될 전망입니다."], "kw": ["민주당", "김민석", "최민희", "계파 갈등"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848534&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "국제", "h": "요르단·이라크, 테러 방지 및 안보 이유로 텔레그램 차단", "s": "요르단과 이라크 당국이 국가 안보 우려와 극단주의 테러 방지를 이유로 메신저 앱 텔레그램의 접속을 차단했습니다. 그동안 IS 등 극단주의 테러 조직이 성명 유포나 소통 수단으로 텔레그램을 악용해왔기 때문입니다. 이라크는 불법 콘텐츠 차단 및 현지 법률 준수를 촉구하며 텔레그램 측에 30일간의 시정 기간을 주었습니다.", "pts": ["요르단은 최근 교회 습격 등 IS 배후 추정 테러가 발생하자 극단주의 유포를 막기 위해 텔레그램을 차단했습니다.", "IS 무장대원들이 성명과 선전물을 유포할 때 텔레그램을 핵심 통로로 이용해 온 점이 주요 차단 원인입니다.", "이라크 역시 불법 콘텐츠 방치와 법률 미준수를 이유로 차단을 단행하며 30일의 시정 기간을 부여했습니다."], "kw": ["텔레그램", "요르단", "이라크", "IS 테러"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848678&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "정치", "h": "청해부대 파견 연장안 국회 제출…내년 2월 문무대왕함 출항", "s": "청해부대의 작전 범위를 호르무즈 해협 부근까지 넓히는 파견 연장안이 국회에 제출됐습니다. 연장안이 통과되면 포세이돈 해상초계기가 먼저 지부티 기지로 파견되고 내년 2월 문무대왕함이 출항할 예정입니다. 군 당국은 전투 관여 없이 우리 국민과 선박 보호 임무에만 집중하겠다고 강조했습니다.", "pts": ["청해부대 50진 주력으로 문무대왕함이 선정되었으며 파견 연장안 통과 시 내년 2월 출항하게 됩니다.", "신규 도입된 포세이돈 해상초계기는 연장안 국회 통과 직후 지부티 미군 기지를 거점으로 먼저 투입될 예정입니다.", "국방부는 이란 전쟁 종전 후 실제 작전에 임하며 전쟁에 관여하지 않고 선박 보호에만 집중할 방침입니다."], "kw": ["청해부대", "문무대왕함", "포세이돈 초계기", "호르무즈 해협"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848536&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "정치", "h": "교육부 장관, 국회서 \"AI 부정행위 적발 자신 없다\" 답변 논란", "s": "국회 교육위원회에 출석한 교육부 장관이 수능 AI 부정행위를 현장 감독관이 적발하기는 현실적으로 어렵다고 답변해 논란이 불거졌습니다. 교육부는 통신 차단 외에는 완전한 적발이 쉽지 않음을 인정하면서도 수능 연기는 검토하지 않는다고 밝혔습니다. 이에 국회에서는 부정행위에 대한 처벌 및 응시 자격 제한 강화를 촉구했습니다.", "pts": ["교육부 장관이 국회 답변에서 개인적 나이 등을 이유로 현장 AI 부정행위를 완벽히 적발할 자신이 없다고 말했습니다.", "교육부 차관 역시 통신 원천 차단 외에는 부정행위 100% 적발이 쉽지 않다는 기술적 한계를 나타냈습니다.", "수능 연기 없이 시험이 치러질 예정인 가운데 의원들은 부정행위 발생 시 강력한 처벌 대책을 요구했습니다."], "kw": ["수능", "AI 부정행위", "교육부 장관", "국회 교육위"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848517&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "해외 처방 비만치료제 휴대 반입 갑자기 허용…늑장 행정 비판", "s": "정부가 해외에서 처방받은 마운자로, 위고비 등 비만치료제의 개인 반입을 3개월 분량까지 허용하기로 지침을 바꿨습니다. 그동안 유해 의약품으로 규정해 공항 세관에서 수천 건을 단속해 왔으나 공식 브리핑 없이 기준을 변경했습니다. 기존에 약을 압수당했던 구매자들의 반발과 함께 보건 및 관세 당국의 일관성 없는 행정에 대한 지적이 나옵니다.", "pts": ["올해 8월까지 5천 건 넘게 단속하던 마운자로 등 해외 처방 비만치료제 휴대 반입을 3개월치까지 전격 허용했습니다.", "별도 설명이나 브리핑 없이 지침이 변경되면서 이전에 약을 압수당했던 구매자들의 불만이 커지고 있습니다.", "식약처와 관세청이 단속 책임에 대해 엇갈린 해명을 내놓으며 과도한 규제와 늑장 대처라는 비판을 받고 있습니다."], "kw": ["비만치료제", "마운자로", "관세청", "식약처"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008847765&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "정치", "h": "이재명 대통령 부부, 필리핀 전통의상 입고 아세안 갈라 만찬 참석", "s": "아세안 정상회의 참석차 필리핀을 방문한 이재명 대통령 부부가 마닐라에서 열린 공식 갈라 만찬에 참석했습니다. 이 대통령 부부는 필리핀 측이 준비한 전통의상을 입고 참석해 주최국 대통령 내외와 인사를 나눴습니다. 이 대통령은 다음 날 열리는 아세안+3 정상회의에 참석해 미래 협력 방안을 제시할 예정입니다.", "pts": ["이재명 대통령과 김혜경 여사가 필리핀 대통령 부부가 주최한 아세안 갈라 디너에 참석했습니다.", "필리핀 측이 특별 제작한 전통의상을 착용하고 행사장 및 문화공연을 함께했습니다.", "이 대통령은 이어진 일정으로 아세안+3 정상회의에 참석해 한중일 및 아세안 간 협력 구상을 밝힐 계획입니다."], "kw": ["이재명 대통령", "필리핀", "아세안 갈라만찬", "아세안+3"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848664&plink=RSSLINK&cooper=RSSREADER"}]}]}, {"label": "당일 00:00–07:00 기사 기준", "items": [{"c": "정치", "h": "이재명 대통령, 아세안서 AI·문화 협력 제안…오늘 한일정상회담", "s": "이재명 대통령이 필리핀에서 열린 한-아세안 정상회의에 참석해 인공지능과 문화창조산업 협력을 제안했습니다. 이 대통령은 스캠 범죄 척결과 FTA 개선 성과를 짚은 데 이어, 오늘 다카이치 일본 총리와 6개월 만에 한일 정상회담을 갖습니다. 회담 후에는 APEC 정상회의가 열리는 중국 선전으로 이동합니다.", "pts": ["이재명 대통령은 필리핀 마닐라에서 열린 한-아세안 정상회의에서 AI와 문화창조산업 협력 구상을 제안했습니다.", "지난 6월 한-아세안 FTA 개선 협상 시작과 초국가 범죄 척결 공조 등 그간의 주요 성과도 함께 짚었습니다.", "이 대통령은 17일 다카이치 일본 총리와 만나 경제 협력과 저출산·고령화 문제 대응을 논의한 뒤 중국 선전으로 이동할 예정입니다."], "kw": ["이재명 대통령", "아세안", "한일정상회담", "AI 협력"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848809&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "국제", "h": "사상 첫 미중러 정상회담 19일 개최…'제2 얄타회담' 우려", "s": "오는 19일 중국 선전에서 미국과 중국, 러시아 간 사상 첫 3자 정상회담이 열립니다. 트럼프 미국 대통령은 핵군축과 이란, 우크라이나 전쟁 등을 논의하겠다고 밝혔습니다. 당사국을 배제한 세력권 논의가 이뤄질 수 있다는 '제2의 얄타회담' 우려 속에 한국 정부도 대응에 나섰습니다.", "pts": ["미국, 중국, 러시아 3국 정상은 오는 19일 중국 선전에서 사상 첫 3자 정상회담을 개최합니다.", "도널드 트럼프 미국 대통령은 이번 회담에서 비핵화와 이란 및 우크라이나 전쟁 등을 논의할 뜻을 표명했습니다.", "당사국이 배제된 채 한반도나 우크라이나 영토·안보 문제가 다뤄질 가능성이 제기되어 '제2의 얄타회담' 우려가 나오고 있습니다.", "우리 정부는 한반도 문제에서 한국의 국익이 훼손되어서는 안 된다는 입장을 미국과 중국 측에 전달했습니다."], "kw": ["미중러 정상회담", "트럼프", "제2 얄타회담", "우크라이나"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848709&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848761&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "국제", "h": "트럼프 \"중국서 김정은 만날 수도…시진핑에 달려\"", "s": "도널드 트럼프 미국 대통령이 중국 APEC 정상회의 기간에 김정은 북한 국무위원장과 만날 가능성을 띄웠습니다. 트럼프 대통령은 김 위원장의 방중 여부가 시진핑 중국 국가주석에게 달려 있다고 언급했습니다. 기존 백악관의 '계획 없음' 발표와 달라진 발언이어서 북미 정상회담 개최 여부에 관심이 쏠립니다.", "pts": ["트럼프 미국 대통령은 필리핀·중국 순방길에 오르며 중국에서 김정은 북한 국무위원장을 만날 수도 있다고 말했습니다.", "김 위원장의 방중 및 북미 회담 가능성에 대해 APEC 주최국인 중국 시진핑 주석의 역할에 공을 넘겼습니다.", "이는 당초 북미 회담 계획이 없다고 밝혔던 백악관 발표와는 달라진 기류로 해석됩니다.", "중간선거 참패로 정치적 위기에 처한 트럼프 대통령이 외교 성과를 내기 위해 북미 접촉 가능성을 타진한다는 분석이 나옵니다."], "kw": ["트럼프", "김정은", "시진핑", "북미회담"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848717&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848681&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "경제", "h": "삼성전자·SK하이닉스 또 급락…앤트로픽 상장·엔비디아 여파", "s": "삼성전자와 SK하이닉스 주가가 또다시 대폭 하락하며 코스피가 3.6% 내린 5,100선으로 후퇴했습니다. 외국인 투자자들이 19일 나스닥에 상장하는 앤트로픽 투자를 위해 8천400억 원 넘게 순매도한 점이 악영향을 미쳤습니다. 여기에 엔비디아의 지원 축소 우려까지 더해져 국내 증시의 변동성이 지속될 것으로 보입니다.", "pts": ["코스피가 3.6% 하락한 5,100으로 마감한 가운데 삼성전자가 4.2%, SK하이닉스가 6.9% 급락했습니다.", "외국인들이 오는 19일 나스닥 상장을 앞둔 AI 기업 앤트로픽 투자용 현금을 마련하고자 한국 반도체 주식을 대거 매도했습니다.", "엔비디아가 업계 자금 지원을 줄일 것이라는 위기감이 더해지며 협력사인 SK하이닉스의 낙폭이 더 커졌습니다.", "두 기업이 코스피 전체 영업이익의 73%를 차지하는 만큼 당분간 국내 증시의 출렁임이 이어질 전망입니다."], "kw": ["삼성전자", "SK하이닉스", "앤트로픽", "엔비디아"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848711&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "작은 모니터로 답 확인 세무사 수석 조사…자격시험 전수조사", "s": "세무사 시험 수석 합격자가 초소형 카메라와 생성형 AI, 작은 모니터를 이용해 부정행위를 했다고 자수해 경찰 조사를 받습니다. 한편 한국산업인력공단이 올해 AI 안경을 이용한 부정행위가 12건이나 됐다고 뒤늦게 털어놨습니다. 정부는 올해 공단이 시행한 국가자격시험 528개 종목 전체를 전수조사하기로 했습니다.", "pts": ["세무사 시험 수석 합격자가 초소형 카메라로 찍은 문제를 AI로 풀어 작은 모니터로 확인했다고 자수해 경찰 조사를 받습니다.", "산업인력공단은 스마트 안경을 활용한 부정행위 적발 건수가 올해 총 12건에 달했다고 뒤늦게 밝혔습니다.", "공단이 수사의뢰를 누락하거나 사전 민원을 방치했다는 비판이 쏟아지자 정부는 528개 국가자격시험 종목 전체에 대한 전수조사에 착수했습니다.", "경찰은 첨단 기기를 악용한 부정행위가 늘어남에 따라 전담 태스크포스를 구성해 집중 단속할 방침입니다."], "kw": ["AI 부정행위", "세무사 시험", "스마트 안경", "전수조사"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848805&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848817&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "나이 있어 못 잡아 교육장관 발언 논란…수능 연기는 부정", "s": "국회 교육위원회에서 최교진 교육부 장관이 AI 부정행위를 적발할 수 있겠냐는 질문에 \"나이가 있어 못할 것 같다\"고 답변해 무책임하다는 비판을 받았습니다. 교육부는 원천 차단의 어려움을 인정하면서도, 일각에서 제기된 수능 연기 가능성에는 선을 그었습니다. 뚜렷한 대책이 나오지 않으면서 수험생과 학부모의 불안감만 가중되고 있습니다.", "pts": ["국회 교육위원회에 출석한 최교진 교육부 장관이 AI 부정행위를 감독관이 잡을 수 있냐는 질의에 나이를 핑계 대며 못할 것 같다고 답해 논란이 일었습니다.", "교육부는 전파 차단이나 몸수색이 어려운 상황에서 AI 부정행위를 100% 막기는 쉽지 않다는 현실적 한계를 인정했습니다.", "여야 의원들은 부정행위 적발의 어려움을 지적하며 응시 자격 제한 기간을 대폭 늘리는 등 강력한 처벌 강화를 요구했습니다.", "시험 연기 요구에 대해 교육부는 더 큰 혼란을 막기 위해 수능 연기는 검토하지 않는다는 입장을 분명히 했습니다."], "kw": ["교육부 장관", "AI 부정행위", "수능 연기 불가", "국회 교육위"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848707&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848804&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "경제", "h": "미, 중국의 AI 반도체 원격접속 차단…동남아 수출도 통제", "s": "미국 정부가 엔비디아 등 첨단 AI 반도체에 대한 중국 기업의 원격 접속을 전면 통제하기로 했습니다. 미국산 슈퍼지능 반도체 연산 성능을 중국 등 안보 우려국에 제공하려면 당국의 사전 허가를 받아야 합니다. 또한 싱가포르와 태국 등 동남아 주요 국가로 칩을 수출할 때도 사전 승인을 거치도록 규제를 강화했습니다.", "pts": ["미 상무부 산업안보국은 첨단 AI 반도체 및 서버에 대한 중국 등 안보우려국 기업의 원격 접속을 제한하는 통제안을 시행합니다.", "제3국에 위치한 반도체라 할지라도 중국 기업에 연산 능력을 제공하기 위해서는 미국 정부의 사전 허가가 필수적입니다.", "우회 통로를 차단하기 위해 싱가포르, 말레이시아, 태국, 인도네시아 및 브라질 수출 시에도 사전 통제를 적용하기로 했습니다.", "이번 조치는 젠슨 황 전 엔비디아 CEO 관련 인물이 동남아 기업을 통해 중국에 밀반입 및 원격 접속을 제공했다는 의혹 직후 나왔습니다."], "kw": ["AI 반도체", "중국 통제", "원격접속 차단", "미 상무부"], "src": "SBS", "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008848764&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "정치", "h": "한덕수, 구속 만기 하루 전 19일 선고…계엄 내란 첫 판단", "s": "12·3 비상계엄 사태와 관련해 한덕수 전 총리의 내란 중요임무 종사 혐의 대법원 선고가 구속 만기 하루 전인 오는 19일 내려집니다. 이는 비상계엄이 내란에 해당하는지에 대한 대법원의 사상 첫 판단입니다. 재판 지연으로 인한 석방 논란 속에 대법원이 급히 선고 기일을 지정하면서 자초한 논란이라는 비판도 나옵니다.", "pts": ["대법원은 1·2심에서 유죄를 선고받은 한덕수 전 총리에 대한 전원합의체 판결을 구속만기 하루 전인 19일 선고합니다.", "이번 판결은 12·3 비상계엄 사태가 법률적으로 내란에 해당하는지에 대한 대법원의 첫 번째 공식 판단입니다.", "당초 구속만기일 심리 예정으로 석방 가능성이 떠오르자 대법원이 뒤늦게 기일을 잡으며 논란을 자초했다는 지적이 이어집니다.", "같은 날 김건희 씨의 3대 의혹 사건도 선고되며, 윤석열 전 대통령의 위증 혐의 선고는 오는 26일 진행될 예정입니다."], "kw": ["한덕수", "대법원 function text(n){return n.c+" 소식입니다. "+n.h+". "+n.s+" "+(n.pts||[]).join(". ")}
function chunks(s){return (s.match(/[^.!?。]+[.!?。]*\s*/g)||[s]).map(function(x){return x.trim()}).filter(Boolean)}

function lock(){try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(function(l){wl=l}).catch(function(){})}catch(e){}}
function unlock(){try{if(wl){wl.release();wl=null}}catch(e){}}
function loadCard(k){

  qi=k;ci=0;CH=chunks(text(n));mark(queue[k]);talk(true);
  $("np").textContent=(queue.length>1?(k+1)+"/"+queue.length+" · ":"")+n.h;
  var el=$("c"+queue[k]);if(el&&el.scrollIntoView)el.scrollIntoView({block:"center",behavior:"smooth"});
  return true;
}
function say(){
  if(paused||qi<0)return;
  if(ci>=CH.length){if(loadCard(qi+1))say();return}
  var my=++tok;
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(CH[ci]);
  u.lang="ko-KR";u.rate=parseFloat($("rate").value);
  var v=speechSynthesis.getVoices().filter(function(x){return x.lang&&x.lang.replace("_","-").toLowerCase().indexOf("ko")==0})[0];
  if(v)u.voice=v;
  u.onend=function(){if(my===tok&&!paused){ci++;say()}};
  u.onerror=function(){if(my===tok&&!paused){ci++;say()}};
  speechSynthesis.speak(u);
}
function start(list){stop();if(!TTS||!list.length)return;queue=list;lock();if(loadCard(0))say()}
function stop(){tok++;paused=false;qi=-1;queue=[];CH=[];if(TTS)speechSynthesis.cancel();mark(-1);talk(false);unlock();$("pp").textContent="⏸";$("np").textContent=NP0}
$("list").addEventListener("click",function(e){
  var s=e.target.closest("[data-s]");
  if(s){start([+s.dataset.s]);return}
  var t=e.target.closest(".tg");
  if(t){var c=$("c"+t.dataset.i);var o=c.classList.toggle("open");t.setAttribute("aria-expanded",o)}
});
$("t0").onclick=function(){stop();tab=0;render()};
$("t1").onclick=function(){stop();tab=1;render()};
$("all").onclick=function(){start(DATA[tab].items.map(function(_,i){return i}))};
$("pp").onclick=function(){
  if(!TTS||qi<0)return;
  if(paused){paused=false;$("pp").textContent="⏸";talk(true);say()}
  else{paused=true;tok++;speechSynthesis.cancel();talk(false);$("pp").textContent="▶"}
};
$("stop").onclick=stop;
$("rate").onchange=function(){try{localStorage.setItem("rate",$("rate").value)}catch(e){}};
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&qi>=0&&!paused)lock()});
if(!TTS)document.querySelector(".bar").style.display="none";
$("np").textContent=NP0;
render();
</script>
</body>
</html>
