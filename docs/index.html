<html lang="ko">
<head>
<meta charset="utf-8">

<style>
:root{--bg:#fff6f0;--card:#fff;--ink:#4a3a3a;--sub:#8a7468;--bd:#f0dcc6;--accent:#ff6f91;--onacc:#fff;--tint:#e3f3ff;--tbd:#bfe0f7;
--skyM:linear-gradient(170deg,#ffe3b3,#ffc2d4 55%,#b9ddff);--onM:#4a3a3a;
--skyE:linear-gradient(170deg,#5b4aa8,#8f5db8 60%,#c26aa9);--onE:#fff;
--disp:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
--sans:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1830;--card:#2b2344;--ink:#fff1e6;--sub:#c4b6d9;--bd:#40355f;--accent:#ff8fab;--onacc:#2a1730;--tint:#1f3350;--tbd:#2f4d75;
--skyM:linear-gradient(170deg,#5a4263,#8a5566 55%,#3b5c8f);--onM:#fff;--skyE:linear-gradient(170deg,#171236,#2d2160 55%,#5a3070);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1e1830;--card:#2b2344;--ink:#fff1e6;--sub:#c4b6d9;--bd:#40355f;--accent:#ff8fab;--onacc:#2a1730;--tint:#1f3350;--tbd:#2f4d75;
--skyM:linear-gradient(170deg,#5a4263,#8a5566 55%,#3b5c8f);--onM:#fff;--skyE:linear-gradient(170deg,#171236,#2d2160 55%,#5a3070);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;word-break:keep-all;overflow-wrap:break-word}
body[data-tab="m"]{--sky:var(--skyM);--on:var(--onM)}
body[data-tab="e"]{--sky:var(--skyE);--on:var(--onE)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
body[data-tab="m"] .e-only,body[data-tab="e"] .m-only{display:none}

/* 하늘 + 뉴콩이 */
.sky{position:relative;overflow:hidden;background:var(--sky);color:var(--on);border-radius:0 0 34px 34px;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 20px;transition:background .4s}
.sky-in{position:relative;max-width:640px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-family:var(--disp);font-weight:400;font-size:29px;line-height:1.25;margin:0}
.date{margin:4px 0 0;font-size:14px;opacity:.85}
.hi{font-family:var(--disp);font-size:16px;margin-top:2px}
.orb{position:absolute;right:120px;top:2px;width:40px;height:40px;border-radius:50%}
body[data-tab="m"] .orb{background:radial-gradient(circle at 40% 40%,#fffbe0,#ffd566 65%);box-shadow:0 0 20px 6px rgba(255,214,102,.6)}
body[data-tab="e"] .orb{background:#fff7d6;box-shadow:inset -9px -3px 0 0 rgba(140,110,190,.55),0 0 18px 3px rgba(255,255,255,.3)}
.deco{position:absolute;font-size:20px;pointer-events:none}
.d1{right:36%;top:46px}.d2{right:10px;top:4px;font-size:15px}.d3{left:52%;top:8px;font-size:14px}
.mascot-wrap{position:relative;flex:none;width:100px}
.mascot{display:block;width:100px;height:100px;overflow:visible}
.mascot *{transform-box:fill-box}
.eyes-shut,.mouth-talk{display:none}
body[data-tab="m"] .eyes-shut{display:none}
body[data-tab="e"]:not(.talk) .eyes-open{display:none}
body[data-tab="e"]:not(.talk) .eyes-shut{display:inline}
.wave{transform-origin:50% 85%;animation:wave 1.8s ease-in-out infinite}
body[data-tab="e"] .wave{animation:none}
.zz{font-family:var(--disp);font-size:15px;fill:#fff;animation:zz 2.4s ease-in-out infinite}
.talk .mouth{display:none}
.talk .mouth-talk{display:inline;transform-origin:center;animation:yap .32s ease-in-out infinite alternate}
.talk .bob{animation:bob .5s ease-in-out infinite alternate}
.note{position:absolute;font-size:18px;opacity:0;color:var(--on)}
.n1{left:-4px;top:6px}.n2{right:-2px;top:-4px}
.talk .note{animation:note 1.5s ease-out infinite}
.talk .n2{animation-delay:.7s}
@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(22deg)}}
@keyframes yap{from{transform:scaleY(.35)}to{transform:scaleY(1.25)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes zz{0%,100%{opacity:.4;transform:translateY(2px)}50%{opacity:1;transform:translateY(-3px)}}
@keyframes note{0%{opacity:0;transform:translateY(8px)}30%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
.notice{display:inline-block;margin:10px 0 14px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.35);font-size:12.5px}
.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.3);max-width:340px}
.tab{flex:1;padding:9px 0;border:0;border-radius:999px;background:transparent;font-family:var(--disp);font-size:16px;color:var(--on)}
.tab[aria-selected="true"]{background:#fff;color:#4a3a3a;box-shadow:0 2px 0 rgba(0,0,0,.12)}

main{max-width:640px;margin:0 auto;padding:18px 16px 160px}
.tl{font-size:13px;color:var(--sub);margin:0 0 12px 4px}
.empty{color:var(--sub);font-size:15px;padding:36px 0;text-align:center}

/* 말랑한 기사 카드: 번호 = 전체 듣기 재생 순서 */
.row{--bd2:var(--bd);background:var(--card);border:2px solid var(--bd);border-radius:24px;margin-bottom:14px;box-shadow:0 4px 0 var(--bd);transition:border-color .2s,box-shadow .2s}
@supports (color:color-mix(in srgb,red,blue)){.row{--bd2:color-mix(in srgb,var(--c) 35%,var(--bg));border-color:var(--bd2);box-shadow:0 4px 0 var(--bd2)}}
.row.playing{border-color:var(--c);box-shadow:0 4px 0 var(--c)}
.head{display:grid;grid-template-columns:38px 1fr 44px;gap:10px;padding:14px}
.no{width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;font-family:var(--disp);font-size:19px;display:grid;place-items:center}
.playing .no{animation:hop .6s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-4px)}}
.tg{text-align:left;background:none;border:0;padding:0;min-width:0}
.cat{display:inline-flex;align-items:center;gap:6px;font-family:var(--disp);font-size:13px;color:var(--c);padding:1px 10px;border-radius:999px;border:1.5px solid var(--c)}
.tg h2{font-family:var(--disp);font-weight:400;font-size:18px;line-height:1.45;margin:6px 0 6px}
.tg p{margin:0;color:var(--sub);font-size:14.5px}
.more{display:inline-block;margin-top:8px;font-family:var(--disp);font-size:13px;color:var(--accent)}
.more::after{content:" ▾"}
.open .more::after{content:" ▴"}
.spk{width:44px;height:44px;border-radius:50%;border:2px solid var(--bd);background:var(--bg);font-size:18px;transition:background .2s}
.playing .spk{background:var(--c);border-color:var(--c)}
.eq{display:none;gap:2px;align-items:flex-end;height:11px}
.playing .eq{display:inline-flex}
.eq i{width:3px;background:var(--c);border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.25s}.eq i:nth-child(3){animation-delay:.5s}
@keyframes eq{0%,100%{height:3px}50%{height:11px}}

.detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease;margin:0 14px 0 62px;font-size:14px}
.open .detail{grid-template-rows:1fr}
.detail>div{overflow:hidden}
.open .detail>div{padding-bottom:16px}
.detail h3{font-family:var(--disp);font-weight:400;font-size:13px;color:var(--sub);margin:12px 0 4px}
.detail ul{margin:0;padding-left:18px}
.detail li{margin-bottom:3px}
.kw span{display:inline-block;font-size:12.5px;background:var(--bg);border-radius:999px;padding:0 10px;margin:0 4px 4px 0;color:var(--sub)}
.src{font-size:12.5px;color:var(--sub)}
.lk a{display:inline-block;font-size:13px;color:var(--accent);margin-right:14px}

/* 날씨 */
.wx{background:var(--tint);border-color:var(--tbd);box-shadow:0 4px 0 var(--tbd)}
.wx .no{background:var(--card);font-size:22px;color:inherit}

/* 플레이어 */
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:616px;margin:0 auto;background:var(--card);border:2px solid var(--bd);border-radius:26px;padding:10px 12px;box-shadow:0 4px 0 var(--bd),0 12px 24px rgba(60,30,40,.15);z-index:5}
.np{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px 8px}
.ctl{display:flex;gap:8px;align-items:center}
.ctl button,.ctl select{height:44px;border:2px solid var(--bd);background:var(--bg);color:var(--ink);border-radius:16px;font-family:var(--disp);font-size:16px;padding:0 14px}
.ctl .main{flex:1;background:var(--accent);border-color:var(--accent);color:var(--onacc)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

://news.sbs.co.kr/news/endPage.do?news_id=N1008850474&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008850475&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008850413&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "경제", "h": "코스피, 외국인 매도에 5천 선 붕괴…AI 악재 직격탄", "s": "외국인의 거센 매도 공세에 코스피가 결국 5천 선 아래로 내려앉았습니다. 미국 대중 반도체 규제와 대형 IPO를 앞둔 불확실성이 복합적으로 작용했다는 분석입니다.", "pts": ["코스피가 4거래일 연속 하락하며 9개월 만에 5천 선 아래로 무너졌습니다.", "외국인의 대규모 매도세로 삼성전자와 SK하이닉스 등 대형 반도체주가 큰 폭으로 하락했습니다.", "젠슨 황 관련 불확실성과 앤트로픽 나스닥 상장을 앞둔 투자 자금 마련 등이 하락 원인으로 꼽혔습니다."], "kw": ["코스피", "반도체", "외국인매도", "증시"], "src": ["SBS"], "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008850483&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008850411&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008850412&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "사회", "h": "생일 모임서 상인들로부터 돈 봉투 받은 경찰 간부 입건", "s": "자신의 생일 모임에서 관할 지역 상인들로부터 돈 봉투를 받은 혐의로 경찰 간부가 입건됐습니다. 경찰은 일종의 보호비 명목이었는지 수사를 확대하고 있습니다.", "pts": ["서울경찰청 광역수사단은 구로경찰서 소속 김 모 경감을 청탁금지법 위반 혐의로 입건했습니다.", "김 경감은 지난 8월 관할 상인 등 20여 명과 가진 생일 모임에서 돈 봉투를 받은 혐의를 받고 있습니다.", "경찰은 과거 근무 지역 특성과 대가성 여부를 확인하기 위해 압수수색 및 CCTV 분석을 진행 중입니다."], "kw": ["경찰", "돈봉투", "청탁금지법", "수사"], "src": ["SBS"], "links": [{"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008850386&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008850447&plink=RSSLINK&cooper=RSSREADER"}, {"s": "SBS", "u": "https://news.sbs.co.kr/news/endPage.do?news_id=N1008850468&plink=RSSLINK&cooper=RSSREADER"}]}, {"c": "정치", "h": "청와대, 미중러 3자 회담에 \"국익 직결 사안 반영돼야\"", "s": "청와대는 사상 첫 미·중·러 3자 정상회담과 관련해 한반도 문제 등 국익과 직결되는 사안에 우리 이해관계가 반영되어야 한다는 입장을 밝혔습니다. 관련국들과 긴밀히 소통 중입니다.", "pts": ["미·중·러 3자 정상회담 개최를 앞두고 제2의 얄타회담 우려 등에 대한 정부 입장이 나왔습니다.", "청와대는 }

  var u=new SpeechSynthesisUtterance(CH[ci]);
  u.lang="ko-KR";u.rate=parseFloat($("rate").value);
  var v=speechSynthesis.getVoices().filter(function(x){return x.lang&&x.lang.replace("_","-").toLowerCase().indexOf("ko")==0})[0];
  if(v)u.voice=v;
  u.onend=function(){if(my===tok&&!paused){ci++;say()}};
  u.onerror=function(){if(my===tok&&!paused){ci++;say()}};
  speechSynthesis.speak(u);
}
function start(list){stop();if(!TTS||!list.length)return;queue=list;lock();if(loadCard(0))say()}
function stop(){tok++;paused=false;qi=-1;queue=[];CH=[];if(TTS)speechSynthesis.cancel();mark(-1);talk(false);unlock();$("pp").textContent="⏸";$("np").textContent=NP0}
$("list").addEventListener("click",function(e){
  var s=e.target.closest("[data-s]");
  if(s){start([+s.dataset.s]);return}
  var t=e.target.closest(".tg");
  if(t){var c=$("c"+t.dataset.i);var o=c.classList.toggle("open");t.setAttribute("aria-expanded",o)}
});
$("t0").onclick=function(){stop();tab=0;render()};
$("t1").onclick=function(){stop();tab=1;render()};
$("all").onclick=function(){start(DATA[tab].items.map(function(_,i){return i}))};
$("pp").onclick=function(){
  if(!TTS||qi<0)return;
  if(paused){paused=false;$("pp").textContent="⏸";talk(true);say()}
  else{paused=true;tok++;speechSynthesis.cancel();talk(false);$("pp").textContent="▶"}
};
$("stop").onclick=stop;
$("rate").onchange=function(){try{localStorage.setItem("rate",$("rate").value)}catch(e){}};
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&qi>=0&&!paused)lock()});
if(!TTS)document.querySelector(".bar").style.display="none";
$("np").textContent=NP0;
render();
</script>
</body>
</html>
